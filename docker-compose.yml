services:
  postgres:
    image: postgres:17-alpine
    environment:
      POSTGRES_DB: linier_crm
      POSTGRES_USER: linier
      POSTGRES_PASSWORD: linier
    ports:
      - "5432:5432"
    volumes:
      - postgres-data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U linier -d linier_crm"]
      interval: 5s
      timeout: 5s
      retries: 10

  app:
    build: .
    env_file: .env
    environment:
      DATABASE_URL: postgresql://linier:linier@postgres:5432/linier_crm?schema=public
    ports:
      - "3000:3000"
    depends_on:
      postgres:
        condition: service_healthy

volumes:
  postgres-data:
