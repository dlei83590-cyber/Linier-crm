        Action API（不 PATCH status）：匹配 ApprovalPolicy（module=QUOTATION，按 totalAmount 命中 rule，priority DESC）
        → 创建 WorkflowInstance（status=RUNNING + SUBMIT action/history + 首步审批人）→ 回写 workflowInstanceId + status=SUBMITTED
