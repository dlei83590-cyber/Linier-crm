        customerInvestment: { type: number, nullable: true }
        expectedRevenue: { type: number, nullable: true }
        expectedCost: { type: number, nullable: true }
        grossProfit: { type: number, nullable: true }
        expenseBudget: { type: number, nullable: true }
        salesTarget: { type: number, nullable: true }
        paymentStatus: { $ref: "#/components/schemas/PaymentStatus" }
        competitors: { type: array, items: { type: object }, nullable: true }
        successProbability: { type: number, nullable: true }
        ownerId: { type: string, nullable: true }
        description: { type: string, nullable: true }
        version: { type: integer }
    ProjectOpportunityResponse:
      type: object
