  # ==========================================================================
  # Sprint 4E-2 Receipt & Payment Allocation（收款与核销领域）
  # 边界锁死（CTO Design Review 97/100 + 实施锁定，Final Review 检查点）：
  # ① Receipt 创建 ≠ Allocation——POST /api/receipts 只记录实际收到的钱（UNALLOCATED），核销走显式 allocate；
  # ② Allocation 必须同 Customer / 同 Currency——否则 409 RECEIPT_CUSTOMER_MISMATCH / RECEIPT_CURRENCY_MISMATCH（第一版禁止跨币种核销）；
  # ③ Reversal ≠ Credit Note——Allocation Reversal 解除核销关系并留痕（reversedAt/reversedBy/reverseReason，不删除原记录）；
  #    CN 属 4E-3 发票调整域，不承担收款冲销（银行退票不是 CN）；
  # ④ WriteOff Approval ≠ Apply——审批（Workflow）只回写投影，Apply 才是唯一修改 AR.writeOffAmount/balanceAmount 的入口；
  # ⑤ WriteOff 只减 Invoice.balanceAmount 投影，绝不增加 Invoice.paidAmount（WriteOff ≠ Payment，防止报表把坏账误判为客户付款）。
  # ==========================================================================
  /api/receipts:
    post:
      tags: [Receipts]
      summary: Create receipt (records money received only; NO allocation — creation is separated from allocation)
      description: |
        创建收款单（拍板①：创建与核销分离）。只记录实际收到的钱：status=UNALLOCATED、unallocatedAmount=amount、allocatedAmount=0；
        **不自动核销**（核销走显式 POST /api/receipts/{id}/allocate，一次请求原子化）。
        拍板④：code 由 DocumentSequence 创建即取号（RCT-2026-xxxx）——Receipt 是实际收款凭证，创建即成为财务事实。
        硬规则：customerId/currency 由调用方提供；核销时校验与目标 AR 一致（409 RECEIPT_CUSTOMER_MISMATCH / RECEIPT_CURRENCY_MISMATCH）。
        红线：金额/状态为受控投影（allocatedAmount/unallocatedAmount/status），禁止 PATCH。
      operationId: createReceipt
      security:
        - bearerAuth: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/ReceiptCreate"
      responses:
        "201":
          description: Created（status=UNALLOCATED；含 code/amount/unallocatedAmount）
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ReceiptResponse"
        "400":
          $ref: "#/components/responses/BadRequest"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "403":
          $ref: "#/components/responses/Forbidden"
    get:
      tags: [Receipts]
      summary: List receipts (paginated; customerId/status/currency filters)
      description: |
        收款单列表（分页 + customerId/status/currency 过滤 + createdAt desc）。只读——金额/状态为受控投影，无任何写操作。
        每项含 customer 摘要（id/code/name）与 allocations 计数。
      operationId: listReceipts
      security:
        - bearerAuth: []
      parameters:
        - { name: page, in: query, required: false, schema: { type: integer, default: 1 } }
        - { name: pageSize, in: query, required: false, schema: { type: integer, default: 20, maximum: 100 } }
        - { name: customerId, in: query, required: false, schema: { type: string } }
        - { name: status, in: query, required: false, schema: { $ref: "#/components/schemas/ReceiptStatus" } }
        - { name: currency, in: query, required: false, schema: { type: string } }
      responses:
        "200":
          description: OK（分页列表）
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ReceiptListResponse"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "403":
          $ref: "#/components/responses/Forbidden"

  /api/receipts/{id}:
    get:
      tags: [Receipts]
      summary: Get receipt detail (Receipt + Customer summary + allocations + latest revision/snapshot)
      description: |
        收款单详情：一次带出 Customer 摘要 + allocations（含 AR 摘要，按 allocatedAt desc，即 Allocation 查询入口）
        + 最近 Revision/Snapshot。注意：无 PATCH——金额/状态为受控投影（拍板②），只能由 allocate/reversal/void 事务更新。
      operationId: getReceipt
      security:
        - bearerAuth: []
      parameters:
        - { name: id, in: path, required: true, schema: { type: string } }
      responses:
        "200":
          description: OK
