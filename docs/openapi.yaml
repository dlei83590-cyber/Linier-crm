      summary: List invoice lines (read-only; lines are system-generated, no POST/PATCH)
      description: |
        行只读（CTO Review 96/100 锁定项③：InvoiceLine 系统生成只读，禁止自由编辑）。
        含 item + priceSnapshot 摘要。
