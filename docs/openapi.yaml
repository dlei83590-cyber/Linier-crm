        "404":
          $ref: "#/components/responses/NotFound"

  /api/receipts/{id}/void:
    post:
      tags: [Receipts]
      summary: Void receipt (UNALLOCATED only; allocated receipts must reverse first)
      description: |
        作废收款单（拍板②：VOID 规则）。仅 **UNALLOCATED**（未核销）可 VOID；
        **已有核销不得直接 VOID**（必须先 Allocation Reversal 解除全部核销）——否则 409 RECEIPT_VOID_FORBIDDEN。
        边界：Void 只作废收款事实本身，**不实现 Credit Note 语义**（CN 属 4E-3 发票调整域，不承担收款冲销）。
        事务：Lock Receipt（FOR UPDATE）→ 校验状态 → status=VOIDED + voidedAt/voidedById → Revision + Snapshot(VOIDED) → 事件（事务外）。
      operationId: voidReceipt
      security:
        - bearerAuth: []
      parameters:
        - { name: id, in: path, required: true, schema: { type: string } }
      requestBody:
        required: false
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/ReceiptVoidRequest"
      responses:
        "201":
          description: Created（status=VOIDED）
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ReceiptResponse"
        "400":
          $ref: "#/components/responses/BadRequest"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "403":
          $ref: "#/components/responses/Forbidden"
        "404":
          $ref: "#/components/responses/NotFound"
        "409":
          description: Conflict（已作废 / 已有核销不可直接 VOID——RECEIPT_VOID_FORBIDDEN）
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"

  /api/receipt-allocations/{id}/reverse:
    post:
      tags: [Receipt Allocations]
      summary: Reverse allocation (undo allocation; restores AR/Invoice/Receipt projections; NOT a Credit Note)
      description: |
        Allocation Reversal（CTO Design Review 新锁定边界）。解除原核销关系：
        **不删除原 ReceiptAllocation**——写入 reversedAt/reversedBy/reverseReason 留痕（独立逆向事实）；
        恢复 AR / Invoice / Receipt 三方投影（AR.paidAmount 回退、balanceAmount 重算、status 投影；Invoice 投影回退；
        Receipt allocatedAmount/unallocatedAmount 恢复、status 投影 → UNALLOCATED/PARTIALLY_ALLOCATED）。
        **Reversal ≠ Credit Note**：CN 属 4E-3 发票调整域（冲减开票金额），不承担收款冲销（如银行退票——原 Invoice 金额未变，变的是这笔钱实际没收到）。
        事务顺序（对齐 Allocation 锁序）：Lock Receipt → Lock AR（FOR UPDATE）→ 校验 Allocation 存在且未冲销
        → 回退三方投影 → AR Revision + Receipt Revision/Snapshot(REVERSED) → 事件 ReceiptAllocationReversed。
        重复冲销 → 409 RECEIPT_ALLOCATION_REVERSED。
      operationId: reverseReceiptAllocation
      security:
        - bearerAuth: []
      parameters:
        - { name: id, in: path, required: true, schema: { type: string } }
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/ReceiptAllocationReverseRequest"
      responses:
        "200":
          description: OK（reversedAmount + 三方新状态）
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ReceiptAllocationReverseResponse"
        "400":
          $ref: "#/components/responses/BadRequest"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "403":
          $ref: "#/components/responses/Forbidden"
        "404":
          $ref: "#/components/responses/NotFound"
        "409":
          description: Conflict（已冲销 RECEIPT_ALLOCATION_REVERSED）
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"

  /api/write-offs:
    post:
      tags: [Write Offs]
      summary: Create write-off (DRAFT + allocations; same Customer/Currency enforced; does NOT modify AR)
      description: |
        创建 WriteOff（拍板③：WriteOff + WriteOffAllocation 独立事实，不做三件套；拍板④：DocumentSequence 创建即取号 WO-2026-xxxx）。
        校验（CTO 指令）：① 全部目标 AR 存在；② **同 Customer / 同 Currency**（否则 409 WRITE_OFF_SOURCE_NOT_COMPATIBLE）；
        ③ 每笔 amount > 0；④ amount = Σ allocations（服务端 computeWriteOffTotal，禁止直传头金额）。
        **暂不修改 AR**——审批通过 ≠ 自动修改余额；只有显式 Apply 才回写（CTO 锁死：APPROVED ≠ APPLIED）。
        事件：WriteOffCreated（事务外，失败降级不阻断）。
      operationId: createWriteOff
      security:
        - bearerAuth: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/WriteOffCreate"
      responses:
        "201":
          description: Created（status=DRAFT + allocations）
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/WriteOffResponse"
        "400":
          $ref: "#/components/responses/BadRequest"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "403":
          $ref: "#/components/responses/Forbidden"
        "404":
          $ref: "#/components/responses/NotFound"
        "409":
          description: Conflict（目标 AR 非同 Customer/Currency——WRITE_OFF_SOURCE_NOT_COMPATIBLE）
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"
    get:
      tags: [Write Offs]
      summary: List write-offs (paginated; status/customerId filters)
      description: WriteOff 列表（分页 + status/customerId 过滤 + createdAt desc）。只读——WriteOff 为独立事实，金额/状态由 submit/apply 事务驱动，无 PATCH。
      operationId: listWriteOffs
      security:
        - bearerAuth: []
      parameters:
        - { name: page, in: query, required: false, schema: { type: integer, default: 1 } }
        - { name: pageSize, in: query, required: false, schema: { type: integer, default: 20, maximum: 100 } }
        - { name: status, in: query, required: false, schema: { $ref: "#/components/schemas/WriteOffStatus" } }
        - { name: customerId, in: query, required: false, schema: { type: string } }
      responses:
        "200":
          description: OK（分页列表，含 allocations + AR 摘要）
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/WriteOffListResponse"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "403":
          $ref: "#/components/responses/Forbidden"

  /api/write-offs/{id}/submit:
    post:
      tags: [Write Offs]
      summary: Submit write-off (DRAFT → SUBMITTED; conditional workflow trigger)
      description: |
        DRAFT → SUBMITTED（CTO 指令）。同事务调用 maybeTriggerWriteOffApproval()（module=WRITE_OFF 策略按 writeOff.amount 匹配金额区间）：
        - **命中策略** → 创建/复用 Workflow 实例，approvalStatus=PENDING → **必须等 APPROVED 后才能 Apply**（Apply 路由门禁 409 WRITE_OFF_APPROVAL_REQUIRED）；
        - **未命中策略** → 保持 SUBMITTED（approvalStatus 仍 DRAFT）→ **可直接进入可 Apply 状态**。
        **不修改 AR**（审批通过 ≠ 自动修改余额；只有显式 Apply 才回写——CTO 锁死）。
        事件：WriteOffSubmitted + WriteOffApprovalStarted（命中策略时；失败降级不阻断）。
      operationId: submitWriteOff
      security:
        - bearerAuth: []
      parameters:
        - { name: id, in: path, required: true, schema: { type: string } }
      requestBody:
        required: false
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/WriteOffSubmitRequest"
      responses:
        "200":
          description: OK（status=SUBMITTED + approvalStatus + workflowTriggered/instanceId/skipped）
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/WriteOffSubmitResponse"
        "400":
          $ref: "#/components/responses/BadRequest"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "403":
          $ref: "#/components/responses/Forbidden"
        "404":
          $ref: "#/components/responses/NotFound"
        "409":
          description: Conflict（仅 DRAFT 可提交——WRITE_OFF_INVALID_STATE）
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"

  /api/write-offs/{id}/apply:
    post:
      tags: [Write Offs]
      summary: Apply write-off (the ONLY entry that writes AR.writeOffAmount/balanceAmount; APPROVED ≠ APPLIED)
      description: |
        WriteOff Apply——**唯一回写 AR.writeOffAmount/balanceAmount 的动作**（CTO 锁死：APPROVED ≠ APPLIED，审批通过 ≠ 自动修改余额）。
        事务红线（Final Review 检查点）：锁 WriteOff（FOR UPDATE）→ 锁全部目标 AR（**id ASC FOR UPDATE**，防死锁）→
        状态门禁（APPLIED → 409 WRITE_OFF_ALREADY_APPLIED 幂等；非 SUBMITTED → 409 WRITE_OFF_INVALID_STATE；
        命中审批但未 APPROVED → 409 WRITE_OFF_APPROVAL_REQUIRED；无策略可直接 Apply）→
        每笔 allocationAmount ≤ AR.balanceAmount（否则 409 WRITE_OFF_AMOUNT_EXCEEDED）→ 同事务：
        AR.writeOffAmount += allocation / balanceAmount 重算（computeBalance 单入口）/ status 投影 →
        **Invoice.balanceAmount 投影同步减少，但 Invoice.paidAmount 绝不因 write-off 增加（WriteOff ≠ Payment，防止报表把坏账误判为客户付款）** →
        AR Revision + Snapshot(snapshotSource=WRITE_OFF) → WriteOff status=APPLIED + appliedAt/appliedById →
        事件 WriteOffApplied + AccountsReceivableWrittenOff（事务外；事件失败可降级，但 DB 事实更新不静默失败）。
      operationId: applyWriteOff
      security:
        - bearerAuth: []
      parameters:
        - { name: id, in: path, required: true, schema: { type: string } }
      requestBody:
        required: false
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/WriteOffApplyRequest"
      responses:
        "201":
          description: Created（status=APPLIED + appliedAt + arIds + totalApplied）
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/WriteOffApplyResponse"
        "400":
          $ref: "#/components/responses/BadRequest"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "403":
          $ref: "#/components/responses/Forbidden"
        "404":
          $ref: "#/components/responses/NotFound"
        "409":
          description: Conflict（重复 Apply WRITE_OFF_ALREADY_APPLIED / 状态不允许 WRITE_OFF_INVALID_STATE / 未审批 WRITE_OFF_APPROVAL_REQUIRED / 超余额 WRITE_OFF_AMOUNT_EXCEEDED）
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"

  # ==========================================================================
  # Sprint 4E-3 Credit Note / Debit Note（发票调整与应收调整领域；ADR-0022 + CTO 98/100）
  # 财务边界（锁死）：
  #   ① CN/DN **不修改原 Invoice 金额事实**（invoiceTotal/行快照/InvoiceSnapshot 一律不动）
  #   ② **APPROVED ≠ APPLIED**（审批只回写投影；Apply 才产生财务事实）
  #   ③ **只有 Apply 创建 InvoiceAdjustment 并修改 AR.adjustedAmount**（唯一入口；客户端禁直接创建事实）
  #   ④ **CN 为负 adjustment（<0）、DN 为正 adjustment（>0）**——全系统唯一符号口径
  #   ⑤ **负 AR = Customer Credit projection**（不新增 CREDIT 数据库状态；禁止继续 Receipt Allocation / WriteOff）
  # ==========================================================================
  /api/credit-debit-notes:
    post:
      tags: [Credit Debit Notes]
      summary: Create Credit Debit Note (DRAFT + lines; single-invoice; snapshot copy, no Pricing Engine)
      description: |
        CreditDebitNote 创建（单票制）：
        - `sourceInvoiceId` 必填且**单票制**（跨票 Consolidated 延后）；只接受已 **ISSUED** 的 Invoice
          （否则 409 `CN_DN_SOURCE_INVOICE_INVALID`）
        - Customer/Currency **从原 Invoice 继承**（禁止客户端传）；全部 `sourceInvoiceLineId` 必须属于该 Invoice
          （否则 409 `CN_DN_SOURCE_LINE_INVALID`）
        - 数量必须 > 0；**金额/税率/价格只复制原 InvoiceLine 快照，不调用 Pricing Engine**；
          编号创建即取现有 CN/DN DocumentSequence（CN-/DN-2026-xxxx）；adjustmentTotal = Σ lines 服务端计算
        - **Create 不做事实落账**：不创建 InvoiceAdjustment、不改 AR、不改 Invoice.balanceAmount
          （事实由 Apply 事务生成——边界③）
        - 累计防超调预检查（软校验，最终强校验在 Apply）：CREDIT 按行聚合已 APPLIED 未撤销 Credit 数量，
          remaining = 原行数量 - 累计，本次超 remaining → 409 `CN_DN_QUANTITY_EXCEEDED`
      operationId: createCreditDebitNote
      security:
        - bearerAuth: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/CreditDebitNoteCreateRequest"
      responses:
        "201":
          description: Created（DRAFT + lines；creditDebitNote）
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/CreditDebitNoteResponse"
        "400":
          $ref: "#/components/responses/BadRequest"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "403":
          $ref: "#/components/responses/Forbidden"
        "409":
          description: Conflict（源 Invoice 非 ISSUED / 明细行不属于该 Invoice / 数量超剩余可调整数量）
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"
    get:
      tags: [Credit Debit Notes]
      summary: List credit debit notes (paginated; status/noteType/customerId filters)
      description: |
        列表查询（分页 + status/noteType/customerId 过滤 + createdAt desc；只读，无 PATCH）。
        一次带出：sourceInvoice 摘要（id/code/invoiceTotal/balanceAmount）+ lines（lineNo asc）。
        只读语义：CreditDebitNote 为独立事实，金额/状态由 submit/apply 事务驱动。
      operationId: listCreditDebitNotes
      security:
        - bearerAuth: []
      parameters:
        - { name: page, in: query, schema: { type: integer, default: 1 } }
        - { name: pageSize, in: query, schema: { type: integer, default: 20 } }
        - { name: status, in: query, schema: { type: string } }
        - { name: noteType, in: query, schema: { type: string } }
        - { name: customerId, in: query, schema: { type: string } }
      responses:
        "200":
          description: OK（分页列表）
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/CreditDebitNoteListResponse"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "403":
          $ref: "#/components/responses/Forbidden"

  /api/credit-debit-notes/{id}/submit:
    post:
      tags: [Credit Debit Notes]
      summary: Submit Credit Debit Note (DRAFT → SUBMITTED; conditional workflow trigger)
      description: |
        Submit（DRAFT → SUBMITTED；否则 409 `CN_DN_INVALID_STATE`）：
        - 同事务调用 maybeTriggerCreditDebitNoteApproval（module=CREDIT_DEBIT_NOTE 按 note.adjustmentTotal 匹配金额区间）：
          - **命中策略** → 创建/复用 Workflow 实例 + approvalStatus=PENDING → **必须 APPROVED 后才能 Apply**（边界②）
          - **未命中策略** → 保持 SUBMITTED（可直接进入可 Apply 状态）
        - **Workflow 配置异常必须让事务回滚，不能静默**（命中策略后 WorkflowDefinition 缺失 → 409 `CN_DN_WORKFLOW_FAILED`）
        - **红线：Submit 绝不修改 AR.adjustedAmount**（边界③；也不创建 InvoiceAdjustment、不改 Invoice.balanceAmount）
      operationId: submitCreditDebitNote
      security:
        - bearerAuth: []
      parameters:
        - { name: id, in: path, required: true, schema: { type: string } }
      requestBody:
        required: false
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/CreditDebitNoteSubmitRequest"
      responses:
        "200":
          description: OK（SUBMITTED + approvalStatus + workflowTriggered）
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/CreditDebitNoteSubmitResponse"
        "400":
          $ref: "#/components/responses/BadRequest"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "403":
          $ref: "#/components/responses/Forbidden"
        "404":
          $ref: "#/components/responses/NotFound"
        "409":
          description: Conflict（非 DRAFT 状态 / 工作流配置异常）
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"

  /api/credit-debit-notes/{id}/apply:
    post:
      tags: [Credit Debit Notes]
      summary: Apply Credit Debit Note (the ONLY entry that writes AR.adjustedAmount; APPROVED ≠ APPLIED)
      description: |
        CreditDebitNote Apply——**唯一修改 AR.adjustedAmount / balanceAmount 的动作**（CTO 98/100 锁死；边界②③）。
        事务（严格锁序，任何一步失败整体回滚）：Lock Note（FOR UPDATE）→ 状态门禁
        （APPLIED → 409 `CN_DN_ALREADY_APPLIED` 幂等；非 SUBMITTED → 409 `CN_DN_INVALID_STATE`；
        命中审批未 APPROVED → 409 `CN_DN_APPROVAL_REQUIRED`）→ Lock Invoice → Lock InvoiceLines（id ASC）→
        Lock AR（id ASC）→ 校验 customerId/currency（409 `CN_DN_SOURCE_NOT_COMPATIBLE`）→
        **累计防超调（锁内重算）**：
        - **CREDIT**：`remainingAdjustableQty = originalInvoiceLine.quantity - cumulativeAppliedCreditQty`
          （cumulativeAppliedCreditQty = Σ 已 APPLIED 且未 reversed 的同 InvoiceLine CREDIT quantity）；
          `requestedQty ≤ remainingAdjustableQty`（否则 409 `CN_DN_QUANTITY_EXCEEDED`）
        - **DEBIT**：`cumulativeAppliedDebitAmount + current ≤ original line ceiling`（ceiling = 原行金额；
          第一版禁止 DN 超原票；否则 409 `CN_DN_AMOUNT_EXCEEDED`）
        - 金额按**同类型聚合**（CREDIT 累计 ∥ DEBIT 累计），CN/DN 不互相污染 ceiling
        → 创建 InvoiceAdjustment facts（**signed：CN<0 / DN>0**——边界④；部分行按数量比例折算快照金额，
        不重算、不调 Pricing Engine）→ AR.adjustedAmount += Σ signed（服务端聚合）→
        AR.balanceAmount = computeBalance（单入口）→ AR status = computeArStatus 统一口径
        （**负 AR = Customer Credit projection，不新增 CREDIT 状态**——边界⑤）→
        Invoice.balanceAmount = AR newBalance（**Invoice 金额事实不动**——边界①）→
        AR Revision + Snapshot（ADJUSTMENT/ADJUSTED）→ Note = APPLIED + appliedAt/appliedById →
        事件 InvoiceAdjustmentApplied + AccountsReceivableAdjusted（事务外；事件失败可降级，但 DB 事实更新不静默失败）。
      operationId: applyCreditDebitNote
      security:
        - bearerAuth: []
      parameters:
        - { name: id, in: path, required: true, schema: { type: string } }
      requestBody:
        required: false
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/CreditDebitNoteApplyRequest"
      responses:
        "201":
          description: Created（status=APPLIED + signedAdjustmentTotal + newBalance + newStatus + factCount）
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/CreditDebitNoteApplyResponse"
        "400":
          $ref: "#/components/responses/BadRequest"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "403":
          $ref: "#/components/responses/Forbidden"
        "404":
          $ref: "#/components/responses/NotFound"
        "409":
          description: Conflict（重复 Apply / 状态不允许 / 未审批 / 数量或金额超限 / 源不匹配）
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"

components:
  securitySchemes:
    bearerAuth:
      type: http
      scheme: bearer
      bearerFormat: JWT

  responses:
    BadRequest:
      description: Validation error（Zod 校验失败）
      content:
        application/json:
          schema:
            $ref: "#/components/schemas/ErrorResponse"
    Unauthorized:
      description: Missing or invalid credentials
      content:
        application/json:
          schema:
            $ref: "#/components/schemas/ErrorResponse"
    Forbidden:
      description: Insufficient permission（RBAC 拒绝）
      content:
        application/json:
          schema:
            $ref: "#/components/schemas/ErrorResponse"
    NotFound:
      description: Resource not found（软删除后同样 404）
      content:
        application/json:
          schema:
            $ref: "#/components/schemas/ErrorResponse"
    Conflict:
      description: Conflict（code 重复 / version 过期 / 状态不允许）
      content:
        application/json:
          schema:
            $ref: "#/components/schemas/ErrorResponse"

