                $ref: "#/components/schemas/DeliveryListResponse"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "403":
          $ref: "#/components/responses/Forbidden"

  /api/sales-orders/{id}/deliveries:
    post:
      tags: [Deliveries]
      summary: Create delivery from sales order (only entry; Direct Delivery prohibited)
      description: |
        唯一创建入口（CTO 锁定项①：salesOrderId NOT NULL）。来源 SO 状态必须为
        CONFIRMED 或 PARTIALLY_DELIVERED（否则 409 SALES_ORDER_NOT_DELIVERABLE）。
        事务内：FOR UPDATE 锁 SO → 原子取号（DO-000001）→ 建头（DRAFT）→
        按请求显式传入的 lines 逐行锁源 SalesOrderLine → 动态计算 availableQty 防超交
        （超出 → 409 DELIVERY_QUANTITY_EXCEEDED）→ 写行 → Revision + CREATED 快照。
      operationId: createDelivery
      security:
        - bearerAuth: []
      parameters:
        - { name: id, in: path, required: true, schema: { type: string }, description: salesOrderId }
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/DeliveryCreate"
      responses:
        "201":
          description: Created（status=DRAFT）
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/DeliveryResponse"
        "400":
          $ref: "#/components/responses/BadRequest"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "403":
          $ref: "#/components/responses/Forbidden"
        "404":
          $ref: "#/components/responses/NotFound"
        "409":
          description: Conflict（SO 状态不允许 / 超交 DELIVERY_QUANTITY_EXCEEDED）
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"

  /api/deliveries/{id}:
    get:
      tags: [Deliveries]
      summary: Get delivery detail (lines/revisions/snapshots + customer/salesOrder summary)
      operationId: getDelivery
      security:
        - bearerAuth: []
      parameters:
        - { name: id, in: path, required: true, schema: { type: string } }
      responses:
        "200":
          description: OK
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/DeliveryResponse"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "403":
          $ref: "#/components/responses/Forbidden"
        "404":
          $ref: "#/components/responses/NotFound"
    patch:
      tags: [Deliveries]
      summary: Update delivery header (only DRAFT; optimistic lock version)
      description: |
        仅 DRAFT 可编辑头（交付日期/预计到达/承运方/运单号/备注）；READY 后行彻底冻结
        （CTO 锁定项⑧：不支持重新 ready，错误 → cancel → 新建）。变更自动生成 DeliveryRevision。
      operationId: updateDelivery
      security:
        - bearerAuth: []
      parameters:
        - { name: id, in: path, required: true, schema: { type: string } }
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/DeliveryUpdate"
      responses:
        "200":
          description: OK（version+1）
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/DeliveryResponse"
        "400":
          $ref: "#/components/responses/BadRequest"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "403":
          $ref: "#/components/responses/Forbidden"
        "404":
          $ref: "#/components/responses/NotFound"
        "409":
          $ref: "#/components/responses/Conflict"

  /api/deliveries/{id}/lines:
    get:
      tags: [Delivery Lines]
      summary: List delivery lines (item/uom/sourceSalesOrderLine summary)
      description: |
        原则上不开放 POST——交付行仅在创建 Delivery 时从 SO Line 选择（CTO 指示：分批发货，
        创建时明确传入指定行，不默认复制全部剩余行）。
      operationId: listDeliveryLines
      security:
        - bearerAuth: []
