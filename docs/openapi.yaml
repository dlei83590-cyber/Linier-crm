      type: string
      enum: [DRAFT, CONFIRMED, PARTIALLY_DELIVERED, DELIVERED, COMPLETED, CANCELLED]

    SalesOrderSnapshotType:
      type: string
      description: 快照类型（仅固化节点）；DELIVERED/COMPLETED 待 Sprint 4C 交付联动补充
      enum: [CREATED, CONFIRMED, CANCELLED]

    SalesOrderRevisionStatus:
      type: string
      enum: [DRAFT, SUBMITTED, APPROVED, SUPERSEDED]

    SalesOrder:
      type: object
      required: [id, code, quotationId, customerId, status, currency, version]
      properties:
        id: { type: string }
        code: { type: string, description: 单据编号（DocumentSequence，前缀 SO，位数 6） }
        quotationId: { type: string, description: 来源报价（必填；Direct SO 禁止，CTO 锁定项①） }
        customerId: { type: string }
        projectId: { type: [string, "null"] }
        orderDate: { type: [string, "null"], format: date-time }
        requestedDeliveryDate: { type: [string, "null"], format: date-time }
        paymentTerm: { type: [string, "null"] }
        incoterm: { type: [string, "null"] }
        status: { $ref: "#/components/schemas/SalesOrderStatus" }
        currency: { type: string, example: CNY }
        taxProfileId: { type: [string, "null"] }
        remark: { type: [string, "null"] }
        subtotal: { type: number }
        taxAmount: { type: number }
        totalAmount: { type: number }
        workflowInstanceId: { type: [string, "null"], description: 审批实例投影（Workflow 为唯一审批事实源，ADR-0017） }
        approvalStatus: { type: [string, "null"] }
        approvedAt: { type: [string, "null"], format: date-time }
        approvedById: { type: [string, "null"] }
        deliveredAt: { type: [string, "null"], format: date-time, description: 交付投影（Delivery 聚合回写，Sprint 4C） }
        version: { type: integer, description: 乐观锁版本 }
        createdById: { type: [string, "null"] }
        updatedById: { type: [string, "null"] }
        deletedAt: { type: [string, "null"], format: date-time }
        isActive: { type: boolean }

    SalesOrderUpdate:
      type: object
      required: [version]
      properties:
        requestedDeliveryDate: { type: [string, "null"], format: date-time }
        paymentTerm: { type: [string, "null"], maxLength: 50 }
        incoterm: { type: [string, "null"], maxLength: 50 }
        remark: { type: [string, "null"], maxLength: 1000 }
        changeReason: { type: string, maxLength: 500 }
        version: { type: integer, description: 乐观锁版本（冲突返回 409 VERSION_CONFLICT） }
        # 无 unitPrice 字段：价格继承 Quotation，禁止直接改价（CTO 锁定项②）

    SalesOrderLine:
      type: object
      required: [id, salesOrderId, itemId, quantity, version]
      properties:
        id: { type: string }
        salesOrderId: { type: string }
        quotationLineId: { type: [string, "null"], description: 来源报价行溯源（永不清除，即使重定价） }
        lineNo: { type: integer }
        itemId: { type: string }
        description: { type: string }
        quantity: { type: number }
        uomId: { type: [string, "null"] }
        priceSnapshotId: { type: [string, "null"], description: 当前有效价格快照 FK（重定价时更新为新快照，ADR-0015） }
        unitPrice: { type: number, description: 快照冗余展示，禁止前端直接填写 }
        lineAmount: { type: number }
        taxAmount: { type: number }
        totalAmount: { type: number }
        version: { type: integer }
        createdById: { type: [string, "null"] }
        updatedById: { type: [string, "null"] }
        deletedAt: { type: [string, "null"], format: date-time }
        isActive: { type: boolean }

    SalesOrderLineUpdate:
      type: object
      required: [version]
      properties:
        description: { type: string, maxLength: 500 }
        quantity: { type: number, exclusiveMinimum: 0, description: 数量变更 → 重新走 Pricing Engine 生成新快照 }
        uomId: { type: [string, "null"] }
        lineNo: { type: integer }
        changeReason: { type: string, maxLength: 500 }
        version: { type: integer }
        # 无 unitPrice 字段：禁止直接改价（CTO 锁定项②）

    SalesOrderRevision:
