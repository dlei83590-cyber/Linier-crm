        "404":
          $ref: "#/components/responses/NotFound"

  /api/deliveries/{id}/lines/{lineId}:
    patch:
      tags: [Delivery Lines]
      summary: Update delivery line (only DRAFT; allocation check, over-delivery prohibited)
      description: |
        仅 DRAFT 可编辑行。事务内锁定 source SalesOrderLine（FOR UPDATE）→ 动态计算
        confirmedDeliveredQty / openDeliveryQty（排除当前行）/ availableQty →
        校验 quantity <= availableQty（超出 → 409 DELIVERY_QUANTITY_EXCEEDED）→ 写行 → Revision。
        sourceSalesOrderLineId 溯源永不清除；本阶段不增加 SalesOrderLine.deliveredQty/remainingQty。
      operationId: updateDeliveryLine
      security:
        - bearerAuth: []
      parameters:
        - { name: id, in: path, required: true, schema: { type: string } }
        - { name: lineId, in: path, required: true, schema: { type: string } }
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/DeliveryLineUpdate"
      responses:
        "200":
          description: OK（version+1）
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/DeliveryLineResponse"
        "400":
          description: BadRequest（含 DELIVERY_SOURCE_LINE_INVALID）
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "403":
          $ref: "#/components/responses/Forbidden"
        "404":
          $ref: "#/components/responses/NotFound"
        "409":
          $ref: "#/components/responses/Conflict"

  # ---- Delivery Actions（Phase 4） ----
  /api/deliveries/{id}/ready:
    post:
      tags: [Delivery Actions]
      summary: Ready delivery (DRAFT → READY; rows frozen after)
      description: |
        校验：至少 1 条有效行 / 每行 quantity>0 / 源行仍有效 / 重新执行 allocation 校验
        （排除本单自身，防 DRAFT 期间被其他 Delivery 抢占）。成功：status=READY +
        DeliverySnapshot(READY) + 发布 DeliveryReady。READY 后行彻底冻结。
      operationId: readyDelivery
      security:
        - bearerAuth: []
      parameters:
        - { name: id, in: path, required: true, schema: { type: string } }
      requestBody:
        required: false
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/DeliveryActionRequest"
      responses:
        "200":
          description: OK（status=READY）
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/DeliveryActionResponse"
        "400":
          description: BadRequest（含 DELIVERY_SOURCE_LINE_INVALID）
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "403":
          $ref: "#/components/responses/Forbidden"
        "404":
          $ref: "#/components/responses/NotFound"
        "409":
          description: Conflict（状态不允许 / 无有效行 / 超交 DELIVERY_QUANTITY_EXCEEDED）
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"

  /api/deliveries/{id}/dispatch:
    post:
      tags: [Delivery Actions]
      summary: Dispatch delivery (READY → DISPATCHED; no deliveredQty change)
      description: |
        可同时更新 carrier / trackingNo / expectedArrivalDate。生成 DeliverySnapshot(DISPATCHED)；
        **不增加 deliveredQty**（发运不等于客户收货，CTO Review ⑥）。发布 DeliveryDispatched。
      operationId: dispatchDelivery
      security:
        - bearerAuth: []
      parameters:
        - { name: id, in: path, required: true, schema: { type: string } }
      requestBody:
        required: false
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/DeliveryDispatchRequest"
      responses:
        "200":
          description: OK（status=DISPATCHED）
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/DeliveryActionResponse"
        "400":
          $ref: "#/components/responses/BadRequest"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "403":
          $ref: "#/components/responses/Forbidden"
        "404":
          $ref: "#/components/responses/NotFound"
        "409":
          $ref: "#/components/responses/Conflict"

  /api/deliveries/{id}/confirm-delivery:
    post:
      tags: [Delivery Actions]
      summary: Confirm delivery (DISPATCHED → DELIVERED; customer confirms receipt)
      description: |
        Phase 4 最关键事务（12 步固定顺序）：锁 Delivery → 锁 SalesOrder → 按 id ASC 锁全部源行
        （防死锁）→ 复查行 quantity → 重新聚合防超交 → 更新 DELIVERED + POD 投影 →
        DELIVERED 快照 → 回写全部 SalesOrderLine deliveredQty/remainingQty → 聚合 SalesOrder
        （全部行 remainingQty<=0 → DELIVERED+deliveredAt=now；否则有 confirmed → PARTIALLY_DELIVERED）
        → 发布 DeliveryConfirmed + SalesOrderPartiallyDelivered / SalesOrderDelivered。
        POD 门禁：podStatus ∈ {RECEIVED, WAIVED}，否则 409（PENDING 拒绝）。
        本阶段不实现 /complete（COMPLETED 仅枚举）。
      operationId: confirmDelivery
      security:
        - bearerAuth: []
      parameters:
        - { name: id, in: path, required: true, schema: { type: string } }
      requestBody:
        required: false
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/DeliveryConfirmRequest"
      responses:
        "200":
          description: OK（status=DELIVERED）
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/DeliveryActionResponse"
        "400":
          $ref: "#/components/responses/BadRequest"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "403":
          $ref: "#/components/responses/Forbidden"
        "404":
          $ref: "#/components/responses/NotFound"
        "409":
          description: Conflict（状态不允许 / POD 未确认 / 超交 DELIVERY_QUANTITY_EXCEEDED）
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"

  /api/deliveries/{id}/cancel:
    post:
      tags: [Delivery Actions]
      summary: Cancel delivery (DRAFT/READY → CANCELLED; DISPATCHED+ prohibited)
      description: |
        仅 DRAFT/READY 可取消；DISPATCHED/DELIVERED/COMPLETED 禁止（已进入物流/交付环节）。
        取消不回滚 deliveredQty（这些状态未进入实际交付累计），也不需要写 SalesOrderLine 投影——
        CANCELLED 不在 open 占用集合，其他 Delivery 的 allocation 在下次事务动态计算时自动释放。
        成功：status=CANCELLED + DeliverySnapshot(CANCELLED) + 发布 DeliveryCancelled。
      operationId: cancelDelivery
      security:
        - bearerAuth: []
      parameters:
        - { name: id, in: path, required: true, schema: { type: string } }
      requestBody:
        required: false
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/DeliveryActionRequest"
      responses:
        "200":
          description: OK（status=CANCELLED）
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/DeliveryActionResponse"
        "400":
          $ref: "#/components/responses/BadRequest"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "403":
          $ref: "#/components/responses/Forbidden"
        "404":
          $ref: "#/components/responses/NotFound"
        "409":
          $ref: "#/components/responses/Conflict"

  # ==========================================================================
  # Sprint 4D Invoice Foundation（主资源 + 子资源 + Actions）
  # ==========================================================================
  /api/invoices:
    get:
      tags: [Invoices]
      summary: List invoices (paginated; code/customerId/status/approvalStatus/date/dueDate/currency/salesOrderId/deliveryId filters)
      description: |
        列表查询（CTO Phase 4 指令：含 approvalStatus 过滤，审批列表使用）。
        无 POST /api/invoices——Direct Invoice 禁止（CTO Review 96/100 锁定项①），
        唯一创建入口为 POST /api/deliveries/{id}/invoice。
      operationId: listInvoices
      security:
        - bearerAuth: []
      parameters:
        - { name: page, in: query, required: false, schema: { type: integer, default: 1 } }
        - { name: pageSize, in: query, required: false, schema: { type: integer, default: 20, maximum: 100 } }
        - { name: code, in: query, required: false, schema: { type: string } }
        - { name: customerId, in: query, required: false, schema: { type: string } }
        - { name: status, in: query, required: false, schema: { $ref: "#/components/schemas/InvoiceStatus" } }
        - { name: approvalStatus, in: query, required: false, schema: { type: string, description: 审批状态过滤（APPROVED/PENDING/REJECTED/DRAFT） } }
        - { name: dateFrom, in: query, required: false, schema: { type: string, format: date-time } }
        - { name: dateTo, in: query, required: false, schema: { type: string, format: date-time } }
        - { name: dueDateFrom, in: query, required: false, schema: { type: string, format: date-time } }
        - { name: dueDateTo, in: query, required: false, schema: { type: string, format: date-time } }
        - { name: currency, in: query, required: false, schema: { type: string } }
        - { name: salesOrderId, in: query, required: false, schema: { type: string } }
        - { name: deliveryId, in: query, required: false, schema: { type: string } }
      responses:
        "200":
          description: OK（分页列表，含 customer/delivery 摘要 + lines 计数）
          content:
            application/json:
