  /api/inventory-transfers/{id}/submit:
    post:
      tags: [Inventory Transfers]
      summary: Submit inventory transfer (DRAFT → SUBMITTED; maybeTriggerApproval)
      description: |
        提交调拨单（DRAFT → SUBMITTED）。命中 ApprovalPolicy(module=INVENTORY_TRANSFER) → 创建/复用 WorkflowInstance；
        未命中策略 → **直接完成审批投影**（status=APPROVED + approvedById=提交人，严格沿用既有 Workflow Policy 语义）。
        **红线：APPROVED ≠ EXECUTED**——submit/approve 绝不自动落账，只有显式 execute 才经 Shared LedgerCommand 双 atom 落账；
        **movementGroupId 只在 EXECUTE 时生成/复用**（锁单后已有值→复用，无值→生成一次并冻结；禁止每次 attempt 随机重造）。权限：inventory-transfer:edit。
      operationId: submitInventoryTransfer
      security:
        - bearerAuth: []
      parameters:
        - name: id
          in: path
          required: true
          schema: { type: string }
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/InventoryTransferVersionRequest"
      responses:
        "200":
          description: Submitted（或未命中策略直接 APPROVED）
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/InventoryTransferSubmitResponse"
        "400":
          $ref: "#/components/responses/BadRequest"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "403":
          $ref: "#/components/responses/Forbidden"
        "404":
          $ref: "#/components/responses/NotFound"
        "409":
          description: Conflict（仅 DRAFT / 版本冲突）
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"

  /api/inventory-transfers/{id}/cancel:
    post:
      tags: [Inventory Transfers]
      summary: Cancel inventory transfer (DRAFT/APPROVED → CANCELLED; EXECUTED forbidden)
      description: |
        取消调拨单。**DRAFT / APPROVED** 允许 Cancel；**SUBMITTED** 不允许直接 Cancel（409，先 Withdraw 审批再 Cancel 或走驳回重提）；
        **EXECUTED** 禁止 Cancel（409，已执行已落账，纠错走整组 Reversal）。CAS version 乐观锁。
        **红线：Cancel 绝不触碰 Movement / Projection**。权限：inventory-transfer:close。
      operationId: cancelInventoryTransfer
      security:
        - bearerAuth: []
      parameters:
        - name: id
          in: path
          required: true
          schema: { type: string }
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/InventoryTransferVersionRequest"
      responses:
        "200":
          description: Cancelled
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/InventoryTransferResponse"
        "400":
          $ref: "#/components/responses/BadRequest"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "403":
          $ref: "#/components/responses/Forbidden"
        "404":
          $ref: "#/components/responses/NotFound"
        "409":
          description: Conflict（SUBMITTED/EXECUTED 禁取消 / 版本冲突）
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"

  /api/inventory-transfers/{id}/execute:
    post:
      tags: [Inventory Transfers]
      summary: Execute inventory transfer (APPROVED → EXECUTED; Shared LedgerCommand dual atom, all-or-nothing)
      description: |
        执行调拨单（**APPROVED → EXECUTED**，CTO 6B-2 最高风险点）。三个不可妥协不变量：
        ① SOURCE_OUT + DESTINATION_IN 共用同一非空 movementGroupId（EXECUTE 时生成/复用并冻结，稳定业务事实）；
        ② 业务单据 EXECUTED + 两笔 Movement + 两侧 Projection 同一 caller transaction 全有或全无——
           任何 atom 失败（源库存不足 / 幂等 conflict / Projection/DB 错误）→ 整事务回滚，Transfer 仍保持 APPROVED；
        ③ 重试必须通过 Shared Core identity+immutable-fact 幂等规则，禁止 Transfer 自己实现库存扣增逻辑。
        幂等：已 EXECUTED → 409 ALREADY_EXECUTED。五元幂等 sourceType=TRANSFER / sourceId=transfer.id /
        sourceLineId=line.id / SOURCE_OUT|DESTINATION_IN / atomKey=BULK 或 serialNo。batch/mfg/exp SOURCE→DESTINATION 原样继承。
        权限：inventory-transfer:edit。
      operationId: executeInventoryTransfer
      security:
        - bearerAuth: []
      parameters:
        - name: id
          in: path
          required: true
          schema: { type: string }
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/InventoryTransferVersionRequest"
      responses:
        "200":
          description: Executed（含 movementGroupId + atomResults）
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/InventoryTransferExecuteResponse"
        "400":
          $ref: "#/components/responses/BadRequest"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "403":
          $ref: "#/components/responses/Forbidden"
        "404":
          $ref: "#/components/responses/NotFound"
        "409":
          description: Conflict（仅 APPROVED / 已 EXECUTED / 库存不足 / 幂等冲突 / 版本冲突）
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"

