  /api/quotations/{id}/convert:
    post:
      tags: [Quotation Actions]
      summary: Convert accepted quotation to Sales Order (unique creation entry, Sprint 4B)
      description: |
        唯一创建入口（CTO 锁定项①：不允许 Direct Sales Order，quotationId 必填）。
        仅 status=ACCEPTED 且未过期、未转换（convertedAt/salesOrderId 为空）可调用。
        事务：FOR UPDATE 真实行锁 → 原子取号（DocumentSequence SALES_ORDER，前缀 SO）→ 创建 DRAFT SO
        + 复制有效 Line（继承价格 + priceSnapshotId + 溯源 quotationLineId，不重新定价）→ CREATED 快照
        → 回写 Quotation（salesOrderId/convertedAt/convertedById/status=CONVERTED）→ AuditLog
        → 发布 QuotationConverted + SalesOrderCreated 双事件；唯一约束冲突（P2002）稳定转 409。
      operationId: convertQuotation
      security:
        - bearerAuth: []
      parameters:
        - { name: id, in: path, required: true, schema: { type: string } }
      responses:
        "200":
          description: OK（SalesOrder DRAFT 已创建，含 quotationId 溯源）
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/SalesOrderResponse"
        "400":
          $ref: "#/components/responses/BadRequest"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "403":
          $ref: "#/components/responses/Forbidden"
        "404":
