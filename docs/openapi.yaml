  /api/write-offs/{id}/submit:
    post:
      tags: [Write Offs]
      summary: Submit write-off (DRAFT → SUBMITTED; conditional workflow trigger)
      description: |
        DRAFT → SUBMITTED（CTO 指令）。同事务调用 maybeTriggerWriteOffApproval()（module=WRITE_OFF 策略按 writeOff.amount 匹配金额区间）：
        - **命中策略** → 创建/复用 Workflow 实例，approvalStatus=PENDING → **必须等 APPROVED 后才能 Apply**（Apply 路由门禁 409 WRITE_OFF_APPROVAL_REQUIRED）；
        - **未命中策略** → 保持 SUBMITTED（approvalStatus 仍 DRAFT）→ **可直接进入可 Apply 状态**。
        **不修改 AR**（审批通过 ≠ 自动修改余额；只有显式 Apply 才回写——CTO 锁死）。
        事件：WriteOffSubmitted + WriteOffApprovalStarted（命中策略时；失败降级不阻断）。
      operationId: submitWriteOff
      security:
        - bearerAuth: []
      parameters:
        - { name: id, in: path, required: true, schema: { type: string } }
