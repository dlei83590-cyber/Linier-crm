  /api/invoices/{id}/issue:
    post:
      tags: [Invoice Actions]
      summary: Issue invoice (DRAFT → ISSUED; atomic DocumentSequence number allocation)
      description: |
        CTO Review 必改①：DRAFT 不占号（code=NULL），仅 ISSUE 时 DocumentSequence 原子取号（INV-2026-000123）。
        事务内：FOR UPDATE 锁 Invoice → 校验 DRAFT + 至少 1 个有效行 + invoiceTotal>0 + code=NULL →
        审批门禁（CTO Phase 4 指令：workflowInstanceId != null 时仅 approvalStatus=APPROVED 允许开票，否则 409）→
        nextInvoiceCode 原子取号 → ISSUED + ISSUED 快照（issuedAt/issuedById 记 snapshotData）→ InvoiceIssued。
