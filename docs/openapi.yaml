  # ==========================================================================
  # Sprint 4A Quotation Foundation（Quotation CRUD + lines/revisions/snapshots + Action API）
  # ==========================================================================
  /api/quotations:
    get:
      tags: [Quotations]
      summary: List quotations (paginated, filterable by code/customerId/status/dateFrom/dateTo)
      operationId: listQuotations
      security:
        - bearerAuth: []
      parameters:
        - name: page
          in: query
          schema: { type: integer, default: 1 }
        - name: pageSize
          in: query
          schema: { type: integer, default: 20, maximum: 100 }
        - name: code
          in: query
          schema: { type: string, description: 报价单号模糊查询（insensitive） }
        - name: customerId
          in: query
          schema: { type: string }
        - name: status
          in: query
          schema: { type: string, description: QuotationStatus 存储态 }
        - name: dateFrom
          in: query
          schema: { type: string, format: date, description: quoteDate >= dateFrom }
        - name: dateTo
          in: query
          schema: { type: string, format: date, description: quoteDate <= dateTo }
      responses:
        "200":
          description: Paginated list（软删除已过滤；每项含 effectiveStatus/isExpired 惰性过期投影）
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/QuotationListResponse"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "403":
          $ref: "#/components/responses/Forbidden"
    post:
      tags: [Quotations]
      summary: Create quotation draft (Header + Lines in one tx; pricing via Pricing Engine)
      description: |
        价格红线（ADR-0015）：行价必须来自 PricingEngine.resolvePrice() → QuotationPriceSnapshot → priceSnapshotId，
        禁止前端直接决定 unitPrice。创建流程：① 事务取号+建 header+占位 lines（价格 0）→ ② 事务外定价 → ③ 回写价格+重算+Revision+事件。
      operationId: createQuotation
      security:
        - bearerAuth: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/QuotationCreate"
      responses:
        "201":
          description: Created（status=DRAFT，含 effectiveStatus 投影）
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/QuotationResponse"
        "400":
          $ref: "#/components/responses/BadRequest"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "403":
          $ref: "#/components/responses/Forbidden"

  /api/quotations/{id}:
    get:
      tags: [Quotations]
      summary: Get quotation detail (lines/revisions/snapshots/customer + lazy expiry projection)
      operationId: getQuotation
      security:
        - bearerAuth: []
      parameters:
        - { name: id, in: path, required: true, schema: { type: string } }
      responses:
        "200":
          description: OK（含 effectiveStatus/isExpired）
          content:
            application/json:
              schema:
