  /api/pricing/resolve:
    post:
      tags: [Pricing Engine]
      summary: Resolve price (single entry - Quotation/Project/Sales all call this)
      description: |
        价格解析唯一入口（CTO #2249/#2345）。业务模块禁止自行计算，统一调用本接口。

        Sequence：
        1. Resolve Price（POST /api/pricing/resolve）
        2. Load Context（校验物料/伙伴/币种）
        3. Match Policy（按 priority 取策略）
        4. Match Rule（规则命中取折扣）
        5. Partner Price / Price List（专属价优先，价目表兜底）
        6. Promotion（促销命中）
        7. Currency Conversion（汇率换算）
        8. Tax（税率快照）
        9. Snapshot（固化 QuotationPriceSnapshot，完整定价链）
        10. Response（返回最终价 + 快照 id）
      operationId: resolvePrice
      security:
        - bearerAuth: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/PricingResolveRequest"
      responses:
        "200":
          description: OK
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/PricingResolveResponse"
        "400":
          $ref: "#/components/responses/BadRequest"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "403":
          $ref: "#/components/responses/Forbidden"
        "500":
          description: Pricing failed (ITEM_NOT_FOUND / PRICE_NOT_FOUND)
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"

