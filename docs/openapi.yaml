    # --------------------------------------------------------------------------
    # Quotation Foundation（Sprint 4A，ADR-0015/ADR-0016）
    # --------------------------------------------------------------------------
    QuotationStatus:
      type: string
      enum: [DRAFT, SUBMITTED, APPROVED, REJECTED, SENT, ACCEPTED, CONVERTED, CANCELLED]

    QuotationEffectiveStatus:
      type: string
      description: 惰性过期投影（ADR-0016 决策②）：storedStatus ∈ {SENT, APPROVED} 且 validUntil < now → EXPIRED
      enum: [DRAFT, SUBMITTED, APPROVED, REJECTED, SENT, ACCEPTED, CONVERTED, CANCELLED, EXPIRED]

    QuotationSnapshotType:
      type: string
      enum: [SUBMITTED, APPROVED, SENT, ACCEPTED, CONVERTED]

    QuotationRevisionStatus:
      type: string
      enum: [DRAFT, SUBMITTED, APPROVED, SUPERSEDED]

    Quotation:
      type: object
      required: [id, code, customerId, status, currency, version]
      properties:
        id: { type: string }
        code: { type: string, description: 单据编号（DocumentSequence，前缀 QT，位数 6） }
        customerId: { type: string }
        opportunityId: { type: [string, "null"] }
        projectId: { type: [string, "null"] }
        status: { $ref: "#/components/schemas/QuotationStatus" }
        quoteDate: { type: [string, "null"], format: date-time }
        validFrom: { type: [string, "null"], format: date-time }
        validUntil: { type: [string, "null"], format: date-time }
        currency: { type: string, example: CNY }
        taxProfileId: { type: [string, "null"] }
        remark: { type: [string, "null"] }
        subtotal: { type: number }
        taxAmount: { type: number }
        totalAmount: { type: number }
        workflowInstanceId: { type: [string, "null"], description: 审批实例投影（Workflow 为唯一审批事实源，ADR-0016） }
        approvalStatus: { type: [string, "null"] }
        approvedAt: { type: [string, "null"], format: date-time }
        approvedById: { type: [string, "null"] }
        convertedAt: { type: [string, "null"], format: date-time }
        convertedById: { type: [string, "null"] }
        salesOrderId: { type: [string, "null"] }
        version: { type: integer, description: 乐观锁版本 }
        createdById: { type: [string, "null"] }
        updatedById: { type: [string, "null"] }
        deletedAt: { type: [string, "null"], format: date-time }
        isActive: { type: boolean }

    QuotationLineCreateItem:
      type: object
      required: [itemId, quantity]
      properties:
        itemId: { type: string }
        description: { type: string, maxLength: 500 }
        quantity: { type: number, exclusiveMinimum: 0 }
        uomId: { type: string }
        lineNo: { type: integer, description: 行号 10/20/30 步进，插入不整体重排（CTO 决策） }

    QuotationCreate:
      type: object
      required: [customerId, lines]
      properties:
        customerId: { type: string }
        opportunityId: { type: [string, "null"] }
        projectId: { type: [string, "null"] }
        currency: { type: string, default: CNY }
        validFrom: { type: [string, "null"], format: date-time }
        validUntil: { type: [string, "null"], format: date-time }
        taxProfileId: { type: [string, "null"] }
        remark: { type: [string, "null"], maxLength: 1000 }
        lines:
          type: array
          minItems: 1
          items: { $ref: "#/components/schemas/QuotationLineCreateItem" }
        # 价格红线（ADR-0015）：无 unitPrice 字段；行价由 Pricing Engine 决定

    QuotationUpdate:
      type: object
      required: [version]
      properties:
        validFrom: { type: [string, "null"], format: date-time }
        validUntil: { type: [string, "null"], format: date-time }
        taxProfileId: { type: [string, "null"] }
        remark: { type: [string, "null"], maxLength: 1000 }
        changeReason: { type: string, maxLength: 500 }
        version: { type: integer, description: 乐观锁版本（冲突返回 409 VERSION_CONFLICT） }

    QuotationLine:
      type: object
      required: [id, quotationId, itemId, quantity, version]
      properties:
        id: { type: string }
        quotationId: { type: string }
        lineNo: { type: integer }
        itemId: { type: string }
        description: { type: string }
        quantity: { type: number }
        uomId: { type: [string, "null"] }
        priceSnapshotId: { type: [string, "null"], description: 价格快照 FK（QuotationPriceSnapshot，ADR-0015 SetNull） }
        unitPrice: { type: number, description: 快照冗余展示，禁止前端直接填写 }
        lineAmount: { type: number }
        taxAmount: { type: number }
        totalAmount: { type: number }
        version: { type: integer }
        createdById: { type: [string, "null"] }
        updatedById: { type: [string, "null"] }
        deletedAt: { type: [string, "null"], format: date-time }
        isActive: { type: boolean }

    QuotationLineCreate:
      type: object
      required: [itemId, quantity]
      properties:
        itemId: { type: string }
        description: { type: string, maxLength: 500 }
        quantity: { type: number, exclusiveMinimum: 0 }
        uomId: { type: string }
        lineNo: { type: integer }

    QuotationLineUpdate:
      type: object
      required: [version]
      properties:
        description: { type: string, maxLength: 500 }
        quantity: { type: number, exclusiveMinimum: 0, description: 数量变更 → 重新走 Pricing Engine 生成新快照 }
        uomId: { type: [string, "null"] }
        lineNo: { type: integer }
        changeReason: { type: string, maxLength: 500 }
        version: { type: integer }
        # 无 unitPrice 字段：禁止直接改价（ADR-0015）

    QuotationRevisionCreate:
      type: object
      required: [changeReason]
      properties:
        changeReason: { type: string, minLength: 1, maxLength: 500 }

    QuotationRevision:
      type: object
      required: [id, quotationId, revisionNo, changeReason]
      properties:
        id: { type: string }
        quotationId: { type: string }
        revisionNo: { type: integer, description: 系统自动递增（唯一版本载体，ADR-0016） }
        revisionStatus: { $ref: "#/components/schemas/QuotationRevisionStatus" }
        changeReason: { type: string }
        snapshotData: { type: object, description: 系统生成的当前状态快照 }
        createdById: { type: [string, "null"] }
        updatedById: { type: [string, "null"] }
        deletedAt: { type: [string, "null"], format: date-time }
        isActive: { type: boolean }

    QuotationSnapshot:
      type: object
      required: [id, quotationId, snapshotType, revisionNo]
      properties:
        id: { type: string }
        quotationId: { type: string }
        snapshotType: { $ref: "#/components/schemas/QuotationSnapshotType" }
        revisionNo: { type: integer }
        snapshotData: { type: object, description: 关键状态证据（仅固化节点生成，只读） }
        generatedById: { type: [string, "null"] }
        createdById: { type: [string, "null"] }
        updatedById: { type: [string, "null"] }
        deletedAt: { type: [string, "null"], format: date-time }
        isActive: { type: boolean }

    QuotationCancelRequest:
      type: object
      properties:
        reason: { type: string }

    QuotationResponse:
      type: object
      required: [success, data]
      properties:
        success: { type: boolean, example: true }
        data:
          type: object
          properties:
            id: { type: string }
            code: { type: string }
            customerId: { type: string }
            customer: { type: object, nullable: true, description: "GET 详情含 {id,code,name}" }
            opportunityId: { type: [string, "null"] }
            projectId: { type: [string, "null"] }
            status: { $ref: "#/components/schemas/QuotationStatus" }
            effectiveStatus: { $ref: "#/components/schemas/QuotationEffectiveStatus" }
            isExpired: { type: boolean }
            quoteDate: { type: [string, "null"], format: date-time }
            validFrom: { type: [string, "null"], format: date-time }
            validUntil: { type: [string, "null"], format: date-time }
            currency: { type: string }
            taxProfileId: { type: [string, "null"] }
            remark: { type: [string, "null"] }
            subtotal: { type: number }
            taxAmount: { type: number }
            totalAmount: { type: number }
            workflowInstanceId: { type: [string, "null"] }
            approvalStatus: { type: [string, "null"] }
            approvedAt: { type: [string, "null"], format: date-time }
            approvedById: { type: [string, "null"] }
            convertedAt: { type: [string, "null"], format: date-time }
            convertedById: { type: [string, "null"] }
            salesOrderId: { type: [string, "null"] }
            version: { type: integer }
            lines: { type: array, items: { $ref: "#/components/schemas/QuotationLine" }, description: GET 详情含 }
            revisions: { type: array, items: { $ref: "#/components/schemas/QuotationRevision" }, description: GET 详情含 }
            snapshots: { type: array, items: { $ref: "#/components/schemas/QuotationSnapshot" }, description: GET 详情含 }

    QuotationListResponse:
      type: object
      required: [success, data]
      properties:
        success: { type: boolean, example: true }
        data:
          type: array
          items:
            type: object
            properties:
              id: { type: string }
              code: { type: string }
              customerId: { type: string }
              customer: { type: object, nullable: true }
              status: { $ref: "#/components/schemas/QuotationStatus" }
              effectiveStatus: { $ref: "#/components/schemas/QuotationEffectiveStatus" }
              isExpired: { type: boolean }
              quoteDate: { type: [string, "null"], format: date-time }
              validUntil: { type: [string, "null"], format: date-time }
              currency: { type: string }
              totalAmount: { type: number }
              version: { type: integer }
              _count: { type: object, properties: { lines: { type: integer } } }
        pagination:
          type: object
          properties:
            page: { type: integer }
            pageSize: { type: integer }
            total: { type: integer }

    QuotationLineResponse:
      type: object
      required: [success, data]
      properties:
        success: { type: boolean, example: true }
        data: { $ref: "#/components/schemas/QuotationLine" }

    QuotationLineListResponse:
      type: object
      required: [success, data]
      properties:
        success: { type: boolean, example: true }
        data:
          type: array
          items: { $ref: "#/components/schemas/QuotationLine" }

    QuotationLineDeleteResponse:
      type: object
      required: [success, data]
      properties:
        success: { type: boolean, example: true }
        data:
          type: object
          properties:
            id: { type: string }
            deleted: { type: boolean, example: true }

    QuotationRevisionResponse:
      type: object
      required: [success, data]
      properties:
        success: { type: boolean, example: true }
        data: { $ref: "#/components/schemas/QuotationRevision" }

    QuotationRevisionListResponse:
      type: object
      required: [success, data]
      properties:
        success: { type: boolean, example: true }
        data:
          type: array
          items: { $ref: "#/components/schemas/QuotationRevision" }

    QuotationSnapshotResponse:
      type: object
      required: [success, data]
      properties:
        success: { type: boolean, example: true }
        data: { $ref: "#/components/schemas/QuotationSnapshot" }

    QuotationSnapshotListResponse:
      type: object
      required: [success, data]
      properties:
        success: { type: boolean, example: true }
        data:
          type: array
          items: { $ref: "#/components/schemas/QuotationSnapshot" }

    QuotationActionResponse:
      type: object
      required: [success, data]
      properties:
        success: { type: boolean, example: true }
        data:
          type: object
          properties:
            id: { type: string }
            status: { $ref: "#/components/schemas/QuotationStatus" }
            workflowInstanceId: { type: [string, "null"], description: submit 成功返回审批实例 id }

    QuotationDeleteResponse:
      type: object
      required: [success, data]
      properties:
        success: { type: boolean, example: true }
        data:
          type: object
          properties:
            id: { type: string }
            deleted: { type: boolean, example: true }

