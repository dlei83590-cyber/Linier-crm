        - name: code
          in: query
          schema: { type: string }
        - name: name
          in: query
          schema: { type: string }
        - name: channel
          in: query
          schema: { $ref: "#/components/schemas/NotificationChannelType" }
      responses:
        "200":
          description: Paginated list
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/NotificationTemplateListResponse"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "403":
          $ref: "#/components/responses/Forbidden"
    post:
      tags: [Notification Templates]
      summary: Create notification template
      operationId: createNotificationTemplate
      security:
        - bearerAuth: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/NotificationTemplateCreate"
      responses:
        "201":
          description: Created
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/NotificationTemplateResponse"
        "400":
          $ref: "#/components/responses/BadRequest"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "403":
          $ref: "#/components/responses/Forbidden"
        "409":
          $ref: "#/components/responses/Conflict"

  /api/notification-templates/{id}:
    get:
      tags: [Notification Templates]
      summary: Get notification template detail
      operationId: getNotificationTemplate
      security:
        - bearerAuth: []
      parameters:
        - name: id
          in: path
          required: true
          schema: { type: string }
      responses:
        "200":
          description: Detail
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/NotificationTemplateResponse"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "403":
          $ref: "#/components/responses/Forbidden"
        "404":
          $ref: "#/components/responses/NotFound"
    patch:
      tags: [Notification Templates]
      summary: Update notification template（乐观锁 version）
      operationId: updateNotificationTemplate
      security:
        - bearerAuth: []
      parameters:
        - name: id
          in: path
          required: true
          schema: { type: string }
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/NotificationTemplateUpdate"
      responses:
        "200":
          description: Updated
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/NotificationTemplateResponse"
        "400":
          $ref: "#/components/responses/BadRequest"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "403":
          $ref: "#/components/responses/Forbidden"
        "404":
          $ref: "#/components/responses/NotFound"
        "409":
          $ref: "#/components/responses/Conflict"
    delete:
      tags: [Notification Templates]
      summary: Soft delete notification template
      operationId: deleteNotificationTemplate
      security:
        - bearerAuth: []
      parameters:
        - name: id
          in: path
          required: true
          schema: { type: string }
      responses:
        "200":
          description: Soft deleted
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/DeleteResponse"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "403":
          $ref: "#/components/responses/Forbidden"
        "404":
          $ref: "#/components/responses/NotFound"

components:
  securitySchemes:
    bearerAuth:
      type: http
      scheme: bearer
      bearerFormat: JWT

  responses:
    BadRequest:
      description: Validation error（Zod 校验失败）
      content:
        application/json:
          schema:
            $ref: "#/components/schemas/ErrorResponse"
    Unauthorized:
      description: Missing or invalid credentials
      content:
        application/json:
          schema:
            $ref: "#/components/schemas/ErrorResponse"
    Forbidden:
      description: Insufficient permission（RBAC 拒绝）
      content:
        application/json:
          schema:
            $ref: "#/components/schemas/ErrorResponse"
    NotFound:
      description: Resource not found（软删除后同样 404）
      content:
        application/json:
          schema:
            $ref: "#/components/schemas/ErrorResponse"
    Conflict:
      description: Conflict（code 重复 / version 过期 / 状态不允许）
      content:
        application/json:
          schema:
            $ref: "#/components/schemas/ErrorResponse"

  schemas:
    # --------------------------------------------------------------------------
    # 基础
    # --------------------------------------------------------------------------
    HealthResponse:
      type: object
      required: [status, service, timestamp]
      properties:
        status: { type: string, example: ok }
        service: { type: string, example: linier-crm-web }
        timestamp: { type: string, format: date-time }

    LoginRequest:
      type: object
      required: [email, password]
      properties:
        email: { type: string, format: email }
        password: { type: string, minLength: 8 }

    LoginResponse:
      type: object
      required: [success, data]
      properties:
        success: { type: boolean, example: true }
        data:
          type: object
          required: [token, user]
          properties:
            token: { type: string, description: JWT session token }
            user: { $ref: "#/components/schemas/User" }

    MeResponse:
      type: object
      required: [success, data]
      properties:
        success: { type: boolean, example: true }
        data: { $ref: "#/components/schemas/User" }

    User:
      type: object
      required: [id, email]
      properties:
        id: { type: string }
        email: { type: string, format: email }
        name: { type: [string, "null"] }
        roles:
          type: array
          items: { type: string }

    ErrorResponse:
      type: object
      required: [error]
      properties:
        error:
          type: object
          required: [code, message]
          properties:
            code:
              type: string
              example: WORKFLOW_DEFINITION_NOT_FOUND
            message:
              type: string
            details:
              type: object

    DeleteResponse:
      type: object
      required: [success, data]
      properties:
        success: { type: boolean, example: true }
        data:
          type: object
          required: [id, deleted]
          properties:
            id: { type: string }
            deleted: { type: boolean, example: true }

    # --------------------------------------------------------------------------
    # 枚举
    # --------------------------------------------------------------------------
    WorkflowStatus:
      type: string
      enum: [DRAFT, ACTIVE, ARCHIVED]
      description: DRAFT 草稿 / ACTIVE 已发布 / ARCHIVED 已归档

    ApprovalMode:
      type: string
      enum: [SEQUENTIAL, PARALLEL, ANY_ONE, COUNTERSIGN]
      description: 串签 / 会签（全签）/ 或签 / 会签（人数）

    ApproverType:
      type: string
      enum: [USER, ROLE, DEPARTMENT, APPROVER_GROUP]

    ConditionOperator:
      type: string
      enum: [EQ, NEQ, GT, GTE, LT, LTE, IN, NOT_IN, CONTAINS]

    WorkflowInstanceStatus:
      type: string
      enum: [RUNNING, COMPLETED, REJECTED, TERMINATED, WITHDRAWN]

    WorkflowActionType:
      type: string
      enum: [SUBMIT, APPROVE, REJECT, RETURN, TRANSFER, DELEGATE, WITHDRAW, TERMINATE, COMMENT]

    ApproverStatus:
      type: string
      enum: [PENDING, APPROVED, REJECTED, DELEGATED, SKIPPED]

    SettingScope:
      type: string
      enum: [SYSTEM, TENANT, USER]

    SettingDataType:
      type: string
      enum: [STRING, NUMBER, BOOLEAN, JSON, SECRET]

    NotificationChannelType:
      type: string
      enum: [SYSTEM, EMAIL, TELEGRAM, WEBHOOK, WECHAT, DINGTALK]

    # --------------------------------------------------------------------------
    # Workflow Definition
    # --------------------------------------------------------------------------
    WorkflowCondition:
      type: object
      required: [field, operator, value]
      properties:
        id: { type: string }
        expression: { type: [string, "null"], description: 组合表达式（预留） }
        field: { type: string, example: amount }
        operator: { $ref: "#/components/schemas/ConditionOperator" }
        value: { type: string, example: "100000" }

    WorkflowStep:
      type: object
      required: [stepNo, stepName, approverType, approvalMode]
      properties:
        id: { type: string }
        stepNo: { type: integer, example: 1 }
        stepName: { type: string, example: 销售经理审批 }
        approverType: { $ref: "#/components/schemas/ApproverType" }
        approverValue: { type: [string, "null"], description: 用户ID/角色编码/部门编码/审批组编码 }
        approvalMode: { $ref: "#/components/schemas/ApprovalMode" }
        timeoutHours: { type: [integer, "null"] }
        allowReject: { type: boolean, default: true }
        allowTransfer: { type: boolean, default: false }
        allowDelegate: { type: boolean, default: false }
        allowWithdraw: { type: boolean, default: false }
        conditions:
          type: array
          items: { $ref: "#/components/schemas/WorkflowCondition" }

    WorkflowDefinition:
      type: object
      required: [id, code, name, module, version, status]
      properties:
        id: { type: string }
        code: { type: string, example: QUOTATION_APPROVAL }
        name: { type: string }
        module: { type: string, example: quotation }
        version: { type: integer, description: 乐观锁版本，更新必须携带 }
        status: { $ref: "#/components/schemas/WorkflowStatus" }
        description: { type: [string, "null"] }
        isActive: { type: boolean }
        deletedAt: { type: [string, "null"], format: date-time, description: 非空即已软删除 }
        createdAt: { type: string, format: date-time }
        updatedAt: { type: string, format: date-time }
        steps:
          type: array
          items: { $ref: "#/components/schemas/WorkflowStep" }

    WorkflowDefinitionCreate:
      type: object
      required: [code, name, module, steps]
      properties:
        code:
          type: string
          pattern: "^[A-Z0-9_]+$"
          minLength: 2
          maxLength: 64
        name: { type: string, minLength: 1, maxLength: 100 }
        module: { type: string, minLength: 1, maxLength: 50 }
        description: { type: string, maxLength: 500 }
        steps:
          type: array
          minItems: 1
          items: { $ref: "#/components/schemas/WorkflowStep" }

    WorkflowDefinitionUpdate:
      type: object
      required: [version]
      properties:
        version: { type: integer, description: 乐观锁版本（必须与当前一致，否则 409） }
        code: { type: string }
        name: { type: string }
        module: { type: string }
        description: { type: string }
        steps:
          type: array
          items: { $ref: "#/components/schemas/WorkflowStep" }
          description: 仅 DRAFT 状态允许修改 steps/code/module

    WorkflowDefinitionResponse:
      type: object
      required: [success, data]
      properties:
        success: { type: boolean, example: true }
        data: { $ref: "#/components/schemas/WorkflowDefinition" }

    WorkflowDefinitionListResponse:
      type: object
      required: [success, data, meta]
      properties:
        success: { type: boolean, example: true }
        data:
          type: array
          items: { $ref: "#/components/schemas/WorkflowDefinition" }
        meta: { $ref: "#/components/schemas/PaginationMeta" }

    WorkflowStatusChangeResponse:
      type: object
      required: [success, data]
      properties:
        success: { type: boolean, example: true }
        data:
          type: object
          required: [id, status, version]
          properties:
            id: { type: string }
            status: { $ref: "#/components/schemas/WorkflowStatus" }
            version: { type: integer }

    PaginationMeta:
      type: object
      required: [page, pageSize, total]
      properties:
        page: { type: integer, example: 1 }
        pageSize: { type: integer, example: 20 }
        total: { type: integer, example: 0 }

    # --------------------------------------------------------------------------
    # Workflow Instance
    # --------------------------------------------------------------------------
    WorkflowInstanceCreate:
      type: object
      required: [definitionId, businessType, businessId]
      properties:
        definitionId: { type: string }
        businessType: { type: string, example: quotation }
        businessId: { type: string }
        payload:
          type: object
          description: 业务字段（用于条件评估，如 amount），可选

    WorkflowInstance:
      type: object
      required: [id, definitionId, businessType, businessId, startedBy, status]
      properties:
        id: { type: string }
        definitionId: { type: string }
        businessType: { type: string }
        businessId: { type: string }
        currentStepNo: { type: [integer, "null"] }
        startedBy: { type: string }
        startedAt: { type: string, format: date-time }
        completedAt: { type: [string, "null"], format: date-time }
        status: { $ref: "#/components/schemas/WorkflowInstanceStatus" }
        version: { type: integer }
        deletedAt: { type: [string, "null"], format: date-time }
        createdAt: { type: string, format: date-time }
        updatedAt: { type: string, format: date-time }

    WorkflowAction:
      type: object
      required: [id, instanceId, actionType, actorId]
      properties:
        id: { type: string }
        instanceId: { type: string }
        actionType: { $ref: "#/components/schemas/WorkflowActionType" }
        actorId: { type: string }
        targetUserId: { type: [string, "null"] }
        stepNo: { type: [integer, "null"] }
        comment: { type: [string, "null"] }
        createdAt: { type: string, format: date-time }

    WorkflowHistory:
      type: object
      required: [id, instanceId, actionType]
      properties:
        id: { type: string }
        instanceId: { type: string }
        stepNo: { type: [integer, "null"] }
        actionType: { $ref: "#/components/schemas/WorkflowActionType" }
        beforeStatus: { type: [string, "null"] }
        afterStatus: { type: [string, "null"] }
        actorId: { type: [string, "null"] }
        ip: { type: [string, "null"] }
        device: { type: [string, "null"] }
        browser: { type: [string, "null"] }
        remark: { type: [string, "null"] }
        attachment: { type: [string, "null"] }
        duration: { type: [integer, "null"], description: 耗时（秒） }
        createdAt: { type: string, format: date-time }

    Approver:
      type: object
      required: [id, instanceId, stepNo, userId, status]
      properties:
        id: { type: string }
        instanceId: { type: string }
        stepNo: { type: integer }
        userId: { type: string }
        status: { $ref: "#/components/schemas/ApproverStatus" }
        delegatedFrom: { type: [string, "null"] }
        decidedAt: { type: [string, "null"], format: date-time }
        comment: { type: [string, "null"] }

    WorkflowInstanceResponse:
      type: object
      required: [success, data]
      properties:
        success: { type: boolean, example: true }
        data:
          allOf:
            - $ref: "#/components/schemas/WorkflowInstance"
            - type: object
              properties:
                definition: { $ref: "#/components/schemas/WorkflowDefinition" }
                approvers:
                  type: array
                  items: { $ref: "#/components/schemas/Approver" }
                actions:
                  type: array
                  items: { $ref: "#/components/schemas/WorkflowAction" }
                history:
                  type: array
                  items: { $ref: "#/components/schemas/WorkflowHistory" }

    WorkflowInstanceListResponse:
      type: object
      required: [success, data, meta]
      properties:
        success: { type: boolean, example: true }
        data:
          type: array
          items:
            allOf:
              - $ref: "#/components/schemas/WorkflowInstance"
              - type: object
                properties:
                  definition:
                    type: object
                    properties:
                      code: { type: string }
                      name: { type: string }
                      module: { type: string }
                      version: { type: integer }
        meta: { $ref: "#/components/schemas/PaginationMeta" }

    WorkflowActionRequest:
      type: object
      required: [actionType]
      properties:
        actionType: { $ref: "#/components/schemas/WorkflowActionType" }
        targetUserId: { type: string, description: TRANSFER/DELEGATE 必填 }
        stepNo: { type: integer }
        comment: { type: string, maxLength: 1000, description: 备注（remark） }
        payload:
          type: object
          description: 业务字段（重新提交/条件评估用），可选

    WorkflowActionResult:
      type: object
      required: [success, data]
      properties:
        success: { type: boolean, example: true }
        data:
          type: object
          required: [instanceId, action]
          properties:
            instanceId: { type: string }
            action: { $ref: "#/components/schemas/WorkflowAction" }
            afterStatus: { $ref: "#/components/schemas/WorkflowInstanceStatus" }
            currentStepNo: { type: [integer, "null"] }
            completedAt: { type: [string, "null"], format: date-time }

    WorkflowHistoryListResponse:
      type: object
      required: [success, data, meta]
      properties:
        success: { type: boolean, example: true }
        data:
          type: array
          items: { $ref: "#/components/schemas/WorkflowHistory" }
        meta: { $ref: "#/components/schemas/PaginationMeta" }

    # --------------------------------------------------------------------------
    # Approver Group
    # --------------------------------------------------------------------------
    ApproverGroupCreate:
      type: object
      required: [code, name]
      properties:
        code:
          type: string
          pattern: "^[A-Z0-9_]+$"
          minLength: 2
          maxLength: 64
        name: { type: string, minLength: 1, maxLength: 100 }
        description: { type: string, maxLength: 500 }
        memberUserIds:
          type: array
          items: { type: string }
          description: 成员用户 ID 列表

    ApproverGroupUpdate:
      type: object
      required: [version]
      properties:
        version: { type: integer }
        code: { type: string }
        name: { type: string }
        description: { type: string }
        memberUserIds:
          type: array
          items: { type: string }
          description: 全量替换成员

    ApproverGroup:
      type: object
      required: [id, code, name, version]
      properties:
        id: { type: string }
        code: { type: string }
        name: { type: string }
        description: { type: [string, "null"] }
        version: { type: integer }
        isActive: { type: boolean }
        deletedAt: { type: [string, "null"], format: date-time }
        createdAt: { type: string, format: date-time }
        updatedAt: { type: string, format: date-time }
        members:
          type: array
          items:
            type: object
            properties:
              id: { type: string }
              userId: { type: string }

    ApproverGroupResponse:
      type: object
      required: [success, data]
      properties:
        success: { type: boolean, example: true }
        data: { $ref: "#/components/schemas/ApproverGroup" }

    ApproverGroupListResponse:
      type: object
      required: [success, data, meta]
      properties:
        success: { type: boolean, example: true }
