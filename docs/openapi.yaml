            workflowSkipped: { type: [string, "null"], description: "跳过原因：no-policy / no-rule-matched / instance-running / not-found" }

    CreditDebitNoteApplyResponse:
      type: object
      required: [success, data]
      properties:
        success: { type: boolean, example: true }
        data:
          type: object
          properties:
            creditDebitNoteId: { type: string }
            status: { type: string, description: "APPLIED" }
            appliedAt: { type: string, format: date-time }
            arIds: { type: array, items: { type: string } }
            signedAdjustmentTotal: { type: number, description: "Σ signed adjustmentAmount（CN 负 / DN 正）" }
            newBalance: { type: number, description: "AR.balanceAmount 经 computeBalance 计算后的新余额（可负 = Customer Credit）" }
            newStatus: { type: string }
            factCount: { type: integer }

    CreditDebitNoteErrorCodes:
      type: string
      description: |
        CreditDebitNote 领域错误码（与实现 errors.ts 一致）：
        - CN_DN_NOT_FOUND（404）调整单不存在
        - CN_DN_SOURCE_INVOICE_INVALID（409）源 Invoice 无效（必须已 ISSUED）
        - CN_DN_SOURCE_LINE_INVALID（409）明细行不属于该 Invoice
        - CN_DN_SOURCE_NOT_COMPATIBLE（409）源 Invoice/AR 校验失败（customer/currency 不一致）
        - CN_DN_INVALID_STATE（409）仅 DRAFT 可提交 / 仅 SUBMITTED 可 Apply
        - CN_DN_ALREADY_APPLIED（409）重复 Apply（幂等稳定 409）
        - CN_DN_APPROVAL_REQUIRED（409）命中审批策略但未 APPROVED，禁止 Apply（APPROVED ≠ APPLIED）
        - CN_DN_QUANTITY_EXCEEDED（409）调整数量超出剩余可调整数量（累计防超调）
        - CN_DN_AMOUNT_EXCEEDED（409）调整金额超出原行金额上限（行级 ceiling）
        - CN_DN_WORKFLOW_FAILED（409）命中策略但工作流定义缺失/未激活（提交已回滚）
