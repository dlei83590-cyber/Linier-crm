          application/json:
            schema:
              $ref: "#/components/schemas/SupplierInvoiceUpdate"
      responses:
        "200":
          description: OK
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/SupplierInvoiceResponse"
        "400":
          $ref: "#/components/responses/BadRequest"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "403":
          $ref: "#/components/responses/Forbidden"
        "404":
          $ref: "#/components/responses/NotFound"
        "409":
          description: Conflict（非 DRAFT / 版本冲突）

  /api/supplier-invoices/{id}/submit:
    post:
      tags: [Supplier Invoices]
      summary: Submit supplier invoice (DRAFT → SUBMITTED；RECEIPT_BASED 三重 Gate 第三次验证；SUBMITTED ≠ POSTED)
      description: |
        提交供应商发票（DRAFT → SUBMITTED）。**第三次 RECEIPT_BASED 三重 Gate（红线 1）**：状态迁移前重新验证
        每行 WHR POSTED + WHR Line ↔ PO Line ↔ Item ↔ Supplier 来源链一致 + 数量 ≤ 已入库
        （创建/编辑后来源事实异常变化也不会带入后续 Match 阶段）。
        **SUBMITTED ≠ POSTED**：submit 只做状态迁移，**不创建 MatchRun / GRIR / ApLiabilityFact**（5C-1B/1C），
        不写 postedAt/postedById。SUBMITTED 仅 AuditLog（SupplierInvoiceCreated 注册位保持 ⏳——EVENTS v1.31）。
        权限：supplier-invoice:edit。
      operationId: submitSupplierInvoice
      security:
        - bearerAuth: []
      parameters:
        - name: id
          in: path
          required: true
          schema: { type: string }
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/SupplierInvoiceVersionRequest"
      responses:
        "200":
          description: OK
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/SupplierInvoiceResponse"
        "400":
          $ref: "#/components/responses/BadRequest"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "403":
          $ref: "#/components/responses/Forbidden"
        "404":
          $ref: "#/components/responses/NotFound"
        "409":
          description: Conflict（非 DRAFT / 版本冲突）

  /api/supplier-invoices/{id}/match:
    post:
      tags: [Supplier Invoices]
      summary: Immutable 3-Way Match（SUBMITTED/MATCHED → MATCHED，追加 immutable revision；Match/Approval 分层）
      description: |
        **Immutable 3-Way Match（CTO #9238/#9247）**：SUBMITTED/MATCHED → MATCHED（追加 immutable revision）。
        Match Engine（runMatch）事务内固定顺序：FOR UPDATE 锁 SupplierInvoice header（唯一串行点）→ 重读状态/current run →
        状态门禁（SUBMITTED/MATCHED 可进；APPROVED/POSTED/CANCELLED 禁直接 re-match → 409 MATCH_NOT_MATCHABLE）→
        CAS version → 锁内算 next revision（max+1）→ 来源链重验（WHR POSTED + 链一致 + Item ACTIVE + 累计守恒）→
        服务端 snapshot 计算（poQty/receiptQty/invoiceQty/poUnitPrice/invoiceUnitPrice/qtyVariance/priceVariance/
        taxVariance/result/disposition——**客户端不得上传计算结果**）→ 创建 MatchRun + MatchLines（immutable，DB trigger 兜底）→
        更新 current projection（header.currentMatchRunId + lines currentMatchRunId/currentMatchStatus/matchedQty/variance*）→
        CAS documentStatus → MATCHED（version+1）。
        **Match API 自己不写 approvedMatchRunId/approvedMatchRevision**（Approval 单独接 Workflow——#9238；
        Match 成功后 maybeTrigger 把 matchRunId+revision 绑定进 workflow business context——#9247 细节③）。
        红线：不创建 GrirRecord/ApLiabilityFact/ApOpenItem；不写 postedAt/postedById；不接 CN/DN。
        权限：supplier-invoice:edit。
      operationId: matchSupplierInvoice
      security:
        - bearerAuth: []
      parameters:
        - name: id
          in: path
          required: true
          schema: { type: string }
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/SupplierInvoiceVersionRequest"
      responses:
        "200":
          description: OK
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/SupplierInvoiceMatchResponse"
        "400":
          $ref: "#/components/responses/BadRequest"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "403":
          $ref: "#/components/responses/Forbidden"
        "404":
          $ref: "#/components/responses/NotFound"
        "409":
          description: Conflict（非 MATCHABLE / 版本冲突）

components:
  securitySchemes:
    bearerAuth:
      type: http
      scheme: bearer
      bearerFormat: JWT

  responses:
    BadRequest:
      description: Validation error（Zod 校验失败）
      content:
        application/json:
          schema:
            $ref: "#/components/schemas/ErrorResponse"
    Unauthorized:
      description: Missing or invalid credentials
      content:
        application/json:
          schema:
            $ref: "#/components/schemas/ErrorResponse"
    Forbidden:
      description: Insufficient permission（RBAC 拒绝）
      content:
        application/json:
          schema:
            $ref: "#/components/schemas/ErrorResponse"
    NotFound:
      description: Resource not found（软删除后同样 404）
      content:
        application/json:
          schema:
            $ref: "#/components/schemas/ErrorResponse"
    Conflict:
      description: Conflict（code 重复 / version 过期 / 状态不允许）
      content:
        application/json:
          schema:
            $ref: "#/components/schemas/ErrorResponse"

  schemas:
    # --------------------------------------------------------------------------
    # Customer Foundation（Sprint 3C-1）
    # --------------------------------------------------------------------------
    CustomerLevel:
      type: string
      enum: [VIP, KEY, REGULAR, PROSPECT]

    CustomerCreditRating:
      type: string
      enum: [AAA, AA, A, BBB, BB, B, C]

    CustomerCreditStatus:
      type: string
      enum: [NORMAL, WATCH, FROZEN, CLOSED]

    CustomerAddressType:
      type: string
      enum: [REGISTERED, SHIPPING, INVOICING, CONTACT]

    Customer:
      type: object
      required: [id, code, name, level, version]
      properties:
        id: { type: string }
        code: { type: string, description: 客户编码 }
        name: { type: string }
        shortName: { type: [string, "null"] }
        partnerId: { type: [string, "null"], description: 关联统一往来单位 }
        level: { $ref: "#/components/schemas/CustomerLevel" }
        industryId: { type: [string, "null"] }
        region: { type: [string, "null"] }
        sourceChannel: { type: [string, "null"] }
        companySize: { type: [string, "null"] }
        foundedDate: { type: [string, "null"], format: date-time }
        website: { type: [string, "null"] }
        version: { type: integer, description: 乐观锁 }
        isActive: { type: boolean }
        deletedAt: { type: [string, "null"], format: date-time }
        createdAt: { type: string, format: date-time }
        updatedAt: { type: string, format: date-time }
        contacts:
          type: array
          items: { $ref: "#/components/schemas/CustomerContact" }
        addresses:
          type: array
          items: { $ref: "#/components/schemas/CustomerAddress" }
        tags:
          type: array
          items: { $ref: "#/components/schemas/CustomerTag" }
        credit:
          type: [object, "null"]
          allOf:
            - $ref: "#/components/schemas/CustomerCredit"

    CustomerCreate:
      type: object
      required: [code, name]
      properties:
        code: { type: string, minLength: 1, maxLength: 64 }
        name: { type: string, minLength: 1, maxLength: 200 }
        shortName: { type: string, maxLength: 100 }
        partnerId: { type: string }
        level: { $ref: "#/components/schemas/CustomerLevel" }
        industryId: { type: string }
        region: { type: string, maxLength: 50 }
        sourceChannel: { type: string, maxLength: 50 }
        companySize: { type: string, maxLength: 50 }
        foundedDate: { type: string, format: date-time }
        website: { type: string, maxLength: 200 }

    CustomerUpdate:
      type: object
      required: [version]
      properties:
        version: { type: integer }
        code: { type: string }
        name: { type: string }
        shortName: { type: [string, "null"] }
        partnerId: { type: [string, "null"] }
        level: { $ref: "#/components/schemas/CustomerLevel" }
        industryId: { type: [string, "null"] }
        region: { type: [string, "null"] }
        sourceChannel: { type: [string, "null"] }
        companySize: { type: [string, "null"] }
        foundedDate: { type: [string, "null"], format: date-time }
        website: { type: [string, "null"] }

    CustomerResponse:
      type: object
      required: [success, data]
      properties:
        success: { type: boolean, example: true }
        data: { $ref: "#/components/schemas/Customer" }

    CustomerListResponse:
      type: object
      required: [success, data, meta]
      properties:
        success: { type: boolean, example: true }
        data:
          type: array
          items: { $ref: "#/components/schemas/Customer" }
        meta: { $ref: "#/components/schemas/PaginationMeta" }

    CustomerContact:
      type: object
      required: [id, customerId, name, version]
      properties:
        id: { type: string }
        customerId: { type: string }
        name: { type: string }
        title: { type: [string, "null"] }
        department: { type: [string, "null"] }
        phone: { type: [string, "null"] }
        email: { type: [string, "null"], format: email }
        wechat: { type: [string, "null"] }
        isPrimary: { type: boolean, description: 主联系人（同客户唯一） }
        sort: { type: integer }
        version: { type: integer }
        deletedAt: { type: [string, "null"], format: date-time }
        createdAt: { type: string, format: date-time }
        updatedAt: { type: string, format: date-time }

    CustomerContactCreate:
      type: object
      required: [name]
      properties:
        name: { type: string, minLength: 1, maxLength: 100 }
        title: { type: string, maxLength: 100 }
        department: { type: string, maxLength: 100 }
        phone: { type: string, maxLength: 30 }
        email: { type: string, format: email }
        wechat: { type: string, maxLength: 100 }
        isPrimary: { type: boolean, default: false }
        sort: { type: integer, default: 0 }

    CustomerContactUpdate:
      type: object
      required: [version]
      properties:
        version: { type: integer }
        name: { type: string }
        title: { type: [string, "null"] }
        department: { type: [string, "null"] }
        phone: { type: [string, "null"] }
        email: { type: [string, "null"], format: email }
        wechat: { type: [string, "null"] }
        isPrimary: { type: boolean }
        sort: { type: integer }

    CustomerContactResponse:
      type: object
      required: [success, data]
      properties:
        success: { type: boolean, example: true }
        data: { $ref: "#/components/schemas/CustomerContact" }

    CustomerContactListResponse:
      type: object
      required: [success, data, meta]
      properties:
        success: { type: boolean, example: true }
        data:
          type: array
          items: { $ref: "#/components/schemas/CustomerContact" }
        meta: { $ref: "#/components/schemas/PaginationMeta" }

    CustomerAddress:
      type: object
      required: [id, customerId, addressType, version]
      properties:
        id: { type: string }
        customerId: { type: string }
        addressType: { $ref: "#/components/schemas/CustomerAddressType" }
        recipient: { type: [string, "null"] }
        phone: { type: [string, "null"] }
        province: { type: [string, "null"] }
        city: { type: [string, "null"] }
        district: { type: [string, "null"] }
        detail: { type: [string, "null"] }
        isDefault: { type: boolean, description: 默认地址（同客户同类型唯一） }
        sort: { type: integer }
        version: { type: integer }
        deletedAt: { type: [string, "null"], format: date-time }
        createdAt: { type: string, format: date-time }
        updatedAt: { type: string, format: date-time }

    CustomerAddressCreate:
      type: object
      properties:
        addressType: { $ref: "#/components/schemas/CustomerAddressType" }
        recipient: { type: string, maxLength: 100 }
        phone: { type: string, maxLength: 30 }
        province: { type: string, maxLength: 50 }
        city: { type: string, maxLength: 50 }
        district: { type: string, maxLength: 50 }
        detail: { type: string, maxLength: 300 }
        isDefault: { type: boolean, default: false }
        sort: { type: integer, default: 0 }

    CustomerAddressUpdate:
      type: object
      required: [version]
      properties:
        version: { type: integer }
        addressType: { $ref: "#/components/schemas/CustomerAddressType" }
        recipient: { type: [string, "null"] }
        phone: { type: [string, "null"] }
        province: { type: [string, "null"] }
        city: { type: [string, "null"] }
        district: { type: [string, "null"] }
        detail: { type: [string, "null"] }
        isDefault: { type: boolean }
        sort: { type: integer }

    CustomerAddressResponse:
      type: object
      required: [success, data]
      properties:
        success: { type: boolean, example: true }
        data: { $ref: "#/components/schemas/CustomerAddress" }

    CustomerAddressListResponse:
      type: object
      required: [success, data, meta]
      properties:
        success: { type: boolean, example: true }
        data:
          type: array
          items: { $ref: "#/components/schemas/CustomerAddress" }
        meta: { $ref: "#/components/schemas/PaginationMeta" }

    Tag:
      type: object
      required: [id, code, name, version]
      properties:
        id: { type: string }
        code: { type: string }
        name: { type: string }
        color: { type: [string, "null"] }
        sort: { type: integer }
        enabled: { type: boolean }
        version: { type: integer }
        deletedAt: { type: [string, "null"], format: date-time }
        createdAt: { type: string, format: date-time }
        updatedAt: { type: string, format: date-time }

    TagCreate:
      type: object
      required: [code, name]
      properties:
        code:
          type: string
          pattern: "^[A-Z0-9_]+$"
          minLength: 2
          maxLength: 64
        name: { type: string, minLength: 1, maxLength: 100 }
        color: { type: string, maxLength: 20 }
        sort: { type: integer, default: 0 }
        enabled: { type: boolean, default: true }

    TagUpdate:
      type: object
      required: [version]
      properties:
        version: { type: integer }
        code: { type: string }
        name: { type: string }
        color: { type: [string, "null"] }
        sort: { type: integer }
        enabled: { type: boolean }

    TagResponse:
      type: object
      required: [success, data]
      properties:
        success: { type: boolean, example: true }
        data: { $ref: "#/components/schemas/Tag" }

    TagListResponse:
      type: object
      required: [success, data, meta]
      properties:
        success: { type: boolean, example: true }
        data:
          type: array
          items: { $ref: "#/components/schemas/Tag" }
        meta: { $ref: "#/components/schemas/PaginationMeta" }

    CustomerTag:
      type: object
      required: [id, customerId, tagId]
      properties:
        id: { type: string }
        customerId: { type: string }
        tagId: { type: string }
        createdAt: { type: string, format: date-time }
        tag:
          type: [object, "null"]
          properties:
            id: { type: string }
            code: { type: string }
            name: { type: string }
            color: { type: [string, "null"] }

    CustomerTagCreate:
      type: object
      properties:
