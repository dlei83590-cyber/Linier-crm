    # --------------------------------------------------------------------------
    # Menu Center（Sprint 3B）
    # --------------------------------------------------------------------------
    MenuGroup:
      type: object
      required: [id, code, name, version]
      properties:
        id: { type: string }
        code: { type: string, description: 唯一编码（DASHBOARD/MASTER_DATA 等） }
        name: { type: string }
        icon: { type: [string, "null"] }
        sort: { type: integer }
        version: { type: integer, description: 乐观锁 }
        isActive: { type: boolean }
        deletedAt: { type: [string, "null"], format: date-time }
        createdAt: { type: string, format: date-time }
        updatedAt: { type: string, format: date-time }
        menus:
          type: array
          items: { $ref: "#/components/schemas/Menu" }
        _count:
          type: object
          properties:
            menus: { type: integer }

    Menu:
      type: object
      required: [id, groupId, code, name, version]
      properties:
        id: { type: string }
        groupId: { type: string, description: FK → MenuGroup }
        parentId: { type: [string, "null"], description: 树形父节点 }
        code: { type: string, description: 唯一编码 }
        name: { type: string }
        path: { type: [string, "null"], description: 路由路径 }
        icon: { type: [string, "null"], description: 图标 }
        sort: { type: integer, description: 排序 }
        hidden: { type: boolean, description: 隐藏 }
        cache: { type: boolean, description: 缓存 }
        externalLink: { type: [string, "null"], description: 外链 }
        permission: { type: [string, "null"], description: 关联权限码 }
        version: { type: integer }
        isActive: { type: boolean }
        deletedAt: { type: [string, "null"], format: date-time }
        createdAt: { type: string, format: date-time }
        updatedAt: { type: string, format: date-time }
        children:
          type: array
          items: { $ref: "#/components/schemas/Menu" }
          description: tree=true 时返回
        group:
          type: [object, "null"]
          properties:
            code: { type: string }
            name: { type: string }

    MenuCreate:
      type: object
      required: [groupId, code, name]
      properties:
        groupId: { type: string }
        parentId: { type: string }
        code: { type: string, minLength: 1, maxLength: 64 }
        name: { type: string, minLength: 1, maxLength: 100 }
        path: { type: string, maxLength: 200 }
        icon: { type: string, maxLength: 100 }
        sort: { type: integer, default: 0 }
        hidden: { type: boolean, default: false }
        cache: { type: boolean, default: false }
        externalLink: { type: string, maxLength: 500 }
        permission: { type: string, maxLength: 100 }

    MenuUpdate:
      type: object
      required: [version]
      properties:
        version: { type: integer, description: 乐观锁（必须与当前一致） }
        groupId: { type: string }
        parentId: { type: [string, "null"], description: null 表示移到根 }
        code: { type: string }
        name: { type: string }
        path: { type: [string, "null"] }
        icon: { type: [string, "null"] }
        sort: { type: integer }
        hidden: { type: boolean }
        cache: { type: boolean }
        externalLink: { type: [string, "null"] }
        permission: { type: [string, "null"] }

    MenuGroupCreate:
      type: object
      required: [code, name]
      properties:
        code:
          type: string
          pattern: "^[A-Z0-9_]+$"
          minLength: 2
          maxLength: 64
        name: { type: string, minLength: 1, maxLength: 100 }
        icon: { type: string, maxLength: 100 }
        sort: { type: integer, default: 0 }

    MenuGroupUpdate:
      type: object
      required: [version]
      properties:
        version: { type: integer }
        code: { type: string }
        name: { type: string }
        icon: { type: [string, "null"] }
        sort: { type: integer }

    MenuResponse:
      type: object
      required: [success, data]
      properties:
        success: { type: boolean, example: true }
        data: { $ref: "#/components/schemas/Menu" }

    MenuListResponse:
      type: object
      required: [success, data, meta]
      properties:
        success: { type: boolean, example: true }
        data:
          type: array
          items: { $ref: "#/components/schemas/Menu" }
        meta: { $ref: "#/components/schemas/PaginationMeta" }

    MenuGroupResponse:
      type: object
      required: [success, data]
      properties:
        success: { type: boolean, example: true }
        data: { $ref: "#/components/schemas/MenuGroup" }

    MenuGroupListResponse:
      type: object
      required: [success, data, meta]
      properties:
        success: { type: boolean, example: true }
        data:
          type: array
          items: { $ref: "#/components/schemas/MenuGroup" }
        meta: { $ref: "#/components/schemas/PaginationMeta" }

    # --------------------------------------------------------------------------
    # Audit（Sprint 3B 升级）
    # --------------------------------------------------------------------------
    AuditResult:
      type: string
      enum: [SUCCESS, FAILURE, PARTIAL]

    AuditLog:
      type: object
      required: [id, action, entityType, result]
      properties:
        id: { type: string }
        actorId: { type: [string, "null"] }
        actor:
          type: [object, "null"]
          properties:
            id: { type: string }
            email: { type: string }
            name: { type: [string, "null"] }
        action: { type: string, example: workflow-definition.create }
        entityType: { type: string, description: ObjectType，如 workflow-definition }
        entityId: { type: [string, "null"], description: ObjectId }
        beforeData: { type: [object, "null"], description: 操作前数据快照 }
        afterData: { type: [object, "null"], description: 操作后数据快照 }
        requestId: { type: [string, "null"], description: 请求 ID（链路追踪） }
        traceId: { type: [string, "null"], description: 全链路追踪 ID }
        meta: { type: [object, "null"] }
        ipAddress: { type: [string, "null"] }
        device: { type: [string, "null"], description: mobile/desktop }
        browser: { type: [string, "null"], description: Chrome/Firefox/Edge/Safari }
        duration: { type: [integer, "null"], description: 耗时（毫秒） }
        result: { $ref: "#/components/schemas/AuditResult" }
        createdAt: { type: string, format: date-time }

    AuditLogResponse:
      type: object
      required: [success, data]
      properties:
        success: { type: boolean, example: true }
        data: { $ref: "#/components/schemas/AuditLog" }

    AuditLogListResponse:
      type: object
      required: [success, data, meta]
      properties:
        success: { type: boolean, example: true }
        data:
          type: array
          items: { $ref: "#/components/schemas/AuditLog" }
        meta: { $ref: "#/components/schemas/PaginationMeta" }

    # --------------------------------------------------------------------------
    # 基础
    # --------------------------------------------------------------------------
    HealthResponse:
      type: object
      required: [status, service, timestamp]
      properties:
        status: { type: string, example: ok }
        service: { type: string, example: linier-crm-web }
        timestamp: { type: string, format: date-time }

    LoginRequest:
      type: object
      required: [email, password]
      properties:
        email: { type: string, format: email }
        password: { type: string, minLength: 8 }

    LoginResponse:
      type: object
      required: [success, data]
      properties:
        success: { type: boolean, example: true }
        data:
          type: object
          required: [token, user]
          properties:
            token: { type: string, description: JWT session token }
            user: { $ref: "#/components/schemas/User" }

    MeResponse:
      type: object
      required: [success, data]
      properties:
        success: { type: boolean, example: true }
        data: { $ref: "#/components/schemas/User" }

    User:
      type: object
      required: [id, email]
      properties:
        id: { type: string }
        email: { type: string, format: email }
        name: { type: [string, "null"] }
        roles:
          type: array
          items: { type: string }

    ErrorResponse:
      type: object
      required: [error]
      properties:
        error:
          type: object
          required: [code, message]
          properties:
            code:
              type: string
              example: WORKFLOW_DEFINITION_NOT_FOUND
            message:
              type: string
            details:
              type: object

    DeleteResponse:
      type: object
      required: [success, data]
      properties:
        success: { type: boolean, example: true }
        data:
          type: object
          required: [id, deleted]
          properties:
            id: { type: string }
            deleted: { type: boolean, example: true }

    # --------------------------------------------------------------------------
    # 枚举
    # --------------------------------------------------------------------------
    WorkflowStatus:
      type: string
      enum: [DRAFT, ACTIVE, ARCHIVED]
      description: DRAFT 草稿 / ACTIVE 已发布 / ARCHIVED 已归档

    ApprovalMode:
      type: string
      enum: [SEQUENTIAL, PARALLEL, ANY_ONE, COUNTERSIGN]
      description: 串签 / 会签（全签）/ 或签 / 会签（人数）

    ApproverType:
      type: string
      enum: [USER, ROLE, DEPARTMENT, APPROVER_GROUP]

    ConditionOperator:
      type: string
      enum: [EQ, NEQ, GT, GTE, LT, LTE, IN, NOT_IN, CONTAINS]

    WorkflowInstanceStatus:
      type: string
      enum: [RUNNING, COMPLETED, REJECTED, TERMINATED, WITHDRAWN]

    WorkflowActionType:
      type: string
      enum: [SUBMIT, APPROVE, REJECT, RETURN, TRANSFER, DELEGATE, WITHDRAW, TERMINATE, COMMENT]

    ApproverStatus:
      type: string
      enum: [PENDING, APPROVED, REJECTED, DELEGATED, SKIPPED]

    SettingScope:
      type: string
      enum: [SYSTEM, TENANT, USER]

    SettingDataType:
      type: string
      enum: [STRING, NUMBER, BOOLEAN, JSON, SECRET]

    NotificationChannelType:
      type: string
      enum: [SYSTEM, EMAIL, TELEGRAM, WEBHOOK, WECHAT, DINGTALK]

    # --------------------------------------------------------------------------
    # Workflow Definition
    # --------------------------------------------------------------------------
    WorkflowCondition:
      type: object
      required: [field, operator, value]
      properties:
        id: { type: string }
        expression: { type: [string, "null"], description: 组合表达式（预留） }
        field: { type: string, example: amount }
        operator: { $ref: "#/components/schemas/ConditionOperator" }
        value: { type: string, example: "100000" }

    WorkflowStep:
      type: object
      required: [stepNo, stepName, approverType, approvalMode]
      properties:
        id: { type: string }
        stepNo: { type: integer, example: 1 }
        stepName: { type: string, example: 销售经理审批 }
        approverType: { $ref: "#/components/schemas/ApproverType" }
        approverValue: { type: [string, "null"], description: 用户ID/角色编码/部门编码/审批组编码 }
        approvalMode: { $ref: "#/components/schemas/ApprovalMode" }
        timeoutHours: { type: [integer, "null"] }
        allowReject: { type: boolean, default: true }
        allowTransfer: { type: boolean, default: false }
        allowDelegate: { type: boolean, default: false }
        allowWithdraw: { type: boolean, default: false }
        conditions:
          type: array
          items: { $ref: "#/components/schemas/WorkflowCondition" }

    WorkflowDefinition:
      type: object
      required: [id, code, name, module, version, status]
      properties:
        id: { type: string }
        code: { type: string, example: QUOTATION_APPROVAL }
        name: { type: string }
        module: { type: string, example: quotation }
        version: { type: integer, description: 乐观锁版本，更新必须携带 }
        status: { $ref: "#/components/schemas/WorkflowStatus" }
        description: { type: [string, "null"] }
        isActive: { type: boolean }
        deletedAt: { type: [string, "null"], format: date-time, description: 非空即已软删除 }
        createdAt: { type: string, format: date-time }
        updatedAt: { type: string, format: date-time }
        steps:
          type: array
          items: { $ref: "#/components/schemas/WorkflowStep" }

    WorkflowDefinitionCreate:
      type: object
      required: [code, name, module, steps]
      properties:
        code:
          type: string
          pattern: "^[A-Z0-9_]+$"
          minLength: 2
          maxLength: 64
        name: { type: string, minLength: 1, maxLength: 100 }
        module: { type: string, minLength: 1, maxLength: 50 }
        description: { type: string, maxLength: 500 }
        steps:
          type: array
          minItems: 1
          items: { $ref: "#/components/schemas/WorkflowStep" }

    WorkflowDefinitionUpdate:
      type: object
      required: [version]
      properties:
        version: { type: integer, description: 乐观锁版本（必须与当前一致，否则 409） }
        code: { type: string }
        name: { type: string }
        module: { type: string }
        description: { type: string }
        steps:
          type: array
          items: { $ref: "#/components/schemas/WorkflowStep" }
          description: 仅 DRAFT 状态允许修改 steps/code/module

    WorkflowDefinitionResponse:
      type: object
      required: [success, data]
      properties:
        success: { type: boolean, example: true }
        data: { $ref: "#/components/schemas/WorkflowDefinition" }

    WorkflowDefinitionListResponse:
      type: object
      required: [success, data, meta]
      properties:
        success: { type: boolean, example: true }
        data:
          type: array
          items: { $ref: "#/components/schemas/WorkflowDefinition" }
        meta: { $ref: "#/components/schemas/PaginationMeta" }

    WorkflowStatusChangeResponse:
      type: object
      required: [success, data]
      properties:
        success: { type: boolean, example: true }
        data:
          type: object
          required: [id, status, version]
          properties:
            id: { type: string }
            status: { $ref: "#/components/schemas/WorkflowStatus" }
            version: { type: integer }

    PaginationMeta:
      type: object
      required: [page, pageSize, total]
      properties:
        page: { type: integer, example: 1 }
        pageSize: { type: integer, example: 20 }
        total: { type: integer, example: 0 }

    # --------------------------------------------------------------------------
    # Workflow Instance
    # --------------------------------------------------------------------------
    WorkflowInstanceCreate:
      type: object
      required: [definitionId, businessType, businessId]
      properties:
