    ReceiptErrorCodes:
      type: string
      description: |
        Receipt / Allocation 领域错误码（与实现 errors.ts 一致）：
        - RECEIPT_NOT_FOUND（404）收款单不存在
        - RECEIPT_CUSTOMER_NOT_FOUND（404）收款客户不存在
        - RECEIPT_CUSTOMER_MISMATCH（409）收款单与应收客户不一致——不允许跨客户核销
        - RECEIPT_CURRENCY_MISMATCH（409）收款单与应收币种不一致——第一版禁止跨币种核销
        - RECEIPT_UNALLOCATED_EXCEEDED（409）核销金额超过收款单未分配余额
        - RECEIPT_ALLOCATION_EXCEEDED（409）核销金额超过应收余额——禁止超核销
        - RECEIPT_VOID_FORBIDDEN（409）仅未核销可作废；已核销须先 Allocation Reversal
        - RECEIPT_ALLOCATION_NOT_FOUND（404）核销记录不存在
        - RECEIPT_ALLOCATION_REVERSED（409）该核销已冲销，不可重复冲销

    WriteOffErrorCodes:
      type: string
      description: |
        WriteOff 领域错误码（与实现 errors.ts 一致）：
        - WRITE_OFF_NOT_FOUND（404）WriteOff 不存在
        - WRITE_OFF_INVALID_STATE（409）仅 DRAFT 可提交 / 状态不允许 Apply
        - WRITE_OFF_ALREADY_APPLIED（409）重复 Apply（幂等稳定 409）
        - WRITE_OFF_AMOUNT_EXCEEDED（400/409）写销金额必须大于 0 / 超过应收余额
        - WRITE_OFF_APPROVAL_REQUIRED（409）命中审批策略但未 APPROVED，禁止 Apply
        - WRITE_OFF_SOURCE_NOT_COMPATIBLE（409）目标 AR 必须同 Customer / 同 Currency
        - WRITE_OFF_WORKFLOW_FAILED（409）审批流程定义不存在或未发布（WRITE_OFF_APPROVAL）

    CreditDebitNoteType:
      type: string
      enum: [CREDIT, DEBIT]
      description: 调整单类型（CTO 98/100：全系统唯一符号口径——CREDIT 负向调整 AR（adjustmentAmount<0）、DEBIT 正向调整 AR（adjustmentAmount>0））

    CreditDebitNoteStatus:
      type: string
      enum: [DRAFT, SUBMITTED, APPLIED, CANCELLED]
      description: 调整单生命周期（审批状态走 approvalStatus 投影复用 ApprovalStatus——不膨胀；REJECTED 不占 status）

    CreditDebitNote:
      type: object
      required: [id, code, noteType, sourceInvoiceId, customerId, currency, reason, adjustmentTotal, status, approvalStatus, version]
      properties:
        id: { type: string }
        code: { type: string, description: 调整单编号（CN-/DN-2026-xxxx，DocumentSequence 创建即取号） }
        noteType: { $ref: "#/components/schemas/CreditDebitNoteType" }
        sourceInvoiceId: { type: string, description: 源发票（单票制必填唯一；跨票 Consolidated 延后） }
        customerId: { type: string, description: 客户（继承 sourceInvoice.customerId） }
        currency: { type: string, description: 币种（继承 sourceInvoice.currency） }
        reason: { type: string, description: 调整原因（折让/退货/价差/更正/其他） }
        adjustmentTotal: { type: number, description: 调整总额（= Σ lines.totalAmount，服务端计算，禁止直传头金额） }
        status: { $ref: "#/components/schemas/CreditDebitNoteStatus" }
        approvalPolicyId: { type: [string, "null"], description: 条件审批（module=CREDIT_DEBIT_NOTE；可空） }
        workflowInstanceId: { type: [string, "null"], description: 审批实例（Workflow 唯一审批事实源；不建 Approval 表） }
        approvalStatus: { type: string, description: 审批投影（DRAFT/PENDING/APPROVED/REJECTED——CTO：APPROVED ≠ APPLIED） }
        approvedAt: { type: [string, "null"], format: date-time }
        approvedById: { type: [string, "null"] }
        appliedAt: { type: [string, "null"], format: date-time, description: APPLIED 时才回写 AR（审批完成前禁止提前修改） }
        appliedById: { type: [string, "null"] }
        version: { type: integer }
        createdById: { type: [string, "null"] }
        updatedById: { type: [string, "null"] }
        deletedAt: { type: [string, "null"], format: date-time }
        isActive: { type: boolean }
        sourceInvoice:
          type: object
          description: 列表/详情一次带出的源发票摘要
          properties:
            id: { type: string }
            code: { type: [string, "null"] }
            invoiceTotal: { type: number }
            balanceAmount: { type: number }
        lines:
          type: array
          items: { $ref: "#/components/schemas/CreditDebitNoteLine" }

    CreditDebitNoteLine:
      type: object
      required: [id, creditDebitNoteId, sourceInvoiceLineId, lineNo, description, quantity, unitPrice, discountRate, lineAmount, taxAmount, totalAmount, version]
      properties:
        id: { type: string }
        creditDebitNoteId: { type: string }
        sourceInvoiceLineId: { type: string, description: 溯源发票行（必填可追溯——CTO 锁死） }
        lineNo: { type: integer, description: 行号（10/20/30/40 步进） }
        itemId: { type: [string, "null"], description: 物料（继承 InvoiceLine.itemId，可空） }
        description: { type: string, description: 描述（快照复制） }
        quantity: { type: number, description: 调整数量（>0；部分行数量调整——CTO 拍板④，累计防超调） }
        uomId: { type: [string, "null"] }
        unitPrice: { type: number, description: 单价快照（复制，不重算） }
        discountRate: { type: number, description: 折扣率快照（复制） }
        lineAmount: { type: number, description: 行未税金额（复制计算值） }
        taxAmount: { type: number, description: 行税额（复制） }
        totalAmount: { type: number, description: 行含税金额（复制） }
        version: { type: integer }
        createdById: { type: [string, "null"] }
        updatedById: { type: [string, "null"] }
        deletedAt: { type: [string, "null"], format: date-time }
        isActive: { type: boolean }

    InvoiceAdjustment:
      type: object
      description: |
        发票调整事实中间层（**只读 schema，不开放直接 create/edit API**——事实只能由 Apply 事务生成）。
        **4E-3 最核心事实层**：真正影响 AR.adjustedAmount 的唯一入口（客户端禁直接创建/修改）。
        双溯源：sourceNoteId/sourceNoteLineId（单据侧）+ invoiceId/invoiceLineId（发票侧）+ accountsReceivableId（AR 侧）。
      required: [id, sourceNoteId, sourceNoteLineId, invoiceId, accountsReceivableId, customerId, currency, adjustmentType, quantity, adjustmentAmount, version]
      properties:
        id: { type: string }
        sourceNoteId: { type: string, description: 来源调整单 }
        sourceNoteLineId: { type: string, description: 来源调整单明细行 }
        invoiceId: { type: string }
        invoiceLineId: { type: [string, "null"], description: 可空：整票调整（invoiceLineId 为空） }
        accountsReceivableId: { type: string, description: 目标 AR（invoiceId 1:1 推导） }
        customerId: { type: string, description: 冗余（Apply 事务校验与 AR 一致） }
        currency: { type: string }
        adjustmentType: { $ref: "#/components/schemas/CreditDebitNoteType" }
        quantity: { type: number, description: 调整数量（累计防超调用） }
        adjustmentAmount: { type: number, description: "**有符号调整金额：CN<0 / DN>0（CTO 98/100，全系统唯一符号口径）**" }
        appliedAt: { type: [string, "null"], format: date-time, description: Apply 回写时间（null = 未生效） }
        appliedById: { type: [string, "null"] }
        reversedAt: { type: [string, "null"], format: date-time, description: reversal 预留（4E-3 首版不实现） }
        reversedById: { type: [string, "null"] }
        version: { type: integer }
        createdById: { type: [string, "null"] }
        updatedById: { type: [string, "null"] }
        deletedAt: { type: [string, "null"], format: date-time }
        isActive: { type: boolean }

    CreditDebitNoteCreateRequest:
      type: object
      required: [noteType, sourceInvoiceId, reason, lines]
      description: |
        创建调整单（DRAFT + lines）。单票制：sourceInvoiceId 必填唯一；只接受已 ISSUED 的 Invoice
        （409 CN_DN_SOURCE_INVOICE_INVALID）；Customer/Currency 从原 Invoice 继承（禁止客户端传）；
        行只传 sourceInvoiceLineId + quantity（>0）；金额/税率/价格只复制原 InvoiceLine 快照（不调 Pricing Engine）。
        **不创建 InvoiceAdjustment、不改 AR、不改 Invoice.balanceAmount**（事实由 Apply 事务生成）。
      properties:
        noteType: { $ref: "#/components/schemas/CreditDebitNoteType" }
        sourceInvoiceId: { type: string, minLength: 1 }
        reason: { type: string, minLength: 1, maxLength: 500 }
        lines:
          type: array
          minItems: 1
          items:
            type: object
            required: [sourceInvoiceLineId, quantity]
            properties:
              sourceInvoiceLineId: { type: string, minLength: 1 }
              quantity: { type: number, exclusiveMinimum: 0 }
        changeReason: { type: string, maxLength: 500 }

    CreditDebitNoteSubmitRequest:
      type: object
      description: 提交审批（DRAFT → SUBMITTED；命中 CREDIT_DEBIT_NOTE 策略 → Workflow 触发，须 APPROVED 后才能 Apply；无策略 → 可直接 Apply）
      properties:
        changeReason: { type: string, maxLength: 500 }

    CreditDebitNoteApplyRequest:
      type: object
      description: |
        Apply（唯一回写 AR.adjustedAmount/balanceAmount 的动作；重复 Apply → 409 CN_DN_ALREADY_APPLIED）。
        **累计防超调（锁内重算）**：
        - CREDIT：remainingAdjustableQty = originalInvoiceLine.quantity - cumulativeAppliedCreditQty，
          requestedQty ≤ remainingAdjustableQty（否则 409 CN_DN_QUANTITY_EXCEEDED）
        - DEBIT：cumulativeAppliedDebitAmount + current ≤ original line ceiling（ceiling = 原行金额；否则 409 CN_DN_AMOUNT_EXCEEDED）
        - 金额按同类型聚合（CREDIT 累计 ∥ DEBIT 累计），CN/DN 不互相污染 ceiling
      properties:
        changeReason: { type: string, maxLength: 500 }

