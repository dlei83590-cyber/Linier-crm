      operationId: listSalesOrders
      security:
        - bearerAuth: []
      parameters:
        - name: page
          in: query
          schema: { type: integer, default: 1 }
        - name: pageSize
          in: query
          schema: { type: integer, default: 20, maximum: 100 }
        - name: code
          in: query
          schema: { type: string, description: 销售订单号模糊查询（insensitive） }
        - name: quotationId
          in: query
          schema: { type: string }
        - name: customerId
          in: query
          schema: { type: string }
        - name: status
          in: query
          schema: { type: string, description: SalesOrderStatus 存储态 }
        - name: dateFrom
          in: query
          schema: { type: string, format: date, description: orderDate >= dateFrom }
        - name: dateTo
          in: query
          schema: { type: string, format: date, description: orderDate <= dateTo }
      responses:
        "200":
          description: Paginated list（软删除已过滤；每项含 customer/quotation 摘要与 lines 计数）
