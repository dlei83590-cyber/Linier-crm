          $ref: "#/components/responses/Forbidden"
        "404":
          $ref: "#/components/responses/NotFound"

  /api/receipts/{id}/allocate:
    post:
      tags: [Receipts]
      summary: Allocate receipt to accounts receivables (explicit atomic allocation; M:N)
      description: |
        显式核销（拍板①：创建与核销分离；一次请求**原子化**，任何一步失败整体回滚）。
        事务红线（CTO 指定顺序，Final Review 按此检查）：
        Lock Receipt（FOR UPDATE）→ Lock 全部目标 AR（按 id ASC，FOR UPDATE——防死锁锁序）→
        Validate 同 Customer / 同 Currency（否则 409 RECEIPT_CUSTOMER_MISMATCH / RECEIPT_CURRENCY_MISMATCH）→
        Validate Receipt unallocated 余额（Σ allocations ≤ unallocatedAmount，否则 409 RECEIPT_UNALLOCATED_EXCEEDED）→
        Validate 每笔 ≤ AR.balanceAmount（锁内读，否则 409 RECEIPT_ALLOCATION_EXCEEDED——防超核销）→
        Create ReceiptAllocation（同一 (receipt, AR) 只核销一次）→ 回写 AR paidAmount/balanceAmount（computeBalance 单入口）+ status 投影 →
        回写 Invoice paidAmount/balanceAmount 投影 → 回写 Receipt allocatedAmount/unallocatedAmount/status 投影 →
        AR Revision + Snapshot(snapshotSource=PAYMENT) → 事件（ReceiptAllocated / ReceiptFullyAllocated，事务外）。
        支持 M:N：一个 Receipt → 多 AR；一个 AR → 多 Receipt（部分核销）。
      operationId: allocateReceipt
      security:
        - bearerAuth: []
      parameters:
        - { name: id, in: path, required: true, schema: { type: string } }
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/ReceiptAllocateRequest"
      responses:
        "200":
          description: OK（核销结果：totalAllocated/newUnallocated/receiptStatus/arIds）
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ReceiptAllocateResponse"
        "400":
          $ref: "#/components/responses/BadRequest"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "403":
          $ref: "#/components/responses/Forbidden"
        "404":
          $ref: "#/components/responses/NotFound"
        "409":
          description: Conflict（客户/币种不一致 RECEIPT_CUSTOMER_MISMATCH / RECEIPT_CURRENCY_MISMATCH；超未分配余额 RECEIPT_UNALLOCATED_EXCEEDED；超应收余额 RECEIPT_ALLOCATION_EXCEEDED；已作废 RECEIPT_VOID_FORBIDDEN）
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"

