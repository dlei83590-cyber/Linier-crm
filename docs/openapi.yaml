        uninvoicedAmount: { type: number, nullable: true }
        receivableBalance: { type: number, nullable: true }
        projectRating: { type: string, nullable: true }
        failureReason: { type: string, nullable: true }
        ownerId: { type: string, nullable: true }
        description: { type: string, nullable: true }
        isActive: { type: boolean, default: true }
        approvalStatus: { type: string, enum: [DRAFT, PENDING, APPROVED, REJECTED] }
        version: { type: integer, default: 1 }
        createdAt: { type: string, format: date-time }
        updatedAt: { type: string, format: date-time }
    ProjectCreate:
      type: object
      required: [code, name, customerId]
      properties:
        code: { type: string }
        name: { type: string }
        customerId: { type: string }
        stage: { $ref: "#/components/schemas/ProjectStage" }
        priority: { type: string, enum: [HIGH, MEDIUM, LOW], nullable: true }
