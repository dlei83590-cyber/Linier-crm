        允许 DRAFT / CONFIRMED 取消；禁止 PARTIALLY_DELIVERED / DELIVERED / COMPLETED（需走后续变更流程）。
        成功：status=CANCELLED + SalesOrderSnapshot(CANCELLED) + 发布 SalesOrderCancelled。
      operationId: cancelSalesOrder
