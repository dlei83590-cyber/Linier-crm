components:
  securitySchemes:
    bearerAuth:
      type: http
      scheme: bearer
      bearerFormat: JWT

  responses:
    BadRequest:
      description: Validation error（Zod 校验失败）
      content:
        application/json:
          schema:
            $ref: "#/components/schemas/ErrorResponse"
    Unauthorized:
      description: Missing or invalid credentials
      content:
        application/json:
          schema:
            $ref: "#/components/schemas/ErrorResponse"
    Forbidden:
      description: Insufficient permission（RBAC 拒绝）
      content:
        application/json:
          schema:
            $ref: "#/components/schemas/ErrorResponse"
    NotFound:
      description: Resource not found（软删除后同样 404）
      content:
        application/json:
          schema:
            $ref: "#/components/schemas/ErrorResponse"
    Conflict:
      description: Conflict（code 重复 / version 过期 / 状态不允许）
      content:
        application/json:
          schema:
            $ref: "#/components/schemas/ErrorResponse"

  schemas:
    # --------------------------------------------------------------------------
    # Customer Foundation（Sprint 3C-1）
    # --------------------------------------------------------------------------
    CustomerLevel:
      type: string
      enum: [VIP, KEY, REGULAR, PROSPECT]

    CustomerCreditRating:
      type: string
      enum: [AAA, AA, A, BBB, BB, B, C]

    CustomerCreditStatus:
      type: string
      enum: [NORMAL, WATCH, FROZEN, CLOSED]

    CustomerAddressType:
      type: string
      enum: [REGISTERED, SHIPPING, INVOICING, CONTACT]

    Customer:
      type: object
      required: [id, code, name, level, version]
      properties:
        id: { type: string }
        code: { type: string, description: 客户编码 }
        name: { type: string }
        shortName: { type: [string, "null"] }
        partnerId: { type: [string, "null"], description: 关联统一往来单位 }
        level: { $ref: "#/components/schemas/CustomerLevel" }
        industryId: { type: [string, "null"] }
        region: { type: [string, "null"] }
        sourceChannel: { type: [string, "null"] }
        companySize: { type: [string, "null"] }
        foundedDate: { type: [string, "null"], format: date-time }
        website: { type: [string, "null"] }
        version: { type: integer, description: 乐观锁 }
        isActive: { type: boolean }
        deletedAt: { type: [string, "null"], format: date-time }
        createdAt: { type: string, format: date-time }
        updatedAt: { type: string, format: date-time }
        contacts:
          type: array
          items: { $ref: "#/components/schemas/CustomerContact" }
        addresses:
          type: array
          items: { $ref: "#/components/schemas/CustomerAddress" }
        tags:
          type: array
          items: { $ref: "#/components/schemas/CustomerTag" }
        credit:
          type: [object, "null"]
          allOf:
            - $ref: "#/components/schemas/CustomerCredit"

    CustomerCreate:
      type: object
      required: [code, name]
      properties:
        code: { type: string, minLength: 1, maxLength: 64 }
        name: { type: string, minLength: 1, maxLength: 200 }
        shortName: { type: string, maxLength: 100 }
        partnerId: { type: string }
        level: { $ref: "#/components/schemas/CustomerLevel" }
        industryId: { type: string }
        region: { type: string, maxLength: 50 }
        sourceChannel: { type: string, maxLength: 50 }
        companySize: { type: string, maxLength: 50 }
        foundedDate: { type: string, format: date-time }
        website: { type: string, maxLength: 200 }

    CustomerUpdate:
      type: object
      required: [version]
      properties:
        version: { type: integer }
        code: { type: string }
        name: { type: string }
        shortName: { type: [string, "null"] }
        partnerId: { type: [string, "null"] }
        level: { $ref: "#/components/schemas/CustomerLevel" }
        industryId: { type: [string, "null"] }
        region: { type: [string, "null"] }
        sourceChannel: { type: [string, "null"] }
        companySize: { type: [string, "null"] }
        foundedDate: { type: [string, "null"], format: date-time }
        website: { type: [string, "null"] }

    CustomerResponse:
      type: object
      required: [success, data]
      properties:
        success: { type: boolean, example: true }
        data: { $ref: "#/components/schemas/Customer" }

    CustomerListResponse:
      type: object
      required: [success, data, meta]
      properties:
        success: { type: boolean, example: true }
        data:
          type: array
          items: { $ref: "#/components/schemas/Customer" }
        meta: { $ref: "#/components/schemas/PaginationMeta" }

    CustomerContact:
      type: object
      required: [id, customerId, name, version]
      properties:
        id: { type: string }
        customerId: { type: string }
        name: { type: string }
        title: { type: [string, "null"] }
        department: { type: [string, "null"] }
        phone: { type: [string, "null"] }
        email: { type: [string, "null"], format: email }
        wechat: { type: [string, "null"] }
        isPrimary: { type: boolean, description: 主联系人（同客户唯一） }
        sort: { type: integer }
        version: { type: integer }
        deletedAt: { type: [string, "null"], format: date-time }
        createdAt: { type: string, format: date-time }
        updatedAt: { type: string, format: date-time }

    CustomerContactCreate:
      type: object
      required: [name]
      properties:
        name: { type: string, minLength: 1, maxLength: 100 }
        title: { type: string, maxLength: 100 }
        department: { type: string, maxLength: 100 }
        phone: { type: string, maxLength: 30 }
        email: { type: string, format: email }
        wechat: { type: string, maxLength: 100 }
        isPrimary: { type: boolean, default: false }
        sort: { type: integer, default: 0 }

    CustomerContactUpdate:
      type: object
      required: [version]
      properties:
        version: { type: integer }
        name: { type: string }
        title: { type: [string, "null"] }
        department: { type: [string, "null"] }
        phone: { type: [string, "null"] }
        email: { type: [string, "null"], format: email }
        wechat: { type: [string, "null"] }
        isPrimary: { type: boolean }
        sort: { type: integer }

    CustomerContactResponse:
      type: object
      required: [success, data]
      properties:
        success: { type: boolean, example: true }
        data: { $ref: "#/components/schemas/CustomerContact" }

    CustomerContactListResponse:
      type: object
      required: [success, data, meta]
      properties:
        success: { type: boolean, example: true }
        data:
          type: array
          items: { $ref: "#/components/schemas/CustomerContact" }
        meta: { $ref: "#/components/schemas/PaginationMeta" }

    CustomerAddress:
      type: object
      required: [id, customerId, addressType, version]
      properties:
        id: { type: string }
        customerId: { type: string }
        addressType: { $ref: "#/components/schemas/CustomerAddressType" }
        recipient: { type: [string, "null"] }
        phone: { type: [string, "null"] }
        province: { type: [string, "null"] }
        city: { type: [string, "null"] }
        district: { type: [string, "null"] }
        detail: { type: [string, "null"] }
        isDefault: { type: boolean, description: 默认地址（同客户同类型唯一） }
        sort: { type: integer }
        version: { type: integer }
        deletedAt: { type: [string, "null"], format: date-time }
        createdAt: { type: string, format: date-time }
        updatedAt: { type: string, format: date-time }

    CustomerAddressCreate:
      type: object
      properties:
        addressType: { $ref: "#/components/schemas/CustomerAddressType" }
        recipient: { type: string, maxLength: 100 }
        phone: { type: string, maxLength: 30 }
        province: { type: string, maxLength: 50 }
        city: { type: string, maxLength: 50 }
        district: { type: string, maxLength: 50 }
        detail: { type: string, maxLength: 300 }
        isDefault: { type: boolean, default: false }
        sort: { type: integer, default: 0 }

    CustomerAddressUpdate:
      type: object
      required: [version]
      properties:
        version: { type: integer }
        addressType: { $ref: "#/components/schemas/CustomerAddressType" }
        recipient: { type: [string, "null"] }
        phone: { type: [string, "null"] }
        province: { type: [string, "null"] }
        city: { type: [string, "null"] }
        district: { type: [string, "null"] }
        detail: { type: [string, "null"] }
        isDefault: { type: boolean }
        sort: { type: integer }

    CustomerAddressResponse:
      type: object
      required: [success, data]
      properties:
        success: { type: boolean, example: true }
        data: { $ref: "#/components/schemas/CustomerAddress" }

    CustomerAddressListResponse:
      type: object
      required: [success, data, meta]
      properties:
        success: { type: boolean, example: true }
        data:
          type: array
          items: { $ref: "#/components/schemas/CustomerAddress" }
        meta: { $ref: "#/components/schemas/PaginationMeta" }

    Tag:
      type: object
      required: [id, code, name, version]
      properties:
        id: { type: string }
        code: { type: string }
        name: { type: string }
        color: { type: [string, "null"] }
        sort: { type: integer }
        enabled: { type: boolean }
        version: { type: integer }
        deletedAt: { type: [string, "null"], format: date-time }
        createdAt: { type: string, format: date-time }
        updatedAt: { type: string, format: date-time }

    TagCreate:
      type: object
      required: [code, name]
      properties:
        code:
          type: string
          pattern: "^[A-Z0-9_]+$"
          minLength: 2
          maxLength: 64
        name: { type: string, minLength: 1, maxLength: 100 }
        color: { type: string, maxLength: 20 }
        sort: { type: integer, default: 0 }
        enabled: { type: boolean, default: true }

    TagUpdate:
      type: object
      required: [version]
      properties:
        version: { type: integer }
        code: { type: string }
        name: { type: string }
        color: { type: [string, "null"] }
        sort: { type: integer }
        enabled: { type: boolean }

    TagResponse:
      type: object
      required: [success, data]
      properties:
        success: { type: boolean, example: true }
        data: { $ref: "#/components/schemas/Tag" }

    TagListResponse:
      type: object
      required: [success, data, meta]
      properties:
        success: { type: boolean, example: true }
        data:
          type: array
          items: { $ref: "#/components/schemas/Tag" }
        meta: { $ref: "#/components/schemas/PaginationMeta" }

    CustomerTag:
      type: object
      required: [id, customerId, tagId]
      properties:
        id: { type: string }
        customerId: { type: string }
        tagId: { type: string }
        createdAt: { type: string, format: date-time }
        tag:
          type: [object, "null"]
          properties:
            id: { type: string }
            code: { type: string }
            name: { type: string }
            color: { type: [string, "null"] }

    CustomerTagCreate:
      type: object
      properties:
        tagId: { type: string, description: tagId 或 tagCode 二选一 }
        tagCode: { type: string }

    CustomerTagResponse:
      type: object
      required: [success, data]
      properties:
        success: { type: boolean, example: true }
        data: { $ref: "#/components/schemas/CustomerTag" }

    CustomerTagListResponse:
      type: object
      required: [success, data]
      properties:
        success: { type: boolean, example: true }
        data:
          type: array
          items: { $ref: "#/components/schemas/CustomerTag" }

    Industry:
      type: object
      required: [id, code, name, version]
      properties:
        id: { type: string }
        code: { type: string }
        name: { type: string }
        sort: { type: integer }
        enabled: { type: boolean }
        version: { type: integer }
        deletedAt: { type: [string, "null"], format: date-time }
        createdAt: { type: string, format: date-time }
        updatedAt: { type: string, format: date-time }

    IndustryCreate:
      type: object
      required: [code, name]
      properties:
        code:
          type: string
          pattern: "^[A-Z0-9_]+$"
          minLength: 2
          maxLength: 64
        name: { type: string, minLength: 1, maxLength: 100 }
        sort: { type: integer, default: 0 }
        enabled: { type: boolean, default: true }

    IndustryUpdate:
      type: object
      required: [version]
      properties:
        version: { type: integer }
        code: { type: string }
        name: { type: string }
        sort: { type: integer }
        enabled: { type: boolean }

    IndustryResponse:
      type: object
      required: [success, data]
      properties:
        success: { type: boolean, example: true }
        data: { $ref: "#/components/schemas/Industry" }

    IndustryListResponse:
      type: object
      required: [success, data, meta]
      properties:
        success: { type: boolean, example: true }
        data:
          type: array
          items: { $ref: "#/components/schemas/Industry" }
        meta: { $ref: "#/components/schemas/PaginationMeta" }

    CustomerCredit:
      type: object
      required: [id, customerId, rating, status, version]
      properties:
        id: { type: string }
        customerId: { type: string }
        creditLimit: { type: [number, "null"], description: 信用额度 }
        usedCredit: { type: number, description: 已用额度 }
        rating: { $ref: "#/components/schemas/CustomerCreditRating" }
        status: { $ref: "#/components/schemas/CustomerCreditStatus" }
        reviewDate: { type: [string, "null"], format: date-time }
        version: { type: integer }
        deletedAt: { type: [string, "null"], format: date-time }
        createdAt: { type: string, format: date-time }
        updatedAt: { type: string, format: date-time }

    CustomerCreditUpsert:
      type: object
      properties:
        creditLimit: { type: number, description: 信用额度（创建时可选） }
        usedCredit: { type: number }
        rating: { $ref: "#/components/schemas/CustomerCreditRating" }
        status: { $ref: "#/components/schemas/CustomerCreditStatus" }
        reviewDate: { type: string, format: date-time }
        version: { type: integer, description: 已存在时乐观锁（可选） }

    CustomerCreditResponse:
      type: object
      required: [success, data]
      properties:
        success: { type: boolean, example: true }
        data: { type: [object, "null"], allOf: [{ $ref: "#/components/schemas/CustomerCredit" }] }

    # --------------------------------------------------------------------------
    # File Center（Sprint 3B）
    # --------------------------------------------------------------------------
    FileFolder:
      type: object
      required: [id, code, name, version]
      properties:
        id: { type: string }
        code: { type: string }
        name: { type: string }
        parentId: { type: [string, "null"] }
        sort: { type: integer }
        version: { type: integer, description: 乐观锁 }
        isActive: { type: boolean }
        deletedAt: { type: [string, "null"], format: date-time }
        createdAt: { type: string, format: date-time }
        updatedAt: { type: string, format: date-time }
        children:
          type: array
          items: { $ref: "#/components/schemas/FileFolder" }
          description: tree=true 时返回

    File:
      type: object
      required: [id, code, name, version]
      properties:
        id: { type: string }
        code: { type: string }
        name: { type: string }
        originalName: { type: [string, "null"] }
        extension: { type: [string, "null"] }
        mimeType: { type: [string, "null"] }
        size: { type: integer, description: 字节 }
        storagePath: { type: [string, "null"], description: 对象存储/本地路径 }
        checksum: { type: [string, "null"] }
        folderId: { type: [string, "null"] }
        ownerId: { type: [string, "null"] }
        currentVersion: { type: integer }
        version: { type: integer, description: 乐观锁 }
        isActive: { type: boolean }
        deletedAt: { type: [string, "null"], format: date-time }
        createdAt: { type: string, format: date-time }
        updatedAt: { type: string, format: date-time }
        versions:
          type: array
          items: { $ref: "#/components/schemas/FileVersion" }
        attachments:
          type: array
          items: { $ref: "#/components/schemas/FileAttachment" }

    FileVersion:
      type: object
      required: [id, fileId, versionNo]
      properties:
        id: { type: string }
        fileId: { type: string }
        versionNo: { type: integer }
        originalName: { type: [string, "null"] }
        extension: { type: [string, "null"] }
        mimeType: { type: [string, "null"] }
        size: { type: integer }
        storagePath: { type: [string, "null"] }
        checksum: { type: [string, "null"] }
        createdAt: { type: string, format: date-time }

    FileAttachment:
      type: object
      required: [id, fileId, businessType, businessId]
      properties:
        id: { type: string }
        fileId: { type: string }
        businessType: { type: string, description: quotation/contract/sales-order/invoice/project }
        businessId: { type: string }
        sort: { type: integer }
        createdAt: { type: string, format: date-time }
        file:
          type: [object, "null"]
          properties:
            id: { type: string }
            name: { type: string }
            mimeType: { type: [string, "null"] }
            size: { type: integer }
            currentVersion: { type: integer }

    FileCreate:
      type: object
      required: [code, name]
      properties:
        code: { type: string, minLength: 1, maxLength: 64 }
        name: { type: string, minLength: 1, maxLength: 200 }
        originalName: { type: string, maxLength: 255 }
        extension: { type: string, maxLength: 20 }
        mimeType: { type: string, maxLength: 100 }
        size: { type: integer, default: 0 }
        storagePath: { type: string, maxLength: 500 }
        checksum: { type: string, maxLength: 128 }
        folderId: { type: string }
        ownerId: { type: string }

    FileUpdate:
      type: object
      required: [version]
      properties:
        version: { type: integer }
        name: { type: string }
        originalName: { type: [string, "null"] }
        extension: { type: [string, "null"] }
        mimeType: { type: [string, "null"] }
        size: { type: integer }
        storagePath: { type: [string, "null"] }
        checksum: { type: [string, "null"] }
        folderId: { type: [string, "null"] }
        ownerId: { type: [string, "null"] }

    FileVersionCreate:
      type: object
      properties:
        originalName: { type: string, maxLength: 255 }
        extension: { type: string, maxLength: 20 }
        mimeType: { type: string, maxLength: 100 }
        size: { type: integer, default: 0 }
        storagePath: { type: string, maxLength: 500 }
        checksum: { type: string, maxLength: 128 }

    FileFolderCreate:
      type: object
      required: [code, name]
      properties:
        code:
          type: string
          pattern: "^[A-Z0-9_]+$"
          minLength: 2
          maxLength: 64
        name: { type: string, minLength: 1, maxLength: 100 }
        parentId: { type: string }
        sort: { type: integer, default: 0 }

    FileFolderUpdate:
      type: object
      required: [version]
      properties:
        version: { type: integer }
        code: { type: string }
        name: { type: string }
        parentId: { type: [string, "null"] }
        sort: { type: integer }

    FileAttachmentCreate:
      type: object
      required: [fileId, businessType, businessId]
      properties:
        fileId: { type: string }
        businessType: { type: string, minLength: 1, maxLength: 50 }
        businessId: { type: string, minLength: 1, maxLength: 100 }
        sort: { type: integer, default: 0 }

    FileResponse:
      type: object
      required: [success, data]
      properties:
        success: { type: boolean, example: true }
        data: { $ref: "#/components/schemas/File" }

    FileListResponse:
      type: object
      required: [success, data, meta]
      properties:
        success: { type: boolean, example: true }
        data:
          type: array
          items: { $ref: "#/components/schemas/File" }
        meta: { $ref: "#/components/schemas/PaginationMeta" }

    FileVersionResponse:
      type: object
      required: [success, data]
      properties:
        success: { type: boolean, example: true }
        data: { $ref: "#/components/schemas/FileVersion" }

    FileVersionListResponse:
      type: object
      required: [success, data, meta]
      properties:
        success: { type: boolean, example: true }
        data:
          type: array
          items: { $ref: "#/components/schemas/FileVersion" }
        meta: { $ref: "#/components/schemas/PaginationMeta" }

    FilePreviewResponse:
      type: object
      required: [success, data]
      properties:
        success: { type: boolean, example: true }
        data:
          type: object
          required: [id, name, previewable]
          properties:
            id: { type: string }
            name: { type: string }
            originalName: { type: [string, "null"] }
            extension: { type: [string, "null"] }
            mimeType: { type: [string, "null"] }
            size: { type: integer }
            storagePath: { type: [string, "null"] }
            currentVersion: { type: integer }
            previewable: { type: boolean, description: mimeType 白名单判定 }
            previewUrl: { type: [string, "null"] }

    FileFolderResponse:
      type: object
      required: [success, data]
      properties:
        success: { type: boolean, example: true }
        data: { $ref: "#/components/schemas/FileFolder" }

    FileFolderListResponse:
      type: object
      required: [success, data, meta]
      properties:
        success: { type: boolean, example: true }
        data:
          type: array
          items: { $ref: "#/components/schemas/FileFolder" }
        meta: { $ref: "#/components/schemas/PaginationMeta" }

    FileAttachmentResponse:
      type: object
      required: [success, data]
      properties:
        success: { type: boolean, example: true }
        data: { $ref: "#/components/schemas/FileAttachment" }

    FileAttachmentListResponse:
      type: object
      required: [success, data, meta]
      properties:
        success: { type: boolean, example: true }
        data:
          type: array
          items: { $ref: "#/components/schemas/FileAttachment" }
        meta: { $ref: "#/components/schemas/PaginationMeta" }

