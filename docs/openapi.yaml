        "401":
          $ref: "#/components/responses/Unauthorized"
        "403":
          $ref: "#/components/responses/Forbidden"

  /api/deliveries/{id}/invoice:
    post:
      tags: [Invoices]
      summary: Create invoice from delivery (only entry; Direct Invoice prohibited)
      description: |
        唯一创建入口（CTO Review 96/100 锁定项①：Invoice 唯一来源 Delivery）。
        事务内：按 id ASC 锁全部来源 Delivery（primaryDeliveryId + deliveryIds[] 去重）→
        校验全部 DELIVERED（仅已确认收货可开票）→ 校验 Customer/Currency/TaxProfile/PaymentTerm 一致
        （Consolidated Invoice，否则 409 INVOICE_SOURCE_NOT_COMPATIBLE）→ 按 id ASC 锁 DeliveryLine →
        防超开票（qty > 0 且 <= remainingInvoiceQty，否则 409 INVOICE_QUANTITY_EXCEEDED）→
        四段溯源链取价（DeliveryLine→sourceSalesOrderLineId→SalesOrderLine→priceSnapshotId→QuotationPriceSnapshot，
        金额永不重算、不调用 Pricing Engine）→ 建头（DRAFT，code=NULL 不占号）+ 行（金额快照复制）→
        回写 DeliveryLine 开票投影（invoicedQty += qty；remainingInvoiceQty -= qty）→ Revision + CREATED 快照
        （含税务/汇率快照 taxProfileId/taxRate/sstNo/currencyRate/exchangeRate）→ AuditLog + InvoiceCreated。
      operationId: createInvoice
      security:
        - bearerAuth: []
      parameters:
        - { name: id, in: path, required: true, schema: { type: string }, description: primaryDeliveryId }
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/InvoiceCreate"
      responses:
        "201":
          description: Created（status=DRAFT，code=null）
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/InvoiceResponse"
        "400":
          $ref: "#/components/responses/BadRequest"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "403":
          $ref: "#/components/responses/Forbidden"
        "404":
          $ref: "#/components/responses/NotFound"
        "409":
          description: Conflict（来源 Delivery 非 DELIVERED / Consolidated 财务属性不一致 / 超开票）
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"

  /api/invoices/{id}:
    get:
      tags: [Invoices]
      summary: Get invoice detail (customer/delivery/salesOrder summary + workflow + lines + latest revision/snapshot)
      description: |
        CTO Phase 4 指令：一次带出 Invoice、Customer、Workflow、Delivery Summary、SalesOrder Summary、
        Lines（含 item + priceSnapshot）、Latest Revision、Latest Snapshot，避免前端 5~6 个额外请求。
      operationId: getInvoice
      security:
        - bearerAuth: []
      parameters:
        - { name: id, in: path, required: true, schema: { type: string } }
      responses:
        "200":
          description: OK
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/InvoiceResponse"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "403":
          $ref: "#/components/responses/Forbidden"
        "404":
          $ref: "#/components/responses/NotFound"
    patch:
      tags: [Invoices]
      summary: Update invoice header (only DRAFT; optimistic lock version)
      description: |
        仅 DRAFT 可编辑；只允许非财务字段 remark / dueDate / paymentTerm（schema 无 reference 列，不新增）。
        禁止修改 quantity/unitPrice/taxRate/lineAmount/totalAmount/paidAmount/balanceAmount/code/status——
        这些必须继续由系统动作或 4E 维护。变更自动生成 InvoiceRevision + 发布 InvoiceUpdated。
        重审规则（CTO Phase 4 指令）：paymentTerm / dueDate 变更 → 失效原审批并重新提交
        （maybeTriggerInvoiceApproval）；remark 修改不触发重审；命中 INVOICE 策略但定义缺失 →
        409 INVOICE_WORKFLOW_FAILED（整体回滚）。
      operationId: updateInvoice
      security:
        - bearerAuth: []
      parameters:
        - { name: id, in: path, required: true, schema: { type: string } }
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/InvoiceUpdate"
      responses:
        "200":
          description: OK（version+1）
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/InvoiceResponse"
        "400":
          $ref: "#/components/responses/BadRequest"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "403":
          $ref: "#/components/responses/Forbidden"
        "404":
          $ref: "#/components/responses/NotFound"
        "409":
          description: Conflict（非 DRAFT / version 过期 / 重审策略缺失 INVOICE_WORKFLOW_FAILED）
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"

