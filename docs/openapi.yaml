openapi: 3.0.3
info:
  title: Linier CRM Management System API
  description: Enterprise customer relationship management platform - Sprint 3A Workflow Foundation surface.
  version: 0.3.0-alpha
  contact:
    name: JINZA TRADING SDN. BHD.
servers:
  - url: http://localhost:3000
    description: Local development

tags:
  - name: Health
  - name: Auth
  - name: Workflow Definitions
  - name: Workflow Instances
  - name: Approver Groups
  - name: Dictionaries
  - name: Settings
  - name: Notification Templates

paths:
  # ==========================================================================
  # Health / Auth
  # ==========================================================================
  /api/health:
    get:
      tags: [Health]
      summary: Liveness probe
      operationId: healthCheck
      responses:
        "200":
          description: Service is healthy
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/HealthResponse"

  /api/auth/login:
    post:
      tags: [Auth]
      summary: Sign in with email and password
      operationId: login
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/LoginRequest"
      responses:
        "200":
          description: Returns a session token
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/LoginResponse"
        "400":
          $ref: "#/components/responses/BadRequest"
        "401":
          $ref: "#/components/responses/Unauthorized"

  /api/auth/me:
    get:
      tags: [Auth]
      summary: Get the current authenticated user
      operationId: me
      security:
        - bearerAuth: []
      responses:
        "200":
          description: Current user profile and roles
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/MeResponse"
        "401":
          $ref: "#/components/responses/Unauthorized"

  # ==========================================================================
  # Workflow Definitions（第一批）
  # 权限码：workflow-definition:view/create/edit/delete/approve/close
  # 状态机：DRAFT → ACTIVE(已发布) → ARCHIVED(已归档)
  # 规则：更新必须携带 version（乐观锁）；删除为软删除；ACTIVE/ARCHIVED 后禁止修改 code/module/steps
  # ==========================================================================
  /api/workflows/definitions:
    get:
      tags: [Workflow Definitions]
      summary: List workflow definitions (paginated, searchable)
      operationId: listWorkflowDefinitions
      security:
        - bearerAuth: []
      parameters:
        - name: page
          in: query
          schema: { type: integer, default: 1 }
        - name: pageSize
          in: query
          schema: { type: integer, default: 20, maximum: 100 }
        - name: code
          in: query
          schema: { type: string }
          description: Fuzzy match on code
        - name: name
          in: query
          schema: { type: string }
          description: Fuzzy match on name
        - name: module
          in: query
          schema: { type: string }
        - name: status
          in: query
          schema: { $ref: "#/components/schemas/WorkflowStatus" }
      responses:
        "200":
          description: Paginated list（软删除已过滤）
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/WorkflowDefinitionListResponse"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "403":
          $ref: "#/components/responses/Forbidden"
    post:
      tags: [Workflow Definitions]
      summary: Create workflow definition (with steps & conditions, transactional)
      operationId: createWorkflowDefinition
      security:
        - bearerAuth: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/WorkflowDefinitionCreate"
      responses:
        "201":
          description: Created（初始 status=DRAFT, version=1）
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/WorkflowDefinitionResponse"
        "400":
          $ref: "#/components/responses/BadRequest"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "403":
          $ref: "#/components/responses/Forbidden"
        "409":
          $ref: "#/components/responses/Conflict"

  /api/workflows/definitions/{id}:
    get:
      tags: [Workflow Definitions]
      summary: Get workflow definition detail (with steps & conditions)
      operationId: getWorkflowDefinition
      security:
        - bearerAuth: []
      parameters:
        - name: id
          in: path
          required: true
          schema: { type: string }
      responses:
        "200":
          description: Detail
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/WorkflowDefinitionResponse"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "403":
          $ref: "#/components/responses/Forbidden"
        "404":
          $ref: "#/components/responses/NotFound"
    patch:
      tags: [Workflow Definitions]
      summary: Update workflow definition（乐观锁 version；发布后禁止修改关键结构）
      operationId: updateWorkflowDefinition
      security:
        - bearerAuth: []
      parameters:
        - name: id
          in: path
          required: true
          schema: { type: string }
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/WorkflowDefinitionUpdate"
      responses:
        "200":
          description: Updated（version 自动 +1）
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/WorkflowDefinitionResponse"
        "400":
          $ref: "#/components/responses/BadRequest"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "403":
          $ref: "#/components/responses/Forbidden"
        "404":
          $ref: "#/components/responses/NotFound"
        "409":
          $ref: "#/components/responses/Conflict"
    delete:
      tags: [Workflow Definitions]
      summary: Soft delete workflow definition
      operationId: deleteWorkflowDefinition
      security:
        - bearerAuth: []
      parameters:
        - name: id
          in: path
          required: true
          schema: { type: string }
      responses:
        "200":
          description: Soft deleted（deletedAt 写入，不物理删除）
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/DeleteResponse"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "403":
          $ref: "#/components/responses/Forbidden"
        "404":
          $ref: "#/components/responses/NotFound"

  /api/workflows/definitions/{id}/publish:
    post:
      tags: [Workflow Definitions]
      summary: Publish workflow definition（DRAFT → ACTIVE）
      operationId: publishWorkflowDefinition
      security:
        - bearerAuth: []
      parameters:
        - name: id
          in: path
          required: true
          schema: { type: string }
      responses:
        "200":
          description: Published（要求至少一个步骤；version +1）
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/WorkflowStatusChangeResponse"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "403":
          $ref: "#/components/responses/Forbidden"
        "404":
          $ref: "#/components/responses/NotFound"
        "409":
          $ref: "#/components/responses/Conflict"

  /api/workflows/definitions/{id}/archive:
    post:
      tags: [Workflow Definitions]
      summary: Archive workflow definition（ACTIVE → ARCHIVED）
      operationId: archiveWorkflowDefinition
      security:
        - bearerAuth: []
      parameters:
        - name: id
          in: path
          required: true
          schema: { type: string }
      responses:
        "200":
          description: Archived（历史实例不受影响；version +1）
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/WorkflowStatusChangeResponse"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "403":
          $ref: "#/components/responses/Forbidden"
        "404":
          $ref: "#/components/responses/NotFound"
        "409":
          $ref: "#/components/responses/Conflict"

  # ==========================================================================
  # Workflow Instances（第二批）
  # 权限码：workflow-instance:view/create/approve
  # 统一动作：SUBMIT/APPROVE/REJECT/RETURN/TRANSFER/DELEGATE/WITHDRAW/TERMINATE/COMMENT
  # ==========================================================================
  /api/workflows/instances:
    get:
      tags: [Workflow Instances]
      summary: List workflow instances (paginated, filterable)
      operationId: listWorkflowInstances
      security:
        - bearerAuth: []
      parameters:
        - name: page
          in: query
          schema: { type: integer, default: 1 }
        - name: pageSize
          in: query
          schema: { type: integer, default: 20, maximum: 100 }
        - name: businessType
          in: query
          schema: { type: string }
        - name: businessId
          in: query
          schema: { type: string }
        - name: status
          in: query
          schema: { $ref: "#/components/schemas/WorkflowInstanceStatus" }
        - name: definitionId
          in: query
          schema: { type: string }
        - name: startedBy
          in: query
          schema: { type: string }
      responses:
        "200":
          description: Paginated list（软删除已过滤）
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/WorkflowInstanceListResponse"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "403":
          $ref: "#/components/responses/Forbidden"
    post:
      tags: [Workflow Instances]
      summary: Create workflow instance from an ACTIVE definition
      operationId: createWorkflowInstance
      security:
        - bearerAuth: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/WorkflowInstanceCreate"
      responses:
        "201":
          description: Created（status=RUNNING，自动生成 SUBMIT 动作与历史，并创建第一步审批人）
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/WorkflowInstanceResponse"
        "400":
          $ref: "#/components/responses/BadRequest"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "403":
          $ref: "#/components/responses/Forbidden"
        "404":
          $ref: "#/components/responses/NotFound"
        "409":
          $ref: "#/components/responses/Conflict"

  /api/workflows/instances/{id}:
    get:
      tags: [Workflow Instances]
      summary: Get workflow instance detail (definition/approvers/actions/history)
      operationId: getWorkflowInstance
      security:
        - bearerAuth: []
      parameters:
        - name: id
          in: path
          required: true
          schema: { type: string }
      responses:
        "200":
          description: Detail
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/WorkflowInstanceResponse"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "403":
          $ref: "#/components/responses/Forbidden"
        "404":
          $ref: "#/components/responses/NotFound"

  /api/workflows/instances/{id}/actions:
    post:
      tags: [Workflow Instances]
      summary: Execute a unified workflow action（状态机事务）
      operationId: executeWorkflowAction
      security:
        - bearerAuth: []
      parameters:
        - name: id
          in: path
          required: true
          schema: { type: string }
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/WorkflowActionRequest"
      description: |
        统一动作范围（WorkflowActionType）：
        SUBMIT / APPROVE / REJECT / RETURN / TRANSFER / DELEGATE / WITHDRAW / TERMINATE / COMMENT
        - APPROVE/REJECT/TRANSFER/DELEGATE 仅当前步骤待办人可执行
        - WITHDRAW 仅发起人可执行
        - TRANSFER/DELEGATE 必须携带 targetUserId
        - 终态实例（COMPLETED/REJECTED/TERMINATED/WITHDRAWN）仅允许 COMMENT
        - 每次动作写入 WorkflowAction + WorkflowHistory（含 IP/设备/浏览器/耗时）
      responses:
        "200":
          description: Action executed
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/WorkflowActionResult"
        "400":
          $ref: "#/components/responses/BadRequest"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "403":
          $ref: "#/components/responses/Forbidden"
        "404":
          $ref: "#/components/responses/NotFound"
        "409":
          $ref: "#/components/responses/Conflict"

  /api/workflows/instances/{id}/history:
    get:
      tags: [Workflow Instances]
      summary: List instance history (paginated)
      operationId: listWorkflowInstanceHistory
      security:
        - bearerAuth: []
      parameters:
        - name: id
          in: path
          required: true
          schema: { type: string }
        - name: page
          in: query
          schema: { type: integer, default: 1 }
        - name: pageSize
          in: query
          schema: { type: integer, default: 20, maximum: 100 }
      responses:
        "200":
          description: Paginated history
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/WorkflowHistoryListResponse"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "403":
          $ref: "#/components/responses/Forbidden"
        "404":
          $ref: "#/components/responses/NotFound"

  # ==========================================================================
  # Approver Groups（第三批）
  # 权限码：approver-group:view/create/edit/delete
  # code 唯一；成员 memberUserIds 全量替换；删除为软删除；更新需 version
  # ==========================================================================
  /api/approver-groups:
    get:
      tags: [Approver Groups]
      summary: List approver groups (paginated)
      operationId: listApproverGroups
      security:
        - bearerAuth: []
      parameters:
        - name: page
          in: query
          schema: { type: integer, default: 1 }
        - name: pageSize
          in: query
          schema: { type: integer, default: 20, maximum: 100 }
        - name: code
          in: query
          schema: { type: string }
        - name: name
          in: query
          schema: { type: string }
      responses:
        "200":
          description: Paginated list（软删除已过滤）
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ApproverGroupListResponse"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "403":
          $ref: "#/components/responses/Forbidden"
    post:
      tags: [Approver Groups]
      summary: Create approver group (with members, transactional)
      operationId: createApproverGroup
      security:
        - bearerAuth: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/ApproverGroupCreate"
      responses:
        "201":
          description: Created
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ApproverGroupResponse"
        "400":
          $ref: "#/components/responses/BadRequest"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "403":
          $ref: "#/components/responses/Forbidden"
        "409":
          $ref: "#/components/responses/Conflict"

  /api/approver-groups/{id}:
    get:
      tags: [Approver Groups]
      summary: Get approver group detail (with members)
      operationId: getApproverGroup
      security:
        - bearerAuth: []
      parameters:
        - name: id
          in: path
          required: true
          schema: { type: string }
      responses:
        "200":
          description: Detail
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ApproverGroupResponse"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "403":
          $ref: "#/components/responses/Forbidden"
        "404":
          $ref: "#/components/responses/NotFound"
    patch:
      tags: [Approver Groups]
      summary: Update approver group（乐观锁 version；成员全量替换）
      operationId: updateApproverGroup
      security:
        - bearerAuth: []
      parameters:
        - name: id
          in: path
          required: true
          schema: { type: string }
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/ApproverGroupUpdate"
      responses:
        "200":
          description: Updated
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ApproverGroupResponse"
        "400":
          $ref: "#/components/responses/BadRequest"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "403":
          $ref: "#/components/responses/Forbidden"
        "404":
          $ref: "#/components/responses/NotFound"
        "409":
          $ref: "#/components/responses/Conflict"
    delete:
      tags: [Approver Groups]
      summary: Soft delete approver group
      operationId: deleteApproverGroup
      security:
        - bearerAuth: []
      parameters:
        - name: id
          in: path
          required: true
          schema: { type: string }
      responses:
        "200":
          description: Soft deleted
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/DeleteResponse"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "403":
          $ref: "#/components/responses/Forbidden"
        "404":
          $ref: "#/components/responses/NotFound"

  # ==========================================================================
  # Dictionaries（第三批）
  # 权限码：dictionary-type:view/create/edit/delete；dictionary-item:view/create/edit/delete
  # type.code / (typeId,item.code) 唯一；enabled 启用/停用；删除为软删除；更新需 version
  # ==========================================================================
  /api/dictionaries:
    get:
      tags: [Dictionaries]
      summary: List dictionary types (paginated, searchable)
      operationId: listDictionaryTypes
      security:
        - bearerAuth: []
      parameters:
        - name: page
          in: query
          schema: { type: integer, default: 1 }
        - name: pageSize
          in: query
          schema: { type: integer, default: 20, maximum: 100 }
        - name: code
          in: query
          schema: { type: string }
        - name: name
          in: query
          schema: { type: string }
        - name: category
          in: query
          schema: { type: string }
        - name: enabled
          in: query
          schema: { type: boolean }
      responses:
        "200":
          description: Paginated list
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/DictionaryTypeListResponse"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "403":
          $ref: "#/components/responses/Forbidden"
    post:
      tags: [Dictionaries]
      summary: Create dictionary type
      operationId: createDictionaryType
      security:
        - bearerAuth: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/DictionaryTypeCreate"
      responses:
        "201":
          description: Created
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/DictionaryTypeResponse"
        "400":
          $ref: "#/components/responses/BadRequest"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "403":
          $ref: "#/components/responses/Forbidden"
        "409":
          $ref: "#/components/responses/Conflict"

  /api/dictionaries/{id}:
    get:
      tags: [Dictionaries]
      summary: Get dictionary type detail (with items)
      operationId: getDictionaryType
      security:
        - bearerAuth: []
      parameters:
        - name: id
          in: path
          required: true
          schema: { type: string }
      responses:
        "200":
          description: Detail with items
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/DictionaryTypeResponse"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "403":
          $ref: "#/components/responses/Forbidden"
        "404":
          $ref: "#/components/responses/NotFound"
    patch:
      tags: [Dictionaries]
      summary: Update dictionary type（乐观锁 version）
      operationId: updateDictionaryType
      security:
        - bearerAuth: []
      parameters:
        - name: id
          in: path
          required: true
          schema: { type: string }
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/DictionaryTypeUpdate"
      responses:
        "200":
          description: Updated
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/DictionaryTypeResponse"
        "400":
          $ref: "#/components/responses/BadRequest"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "403":
          $ref: "#/components/responses/Forbidden"
        "404":
          $ref: "#/components/responses/NotFound"
        "409":
          $ref: "#/components/responses/Conflict"
    delete:
      tags: [Dictionaries]
      summary: Soft delete dictionary type
      operationId: deleteDictionaryType
      security:
        - bearerAuth: []
      parameters:
        - name: id
          in: path
          required: true
          schema: { type: string }
      responses:
        "200":
          description: Soft deleted
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/DeleteResponse"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "403":
          $ref: "#/components/responses/Forbidden"
        "404":
          $ref: "#/components/responses/NotFound"

  /api/dictionaries/{id}/items:
    get:
      tags: [Dictionaries]
      summary: List dictionary items (paginated)
      operationId: listDictionaryItems
      security:
        - bearerAuth: []
      parameters:
        - name: id
          in: path
          required: true
          schema: { type: string }
        - name: page
          in: query
          schema: { type: integer, default: 1 }
        - name: pageSize
          in: query
          schema: { type: integer, default: 20, maximum: 100 }
        - name: code
          in: query
          schema: { type: string }
        - name: label
          in: query
          schema: { type: string }
        - name: enabled
          in: query
          schema: { type: boolean }
      responses:
        "200":
          description: Paginated items
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/DictionaryItemListResponse"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "403":
          $ref: "#/components/responses/Forbidden"
        "404":
          $ref: "#/components/responses/NotFound"
    post:
      tags: [Dictionaries]
      summary: Create dictionary item（typeId+code 唯一）
      operationId: createDictionaryItem
      security:
        - bearerAuth: []
      parameters:
        - name: id
          in: path
          required: true
          schema: { type: string }
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/DictionaryItemCreate"
      responses:
        "201":
          description: Created
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/DictionaryItemResponse"
        "400":
          $ref: "#/components/responses/BadRequest"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "403":
          $ref: "#/components/responses/Forbidden"
        "404":
          $ref: "#/components/responses/NotFound"
        "409":
          $ref: "#/components/responses/Conflict"

  /api/dictionaries/{id}/items/{itemId}:
    patch:
      tags: [Dictionaries]
      summary: Update dictionary item（乐观锁 version）
      operationId: updateDictionaryItem
      security:
        - bearerAuth: []
      parameters:
        - name: id
          in: path
          required: true
          schema: { type: string }
        - name: itemId
          in: path
          required: true
          schema: { type: string }
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/DictionaryItemUpdate"
      responses:
        "200":
          description: Updated
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/DictionaryItemResponse"
        "400":
          $ref: "#/components/responses/BadRequest"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "403":
          $ref: "#/components/responses/Forbidden"
        "404":
          $ref: "#/components/responses/NotFound"
        "409":
          $ref: "#/components/responses/Conflict"
    delete:
      tags: [Dictionaries]
      summary: Soft delete dictionary item
      operationId: deleteDictionaryItem
      security:
        - bearerAuth: []
      parameters:
        - name: id
          in: path
          required: true
          schema: { type: string }
        - name: itemId
          in: path
          required: true
          schema: { type: string }
      responses:
        "200":
          description: Soft deleted
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/DeleteResponse"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "403":
          $ref: "#/components/responses/Forbidden"
        "404":
          $ref: "#/components/responses/NotFound"

  # ==========================================================================
  # Settings（第三批，三层 Key-Value）
  # 权限码：system-setting / tenant-setting / user-setting 的 view/create/edit/delete
  # key 唯一（SYSTEM 全局唯一；TENANT 按 tenantId+key；USER 按 userId+key）
  # encrypted=true 时 value 返回掩码 ******，不返回明文；删除为软删除；更新需 version
  # ==========================================================================
  /api/settings:
    get:
      tags: [Settings]
      summary: List settings by scope (paginated)
      operationId: listSettings
      security:
        - bearerAuth: []
      parameters:
        - name: scope
          in: query
          required: true
          schema: { $ref: "#/components/schemas/SettingScope" }
        - name: tenantId
          in: query
          schema: { type: string }
          description: Required when scope=TENANT
        - name: userId
          in: query
          schema: { type: string }
          description: Defaults to current user when scope=USER
        - name: key
          in: query
          schema: { type: string }
        - name: page
          in: query
          schema: { type: integer, default: 1 }
        - name: pageSize
          in: query
          schema: { type: integer, default: 20, maximum: 100 }
      responses:
        "200":
          description: Paginated list（encrypted 项 value 为掩码）
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/SettingListResponse"
        "400":
          $ref: "#/components/responses/BadRequest"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "403":
          $ref: "#/components/responses/Forbidden"
    post:
      tags: [Settings]
      summary: Create a setting (SYSTEM/TENANT/USER)
      operationId: createSetting
      security:
        - bearerAuth: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/SettingCreate"
      responses:
        "201":
          description: Created
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/SettingResponse"
        "400":
          $ref: "#/components/responses/BadRequest"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "403":
          $ref: "#/components/responses/Forbidden"
        "409":
          $ref: "#/components/responses/Conflict"

  /api/settings/{id}:
    get:
      tags: [Settings]
      summary: Get setting detail
      operationId: getSetting
      security:
        - bearerAuth: []
      parameters:
        - name: id
          in: path
          required: true
          schema: { type: string }
        - name: scope
          in: query
          required: true
          schema: { $ref: "#/components/schemas/SettingScope" }
      responses:
        "200":
          description: Detail（encrypted 项 value 为掩码）
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/SettingResponse"
        "400":
          $ref: "#/components/responses/BadRequest"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "403":
          $ref: "#/components/responses/Forbidden"
        "404":
          $ref: "#/components/responses/NotFound"
    patch:
      tags: [Settings]
      summary: Update setting（乐观锁 version）
      operationId: updateSetting
      security:
        - bearerAuth: []
      parameters:
        - name: id
          in: path
          required: true
          schema: { type: string }
        - name: scope
          in: query
          required: true
          schema: { $ref: "#/components/schemas/SettingScope" }
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/SettingUpdate"
      responses:
        "200":
          description: Updated
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/SettingResponse"
        "400":
          $ref: "#/components/responses/BadRequest"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "403":
          $ref: "#/components/responses/Forbidden"
        "404":
          $ref: "#/components/responses/NotFound"
        "409":
          $ref: "#/components/responses/Conflict"
    delete:
      tags: [Settings]
      summary: Soft delete setting
      operationId: deleteSetting
      security:
        - bearerAuth: []
      parameters:
        - name: id
          in: path
          required: true
          schema: { type: string }
        - name: scope
          in: query
          required: true
          schema: { $ref: "#/components/schemas/SettingScope" }
      responses:
        "200":
          description: Soft deleted
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/DeleteResponse"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "403":
          $ref: "#/components/responses/Forbidden"
        "404":
          $ref: "#/components/responses/NotFound"

  # ==========================================================================
  # Notification Templates（第三批）
  # 权限码：notification-template:view/create/edit/delete
  # code 唯一；删除为软删除；更新需 version
  # ==========================================================================
  /api/notification-templates:
    get:
      tags: [Notification Templates]
