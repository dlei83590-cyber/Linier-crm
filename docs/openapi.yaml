    # ==========================================================================
    # Sprint 4C Delivery Foundation（Enums + Models + Requests/Responses）
    # ==========================================================================
    DeliveryStatus:
      type: string
      enum: [DRAFT, READY, DISPATCHED, DELIVERED, COMPLETED, CANCELLED]

    DeliverySnapshotType:
      type: string
      description: 快照类型（仅固化节点生成，只读）；COMPLETED 本阶段仅枚举不提供 /complete
      enum: [CREATED, READY, DISPATCHED, DELIVERED, CANCELLED]

    DeliveryRevisionStatus:
      type: string
      enum: [DRAFT, SUBMITTED, APPROVED, SUPERSEDED]

    DeliveryPodStatus:
      type: string
      description: POD（Proof of Delivery）签收状态；原始文件走 File Center（businessType=delivery，attachmentType=POD）
      enum: [PENDING, RECEIVED, WAIVED]

    Delivery:
      type: object
      required: [id, code, salesOrderId, customerId, status, version]
      properties:
        id: { type: string }
        code: { type: string, description: 单据编号（DocumentSequence docType=DELIVERY_ORDER，前缀 DO，位数 6） }
        salesOrderId: { type: string, description: "来源销售订单（NOT NULL；Direct Delivery 禁止，唯一入口 POST /api/sales-orders/{id}/deliveries）" }
        customerId: { type: string, description: 收货客户（继承 SalesOrder.customerId） }
        status: { $ref: "#/components/schemas/DeliveryStatus" }
        deliveryDate: { type: [string, "null"], format: date-time, description: 交付日期（计划/实际） }
        expectedArrivalDate: { type: [string, "null"], format: date-time }
        carrier: { type: [string, "null"], description: 承运方（物流公司/车次/单号） }
        trackingNo: { type: [string, "null"] }
        podStatus: { $ref: "#/components/schemas/DeliveryPodStatus" }
        podReceivedAt: { type: [string, "null"], format: date-time, description: 签收时间（RECEIVED 时回填） }
        podConfirmedById: { type: [string, "null"], description: 签收确认人（RECEIVED 时回填） }
        remark: { type: [string, "null"] }
        version: { type: integer, description: 乐观锁版本 }
        createdById: { type: [string, "null"] }
        updatedById: { type: [string, "null"] }
        deletedAt: { type: [string, "null"], format: date-time }
        isActive: { type: boolean }

    DeliveryLine:
      type: object
      required: [id, deliveryId, description, quantity, orderedQty, deliveredQty, version]
      properties:
        id: { type: string }
        deliveryId: { type: string }
        sourceSalesOrderLineId: { type: [string, "null"], description: 溯源 → SalesOrderLine（SalesOrderLine 软删后 SetNull） }
        lineNo: { type: integer, description: 行号（10/20/30/40 步进） }
        itemId: { type: [string, "null"] }
        description: { type: string, description: 描述（快照） }
        quantity: { type: number, description: 本次实际交付量（正数；防超交由事务层动态校验） }
        uomId: { type: [string, "null"] }
        orderedQty: { type: number, description: 订单行订购量快照（只读投影，禁止手工填写） }
        deliveredQty: { type: number, description: 已实际交付量快照（仅 DELIVERED/COMPLETED 累计；只读投影） }
        version: { type: integer }
        createdById: { type: [string, "null"] }
        updatedById: { type: [string, "null"] }
        deletedAt: { type: [string, "null"], format: date-time }
        isActive: { type: boolean }

    DeliveryRevision:
      type: object
      required: [id, deliveryId, revisionNo, changeReason]
      properties:
        id: { type: string }
        deliveryId: { type: string }
        revisionNo: { type: integer, description: 系统自动递增（唯一版本载体） }
        revisionStatus: { $ref: "#/components/schemas/DeliveryRevisionStatus" }
        changeReason: { type: string }
        snapshotData: { type: object, description: 系统生成的当前状态快照（金额 Decimal 字符串，禁止 toNumber） }
        createdById: { type: [string, "null"] }
        updatedById: { type: [string, "null"] }
        deletedAt: { type: [string, "null"], format: date-time }
        isActive: { type: boolean }

    DeliverySnapshot:
      type: object
      required: [id, deliveryId, snapshotType, revisionNo]
      properties:
        id: { type: string }
        deliveryId: { type: string }
        snapshotType: { $ref: "#/components/schemas/DeliverySnapshotType" }
        revisionNo: { type: integer, description: 快照对应的修订号 }
        snapshotData: { type: object, description: 完整快照（Header + Lines + sourceSalesOrderLineId 集合；Decimal 字符串，禁止 toNumber） }
        generatedById: { type: [string, "null"] }
        generatedAt: { type: [string, "null"], format: date-time }
        createdById: { type: [string, "null"] }
        updatedById: { type: [string, "null"] }
        deletedAt: { type: [string, "null"], format: date-time }
        isActive: { type: boolean }

    DeliveryCreate:
      type: object
      properties:
        deliveryDate: { type: [string, "null"], format: date-time, description: 计划交付日期（默认 now） }
        expectedArrivalDate: { type: [string, "null"], format: date-time }
        carrier: { type: [string, "null"], maxLength: 100 }
        trackingNo: { type: [string, "null"], maxLength: 100 }
        remark: { type: [string, "null"], maxLength: 1000 }
        lines:
          type: array
          description: 显式指定交付行（从 SO Line 选择，不默认复制全部剩余行；适合分批发货）
          items:
            type: object
            required: [sourceSalesOrderLineId, quantity]
            properties:
              sourceSalesOrderLineId: { type: string }
              quantity: { type: number, exclusiveMinimum: 0 }
        changeReason: { type: string, maxLength: 500 }

    DeliveryUpdate:
      type: object
      required: [version]
      properties:
        deliveryDate: { type: [string, "null"], format: date-time }
        expectedArrivalDate: { type: [string, "null"], format: date-time }
        carrier: { type: [string, "null"], maxLength: 100 }
        trackingNo: { type: [string, "null"], maxLength: 100 }
        remark: { type: [string, "null"], maxLength: 1000 }
        changeReason: { type: string, maxLength: 500 }
        version: { type: integer, description: 乐观锁版本（冲突返回 409 VERSION_CONFLICT） }
        # 不可改 salesOrderId/customerId/status（来源与状态由系统管理）

    DeliveryLineUpdate:
      type: object
      required: [version]
      properties:
        quantity: { type: number, exclusiveMinimum: 0, description: 数量变更 → 动态校验 availableQty 防超交（409 DELIVERY_QUANTITY_EXCEEDED） }
        description: { type: string, maxLength: 500 }
        uomId: { type: [string, "null"] }
        lineNo: { type: integer }
        changeReason: { type: string, maxLength: 500 }
        version: { type: integer }
        # sourceSalesOrderLineId 溯源永不清除；deliveredQty/orderedQty 只读投影不可写

    DeliveryActionRequest:
      type: object
      properties:
        changeReason: { type: string, maxLength: 500 }

    DeliveryDispatchRequest:
      type: object
      properties:
        carrier: { type: [string, "null"], maxLength: 100 }
        trackingNo: { type: [string, "null"], maxLength: 100 }
        expectedArrivalDate: { type: [string, "null"], format: date-time }
        changeReason: { type: string, maxLength: 500 }

    DeliveryConfirmRequest:
      type: object
      properties:
        podStatus: { type: string, enum: [RECEIVED, WAIVED], description: POD 门禁：RECEIVED 回填签收投影 / WAIVED 豁免；PENDING 拒绝（409） }
        podReceivedAt: { type: [string, "null"], format: date-time }
        changeReason: { type: string, maxLength: 500 }

    DeliveryResponse:
      type: object
      required: [success, data]
      properties:
        success: { type: boolean, example: true }
        data: { $ref: "#/components/schemas/Delivery" }

    DeliveryListResponse:
      type: object
      required: [success, data]
      properties:
        success: { type: boolean, example: true }
        data:
          type: array
          items: { $ref: "#/components/schemas/Delivery" }

    DeliveryLineResponse:
      type: object
      required: [success, data]
      properties:
        success: { type: boolean, example: true }
        data: { $ref: "#/components/schemas/DeliveryLine" }

    DeliveryLineListResponse:
      type: object
      required: [success, data]
      properties:
        success: { type: boolean, example: true }
        data:
          type: array
          items: { $ref: "#/components/schemas/DeliveryLine" }

    DeliveryActionResponse:
      type: object
      required: [success, data]
      properties:
        success: { type: boolean, example: true }
        data:
          type: object
          properties:
            id: { type: string }
            status: { $ref: "#/components/schemas/DeliveryStatus" }
            podStatus: { $ref: "#/components/schemas/DeliveryPodStatus" }
            salesOrder:
              type: object
              description: confirm-delivery 聚合回写后的 SO 状态投影
              properties:
                id: { type: string }
                status: { $ref: "#/components/schemas/SalesOrderStatus" }
                deliveredAt: { type: [string, "null"], format: date-time }

    DeliveryErrorCodes:
      type: string
      description: |
        Delivery 领域错误码（与实现 errors.ts 一致）：
        - DELIVERY_NOT_FOUND（404）交付单不存在
        - DELIVERY_LINE_NOT_FOUND（404）交付行不存在
        - DELIVERY_INVALID_STATE（409）状态不允许（ready/dispatch/confirm/cancel 状态机校验；含 POD 未确认与重复确认场景）
        - DELIVERY_QUANTITY_EXCEEDED（409）超交（请求数量 > availableQty）
        - DELIVERY_SOURCE_LINE_INVALID（400）交付行来源销售订单行无效或已删除
        - SALES_ORDER_NOT_DELIVERABLE（409）来源 SO 状态不允许创建交付（仅 CONFIRMED/PARTIALLY_DELIVERED）
        - VERSION_CONFLICT（409）乐观锁版本冲突
        语义映射（文档层面补充，实现统一以 DELIVERY_INVALID_STATE 表达）：
        - DELIVERY_POD_REQUIRED → POD 门禁失败（podStatus ∉ {RECEIVED, WAIVED}），实现返回 409 DELIVERY_INVALID_STATE
        - DELIVERY_ALREADY_CONFIRMED → 重复 confirm（非 DISPATCHED），实现返回 409 DELIVERY_INVALID_STATE
        - DELIVERY_STATUS_INVALID → 状态机不允许的流转，实现返回 409 DELIVERY_INVALID_STATE

    # ==========================================================================
    # Sprint 4D Invoice Foundation（Enums + Models + Requests/Responses）
    # ==========================================================================
    InvoiceStatus:
      type: string
      enum: [DRAFT, ISSUED, PARTIALLY_PAID, PAID, CANCELLED]
      description: DRAFT 草稿（可编辑头）/ ISSUED 已开票（取号后不可直接取消，走 Credit Note）/ PARTIALLY_PAID+PAID 4E 回写投影 / CANCELLED 已取消（仅 DRAFT 可取消）

    InvoiceSnapshotType:
      type: string
      description: 快照类型（仅固化节点生成，只读）；无 APPROVED（审批终态只回写投影）
      enum: [CREATED, ISSUED, CANCELLED]

    InvoiceRevisionStatus:
      type: string
      enum: [DRAFT, SUBMITTED, APPROVED, SUPERSEDED]

    InvoiceLineStatus:
      type: string
      enum: [ACTIVE, CANCELLED]

    Invoice:
      type: object
      required: [id, deliveryId, salesOrderId, customerId, status, invoiceDate, currency, version]
      properties:
        id: { type: string }
        code: { type: [string, "null"], description: 单据编号（CTO Review 必改①：DRAFT 不占号 code=NULL，仅 ISSUE 时 DocumentSequence 取号 INV-2026-000123） }
        deliveryId: { type: string, description: "来源交付单（NOT NULL；唯一入口 POST /api/deliveries/{id}/invoice；Direct Invoice 禁止）" }
        salesOrderId: { type: string, description: 冗余投影（经 Delivery 溯源 SalesOrder；便于 AR/对账） }
        customerId: { type: string, description: 开票客户（继承 Delivery.customerId） }
        status: { $ref: "#/components/schemas/InvoiceStatus" }
        invoiceDate: { type: string, format: date-time, description: 开票日期 }
        dueDate: { type: [string, "null"], format: date-time, description: 到期日（4E AR 使用；PATCH 可编辑，变更触发重审） }
        currency: { type: string, description: 币种（继承 SalesOrder；Consolidated 合并校验需一致） }
        taxProfileId: { type: [string, "null"], description: 税率档案（继承 SalesOrder；Consolidated 合并校验需一致） }
        paymentTerm: { type: [string, "null"], description: 付款条款（4E AR 使用；PATCH 可编辑，变更触发重审；Consolidated 合并校验需一致） }
        subtotal: { type: number, description: 未税合计（财务事实，直接复制自 DeliveryLine 快照；禁止重新计算） }
        taxAmount: { type: number, description: 税额 }
        invoiceTotal: { type: number, description: 含税合计 }
        paidAmount: { type: number, description: 已收款（Sprint 4E 回写；本阶段固定 0） }
        balanceAmount: { type: number, description: 应收余额 = invoiceTotal - paidAmount }
        remark: { type: [string, "null"] }
        workflowInstanceId: { type: [string, "null"], description: 审批实例（Workflow 为唯一事实源；不建 InvoiceApproval 表） }
        approvalStatus: { type: string, description: 审批投影（DRAFT/PENDING/APPROVED/REJECTED） }
        approvedAt: { type: [string, "null"], format: date-time }
        approvedById: { type: [string, "null"] }
        version: { type: integer, description: 乐观锁版本 }
        createdById: { type: [string, "null"] }
        updatedById: { type: [string, "null"] }
        deletedAt: { type: [string, "null"], format: date-time }
        isActive: { type: boolean }

    InvoiceLine:
      type: object
      required: [id, invoiceId, description, quantity, unitPrice, lineAmount, version]
      properties:
        id: { type: string }
        invoiceId: { type: string }
        sourceDeliveryLineId: { type: [string, "null"], description: 溯源 → DeliveryLine（DeliveryLine 软删后 SetNull） }
        lineNo: { type: integer, description: 行号（10/20/30/40 步进） }
        itemId: { type: [string, "null"] }
        description: { type: string, description: 描述（快照，复制自 DeliveryLine.description） }
        quantity: { type: number, description: 开票数量（<= DeliveryLine.quantity 已交付量，防超开票） }
        uomId: { type: [string, "null"] }
        priceSnapshotId: { type: [string, "null"], description: 直接复制 SalesOrderLine.priceSnapshotId（四段溯源链取价） }
        unitPrice: { type: number, description: 单价快照（复制，不重算） }
        discountRate: { type: number, description: 折扣率快照（复制） }
        lineAmount: { type: number, description: 行未税金额（复制计算值） }
        taxAmount: { type: number, description: 行税额（复制） }
        totalAmount: { type: number, description: 行含税金额（复制） }
        version: { type: integer }
        createdById: { type: [string, "null"] }
        updatedById: { type: [string, "null"] }
        deletedAt: { type: [string, "null"], format: date-time }
        isActive: { type: boolean }

    InvoiceRevision:
      type: object
      required: [id, invoiceId, revisionNo, changeReason]
      properties:
        id: { type: string }
        invoiceId: { type: string }
        revisionNo: { type: integer, description: 系统自动递增（唯一版本载体） }
        revisionStatus: { $ref: "#/components/schemas/InvoiceRevisionStatus" }
        changeReason: { type: string }
        snapshotData: { type: object, description: 系统生成的当前状态快照（金额 Decimal 字符串，禁止 toNumber） }
        createdById: { type: [string, "null"] }
        updatedById: { type: [string, "null"] }
        deletedAt: { type: [string, "null"], format: date-time }
        isActive: { type: boolean }

    InvoiceSnapshot:
      type: object
      required: [id, invoiceId, snapshotType, revisionNo]
      properties:
        id: { type: string }
        invoiceId: { type: string }
        snapshotType: { $ref: "#/components/schemas/InvoiceSnapshotType" }
        revisionNo: { type: integer, description: 快照对应的修订号 }
        snapshotData: { type: object, description: 完整快照（Header + Lines + sourceDeliveryLineId 集合；Decimal 字符串，禁止 toNumber）；ISSUED 快照含 issuedAt/issuedById（schema 无 issuedAt/issuedById 列，记 snapshotData） }
        taxProfileId: { type: [string, "null"], description: CTO Review 必改②：税率档案快照 }
        taxRate: { type: [number, "null"], description: 税率快照 }
        sstNo: { type: [string, "null"], description: SST 注册号快照（销售与服务税登记号） }
        currencyRate: { type: [number, "null"], description: 汇率快照 }
        exchangeRate: { type: [number, "null"], description: 汇率快照（与 currencyRate 同值冗余） }
        generatedById: { type: [string, "null"] }
        generatedAt: { type: [string, "null"], format: date-time }
        createdById: { type: [string, "null"] }
        updatedById: { type: [string, "null"] }
        deletedAt: { type: [string, "null"], format: date-time }
        isActive: { type: boolean }

    InvoiceCreate:
      type: object
      required: [lines]
      properties:
        deliveryIds: { type: array, items: { type: string }, description: Consolidated Invoice 附加 Delivery 来源（与 primaryDeliveryId 的 Customer/Currency/TaxProfile/PaymentTerm 必须一致，否则 409 INVOICE_SOURCE_NOT_COMPATIBLE） }
        lines:
          type: array
          minItems: 1
          description: Partial Billing：开票行（deliveryLineId + quantity；quantity > 0 且 <= remainingInvoiceQty，否则 409 INVOICE_QUANTITY_EXCEEDED）
          items:
            type: object
            required: [deliveryLineId, quantity]
            properties:
              deliveryLineId: { type: string }
              quantity: { type: number, exclusiveMinimum: 0 }
        invoiceDate: { type: string, format: date-time, description: 开票日期（默认 now） }
        dueDate: { type: [string, "null"], format: date-time }
        remark: { type: [string, "null"], maxLength: 1000 }
        changeReason: { type: string, maxLength: 500 }

    InvoiceUpdate:
      type: object
      required: [version]
      description: 仅 DRAFT 可编辑；只允许非财务字段 remark/dueDate/paymentTerm（schema 无 reference 列）；金额/数量/code/status 禁止 PATCH
      properties:
        remark: { type: [string, "null"], maxLength: 1000 }
        dueDate: { type: [string, "null"], format: date-time }
        paymentTerm: { type: [string, "null"], maxLength: 50 }
        changeReason: { type: string, maxLength: 500 }
        version: { type: integer, minimum: 1 }

    InvoiceActionRequest:
      type: object
      properties:
        changeReason: { type: string, maxLength: 500 }

    InvoiceResponse:
      type: object
      required: [success, data]
      properties:
        success: { type: boolean, example: true }
        data: { $ref: "#/components/schemas/Invoice" }

    InvoiceListResponse:
      type: object
      required: [success, data]
      properties:
        success: { type: boolean, example: true }
        data:
          type: array
          items: { $ref: "#/components/schemas/Invoice" }

    InvoiceLineResponse:
      type: object
      required: [success, data]
      properties:
        success: { type: boolean, example: true }
        data: { $ref: "#/components/schemas/InvoiceLine" }

    InvoiceLineListResponse:
      type: object
      required: [success, data]
      properties:
        success: { type: boolean, example: true }
        data:
          type: array
          items: { $ref: "#/components/schemas/InvoiceLine" }

    InvoiceRevisionListResponse:
      type: object
      required: [success, data]
      properties:
        success: { type: boolean, example: true }
        data:
          type: array
          items: { $ref: "#/components/schemas/InvoiceRevision" }

    InvoiceSnapshotListResponse:
      type: object
      required: [success, data]
      properties:
        success: { type: boolean, example: true }
        data:
          type: array
          items: { $ref: "#/components/schemas/InvoiceSnapshot" }

    InvoiceActionResponse:
      type: object
      required: [success, data]
      properties:
        success: { type: boolean, example: true }
        data:
          type: object
          properties:
            invoice:
              type: object
              properties:
                id: { type: string }
                status: { $ref: "#/components/schemas/InvoiceStatus" }
            code: { type: [string, "null"], description: issue 成功时返回取号后的编号（INV-2026-000123） }
            issuedAt: { type: [string, "null"], format: date-time, description: issue 成功时返回（记 ISSUED 快照 snapshotData） }

    InvoiceErrorCodes:
      type: string
      description: |
        Invoice 领域错误码（与实现 errors.ts 一致）：
        - INVOICE_NOT_FOUND（404）发票不存在
        - INVOICE_INVALID_STATE（409）状态不允许（仅 DELIVERED 可开票 / 仅 DRAFT 可编辑/取消 / 审批门禁未通过等）
        - INVOICE_LINE_NOT_FOUND（404）开票行（DeliveryLine）不存在
        - INVOICE_QUANTITY_EXCEEDED（409）超开票（请求数量 > remainingInvoiceQty）
        - INVOICE_SOURCE_NOT_COMPATIBLE（409）Consolidated Invoice 来源财务属性不一致（Customer/Currency/TaxProfile/PaymentTerm）
        - INVOICE_WORKFLOW_FAILED（409）审批流程定义不存在或未发布（INVOICE_APPROVAL），发票变更已回滚
        - DELIVERY_SOURCE_LINE_INVALID（400）交付行来源销售订单行无效或已删除
        - VERSION_CONFLICT（409）乐观锁版本冲突

    # ==========================================================================
    # Sprint 4E-1 Accounts Receivable Foundation（Enums + Models + Responses）
    # ==========================================================================
    AccountsReceivableStatus:
      type: string
      enum: [OPEN, PARTIALLY_PAID, PAID, OVERDUE, CLOSED]
      description: 余额生命周期；OVERDUE 惰性判定（CTO 拍板②：effectiveStatus Projection，非数据库真实状态——status ∈ {OPEN,PARTIALLY_PAID} 且 dueDate < now）

    AccountsReceivableSnapshotType:
      type: string
      enum: [CREATED, PARTIALLY_PAID, PAID, ADJUSTED, WRITTEN_OFF, CLOSED]
      description: 快照类型（仅固化节点生成，只读）

    AccountsReceivableSnapshotSource:
      type: string
      enum: [ISSUE, PAYMENT, WRITE_OFF, ADJUSTMENT, MANUAL]
      description: CTO Review 必改②：快照来源枚举——Receipt/CN/DN/WriteOff 全部可复用

    AccountsReceivable:
      type: object
      required: [id, invoiceId, customerId, currency, originalAmount, balanceAmount, status, version]
      properties:
        id: { type: string }
        invoiceId: { type: string, description: "1:1 绑定 Invoice（单据事实源）；有 AR 的发票禁止删除（必改③）" }
        customerId: { type: string, description: 客户（继承 Invoice.customerId；对账用） }
        currency: { type: string, description: 币种（继承 Invoice.currency） }
        originalAmount: { type: number, description: 原始金额（= Invoice.invoiceTotal，AR 创建时复制，不重算） }
        adjustedAmount: { type: number, description: 调整金额（4E-3 CN/DN 聚合，可正可负） }
        paidAmount: { type: number, description: 已收款（4E-2 Receipt 回写） }
        writeOffAmount: { type: number, description: 坏账核销金额（4E-2 WriteOff 回写） }
        balanceAmount: { type: number, description: 余额唯一口径 = originalAmount + adjustedAmount - paidAmount - writeOffAmount（服务端唯一计算，前端禁止 PATCH） }
        status: { $ref: "#/components/schemas/AccountsReceivableStatus" }
        effectiveStatus: { $ref: "#/components/schemas/AccountsReceivableStatus", description: 惰性投影（OVERDUE 判定；CTO 拍板②） }
        isOverdue: { type: boolean, description: "惰性投影：status∈{OPEN,PARTIALLY_PAID} 且 dueDate<now" }
        effectiveAgingBucket: { type: [string, "null"], description: "惰性投影：0-30/31-60/61-90/90+（CTO 必改①：不存库，读取时动态计算，只依赖 today/dueDate/balance）" }
        dueDate: { type: [string, "null"], format: date-time, description: 到期日（继承 Invoice.dueDate；逾期判定基准） }
        lastPaymentAt: { type: [string, "null"], format: date-time, description: 最近收款时间（4E-2 回写） }
        version: { type: integer, description: 乐观锁版本 }
        createdById: { type: [string, "null"] }
        updatedById: { type: [string, "null"] }
        deletedAt: { type: [string, "null"], format: date-time }
        isActive: { type: boolean }

    AccountsReceivableRevision:
      type: object
      required: [id, accountsReceivableId, revisionNo, changeReason]
      properties:
        id: { type: string }
        accountsReceivableId: { type: string }
        revisionNo: { type: integer, description: 系统自动递增（唯一版本载体） }
        changeReason: { type: string }
        snapshotData: { type: object, description: 当前余额状态快照（金额 Decimal 字符串，禁止 toNumber） }
        createdById: { type: [string, "null"] }
        updatedById: { type: [string, "null"] }
        deletedAt: { type: [string, "null"], format: date-time }
        isActive: { type: boolean }

    AccountsReceivableSnapshot:
      type: object
      required: [id, accountsReceivableId, snapshotType, snapshotSource, revisionNo]
      properties:
        id: { type: string }
        accountsReceivableId: { type: string }
        snapshotType: { $ref: "#/components/schemas/AccountsReceivableSnapshotType" }
        snapshotSource: { $ref: "#/components/schemas/AccountsReceivableSnapshotSource", description: CTO 必改②：来源枚举 }
        revisionNo: { type: integer }
        snapshotData: { type: object, description: 完整快照（Header + 四金额输入 + balanceAmount + customerId/currency/dueDate；Decimal 字符串） }
        generatedById: { type: [string, "null"] }
        generatedAt: { type: [string, "null"], format: date-time }
        createdById: { type: [string, "null"] }
        updatedById: { type: [string, "null"] }
        deletedAt: { type: [string, "null"], format: date-time }
        isActive: { type: boolean }

    AccountsReceivableResponse:
      type: object
      required: [success, data]
      properties:
        success: { type: boolean, example: true }
        data: { $ref: "#/components/schemas/AccountsReceivable" }

    AccountsReceivableListResponse:
      type: object
      required: [success, data]
      properties:
        success: { type: boolean, example: true }
        data:
          type: array
          items: { $ref: "#/components/schemas/AccountsReceivable" }

    AccountsReceivableRevisionListResponse:
      type: object
      required: [success, data]
      properties:
        success: { type: boolean, example: true }
        data:
          type: array
          items: { $ref: "#/components/schemas/AccountsReceivableRevision" }

    AccountsReceivableSnapshotListResponse:
      type: object
      required: [success, data]
      properties:
        success: { type: boolean, example: true }
        data:
          type: array
          items: { $ref: "#/components/schemas/AccountsReceivableSnapshot" }

    AccountsReceivableAgingResponse:
      type: object
      required: [success, data]
      properties:
        success: { type: boolean, example: true }
        data:
          type: object
          properties:
            asOf: { type: string, format: date-time }
            buckets:
              type: object
              description: 账龄区间（0-30/31-60/61-90/90+ + settled 已清）聚合
              properties:
                "0-30": { $ref: "#/components/schemas/AgingBucketSummary" }
                "31-60": { $ref: "#/components/schemas/AgingBucketSummary" }
                "61-90": { $ref: "#/components/schemas/AgingBucketSummary" }
                "90+": { $ref: "#/components/schemas/AgingBucketSummary" }
                settled: { $ref: "#/components/schemas/AgingBucketSummary" }
            totalRecords: { type: integer }
            totalBalance: { type: number }

    AgingBucketSummary:
      type: object
      properties:
        count: { type: integer, description: 记录数 }
        balance: { type: number, description: 余额合计 }

    AccountsReceivableErrorCodes:
      type: string
      description: |
        Accounts Receivable 领域错误码（与实现 errors.ts 一致）：
        - ACCOUNTS_RECEIVABLE_NOT_FOUND（404）应收记录不存在
        - VERSION_CONFLICT（409）乐观锁版本冲突（预留，4E-1 无 PATCH）
        注意：AR 由 Invoice ISSUED 自动创建（拍板①），无 POST/PATCH 创建与金额修改端点；
        金额只能由 4E-2 Receipt / WriteOff、4E-3 CN/DN 动作或下游事实表驱动（CTO 锁定）。

    # ==========================================================================
    # Sprint 4E-2 Receipt & Payment Allocation Foundation（Enums + Models + Requests + Responses）
    # 边界锁死（CTO Design Review 97/100 + 实施锁定，Final Review 检查点）：
    # ① Receipt 创建 ≠ Allocation；② Allocation 同 Customer / 同 Currency（409，禁跨币种）；
    # ③ Reversal ≠ Credit Note（Allocation Reversal 解除核销留痕，不删除原记录；CN 属 4E-3）；
    # ④ WriteOff Approval ≠ Apply（Apply 是唯一修改 AR.writeOffAmount/balanceAmount 的入口）；
    # ⑤ WriteOff 只减 Invoice.balanceAmount 投影，绝不增加 Invoice.paidAmount（WriteOff ≠ Payment）。
    # ==========================================================================
    ReceiptStatus:
      type: string
      enum: [UNALLOCATED, PARTIALLY_ALLOCATED, FULLY_ALLOCATED, VOIDED]
      description: 收款状态（受控投影——拍板②：只能由 allocation/reversal/void 事务更新，禁止 PATCH；前三个可由金额动态推导：unallocatedAmount>0 / =0）

    PaymentMethod:
      type: string
      enum: [BANK_TRANSFER, CHEQUE, CASH, CARD, OTHER]
      description: 收款方式

    ReceiptSnapshotType:
      type: string
      enum: [CREATED, ALLOCATED, VOIDED, REVERSED]
      description: 收款快照类型（仅固化节点生成，只读）

    Receipt:
      type: object
      required: [id, code, customerId, currency, amount, allocatedAmount, unallocatedAmount, receiptDate, paymentMethod, status, version]
      properties:
        id: { type: string }
        code: { type: string, description: 收款单编号（RCT-2026-xxxx，DocumentSequence 创建即取号——拍板④） }
        customerId: { type: string, description: 收款客户（核销目标 AR.customerId 必须一致——硬规则） }
        currency: { type: string, description: 币种（核销目标 AR.currency 必须一致——硬规则，第一版禁止跨币种核销） }
        amount: { type: number, description: 实收金额（收款事实） }
        allocatedAmount: { type: number, description: 受控投影 = Σ ReceiptAllocation.allocatedAmount（禁止 PATCH） }
        unallocatedAmount: { type: number, description: 受控投影 = amount - allocatedAmount（拍板⑤：预收/暂未指定发票场景） }
        receiptDate: { type: string, format: date-time }
        paymentMethod: { $ref: "#/components/schemas/PaymentMethod" }
        referenceNo: { type: [string, "null"], description: 银行流水号/备注 }
        status: { $ref: "#/components/schemas/ReceiptStatus" }
        voidedAt: { type: [string, "null"], format: date-time }
        voidedById: { type: [string, "null"] }
        version: { type: integer }
        createdById: { type: [string, "null"] }
        updatedById: { type: [string, "null"] }
        deletedAt: { type: [string, "null"], format: date-time }
        isActive: { type: boolean }

    ReceiptAllocation:
      type: object
      required: [id, receiptId, accountsReceivableId, allocatedAmount, allocatedAt]
      properties:
        id: { type: string }
        receiptId: { type: string }
        accountsReceivableId: { type: string }
        allocatedAmount: { type: number, description: 本次核销金额 }
        allocatedAt: { type: string, format: date-time }
        allocatedBy: { type: [string, "null"] }
        reversedAt: { type: [string, "null"], format: date-time, description: Allocation Reversal 留痕（非空即已冲销；不删除原记录） }
        reversedBy: { type: [string, "null"] }
        reverseReason: { type: [string, "null"] }
        version: { type: integer }
        createdById: { type: [string, "null"] }
        updatedById: { type: [string, "null"] }
        deletedAt: { type: [string, "null"], format: date-time }
        isActive: { type: boolean }

    ReceiptRevision:
      type: object
      required: [id, receiptId, revisionNo, changeReason]
      properties:
        id: { type: string }
        receiptId: { type: string }
        revisionNo: { type: integer, description: 系统自动递增（唯一版本载体） }
        changeReason: { type: string }
        snapshotData: { type: object, description: 头信息快照（金额 Decimal 字符串，禁止 toNumber） }
