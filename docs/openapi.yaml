  /api/purchase-returns/{id}/return:
    post:
      tags: [Purchase Returns]
      summary: Complete return (DRAFT → RETURNED; lock-based re-check; REPLACE_REQUIRED reopens PO in same txn)
      description: |
        **退货真 Gate（CTO #7219 + Re-review 98/100 FINAL）**。事务内 FOR UPDATE 锁 PurchaseReturn + 真实来源行
        （PurchaseReceiptLine / WarehouseReceiptLine / Inspection）+ CAS/幂等（ALREADY_RETURNED → 409）。
        **防并发超退**：锁内重算累计 RETURNED（仅 RETURNED 单占用；本单 DRAFT 未过账不计入，不双计）→ 本单行 ≤ 来源可退余额
        （口径同 Create：rejectedOnReceiptQty / rejectedQty / POSTED 入库行 quantity）→ 409 OVER_SOURCE_BALANCE。
        **REPLACE_REQUIRED 同一事务内真正 reopen PO 履约（Blocking ②）**：INSPECTION / WAREHOUSE_RECEIPT_LINE 来源
        按 PO Line 聚合 reopen 数量、锁 PurchaseOrderLine FOR UPDATE、`receivedQty -= returnQty`、`remainingReceiveQty`
        重开待交（max(quantity - receivedQty, 0)，与 receive canonical helper 一致）；**RECEIPT_LINE(rejectedOnReceiptQty)
        收货时未计入 receivedQty，供应商本就欠货，不重复 reopen**；原始 PurchaseReceipt/Inspection/WarehouseReceipt 事实不倒改；
        PO 原状态 RECEIVED + 有效 reopen → 重聚回 PARTIALLY_RECEIVED（防自相矛盾）。**line-level disposition（Minor）**：
        PurchaseReturned 事件/Audit 载荷含 `lines[]`（lineId/sourceRefType/sourceId/quantity/disposition）+
        `hasReplacementRequired` / `hasCreditOnly`（弃第一行单值冒充整单）。**5B 禁写 InventoryMovement(OUT) / Stock**
        （6A 唯一事实源）；财务冲减/红字发票/AP 属 5C。权限：purchase-return:edit。
      operationId: completePurchaseReturn
      security:
        - bearerAuth: []
      parameters:
        - { name: id, in: path, required: true, schema: { type: string } }
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/PurchaseReturnReturn"
      responses:
        "200":
          description: OK（status=RETURNED + returnedAt）
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/PurchaseReturnReturnResponse"
        "400":
          $ref: "#/components/responses/BadRequest"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "403":
          $ref: "#/components/responses/Forbidden"
        "404":
          $ref: "#/components/responses/NotFound"
        "409":
          description: Conflict（重复退货幂等 / 状态不允许 / 超来源可退余额 / 版本冲突）
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"

  # ==========================================================================
  # Sprint 6A — Inventory Ledger Consumer（Transactional Outbox → 不可变 InventoryMovement + StockProjection 投影）
  # 范围（CTO #7683 Finalization Gate）：仅 consume 触发端点；Movement/Projection read model 不新增 API
  # ==========================================================================
  /api/inventory-ledger/consume:
    post:
      tags: [Inventory Ledger]
      summary: Trigger Inventory Consumer batch run (claim PENDING/retryable Outbox → consume → publish InventoryMovementCommitted)
      description: |
        触发一次 Consumer 批处理：claim（FOR UPDATE SKIP LOCKED）→ PROCESSING + lease → validate payload /
        resolve source → 五元幂等 → 锁五维 StockProjection → OUT 禁负库存 → INSERT InventoryMovement(COMMITTED) +
        UPSERT StockProjection + MARK Outbox PROCESSED 同事务 → 发布 InventoryMovementCommitted（best-effort）。
        幂等安全：重复触发不会重复入账（五元 UNIQUE + 预检）。返回批次统计。
        权限：inventory-ledger:consume。供 cron/手动触发。
      operationId: runInventoryConsumer
      security:
        - bearerAuth: []
      requestBody:
        required: false
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/InventoryConsumerRunRequest"
      responses:
        "200":
          description: Batch run summary（claimed/processed/retried/deadLettered/leaseLost + per-outbox results）
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/InventoryConsumerRunResponse"
        "400":
          $ref: "#/components/responses/BadRequest"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "403":
          $ref: "#/components/responses/Forbidden"

  # ==========================================================================
  # Sprint 6B-2 — Inventory Transfer（调拨 Vertical Slice，CTO #8233 授权）
  # 范围：Transfer 业务事实层 CRUD + Submit/Cancel/Execute；Execute 经共享 InventoryLedgerCommand
  #       双 atom（SOURCE_OUT + DESTINATION_IN，同一 movementGroupId）同事务落账（全有或全无）
  # 红线：Transfer API **绝不直接 INSERT InventoryMovement / UPDATE StockProjection**（6A 唯一事实源）
  # ==========================================================================
  /api/inventory-transfers:
    get:
      tags: [Inventory Transfers]
      summary: List inventory transfers (paginated, filterable by transferNo/sourceWarehouseId/destinationWarehouseId/status)
      description: |
        调拨单列表。过滤：transferNo / sourceWarehouseId / destinationWarehouseId / status（DRAFT|SUBMITTED|APPROVED|EXECUTED|CANCELLED）。软删除已过滤。
        权限：inventory-transfer:view。
      operationId: listInventoryTransfers
      security:
        - bearerAuth: []
      parameters:
        - name: page
          in: query
          schema: { type: integer, default: 1 }
        - name: pageSize
          in: query
          schema: { type: integer, default: 20, maximum: 100 }
        - name: transferNo
          in: query
          schema: { type: string }
        - name: sourceWarehouseId
          in: query
          schema: { type: string }
        - name: destinationWarehouseId
          in: query
          schema: { type: string }
        - name: status
          in: query
          schema: { type: string, description: InventoryTransferStatus 存储态 }
      responses:
        "200":
          description: Paginated list
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/InventoryTransferListResponse"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "403":
          $ref: "#/components/responses/Forbidden"
    post:
      tags: [Inventory Transfers]
      summary: Create Inventory Transfer (DRAFT; TRF 创建即取号; 自调拨防护; 红线 DRAFT 不落账)
      description: |
        创建调拨单（DRAFT；**创建即取号 TRF**）。源/目标 warehouse 必须有效（WAREHOUSE_INVALID）；
        location 若提供必须属于对应 warehouse（组合 FK，LOCATION_INVALID）；**自调拨防护**（同仓同库位含都 NULL → 409 SELF_TRANSFER）；
        至少一条有效行且 quantity > 0（NO_LINES / QUANTITY_INVALID）；行去重（DUPLICATE_LINE）；
        serial-managed 守恒 quantity == serialNos.length 且整数（SERIAL_QTY_MISMATCH / SERIAL_DUPLICATE）；
        transferType 由 service 推导（INTRA/INTER）。**红线：DRAFT 不落账**（不创建 InventoryMovement / 不更新 StockProjection）。
        权限：inventory-transfer:create。
      operationId: createInventoryTransfer
      security:
        - bearerAuth: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/InventoryTransferCreate"
      responses:
        "201":
          description: Created（status=DRAFT）
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/InventoryTransferResponse"
        "400":
          $ref: "#/components/responses/BadRequest"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "403":
          $ref: "#/components/responses/Forbidden"
        "409":
          description: Conflict（自调拨 / 版本冲突）
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"

