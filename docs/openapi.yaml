        approvalStatus: { type: string, enum: [DRAFT, PENDING, APPROVED, REJECTED] }
        version: { type: integer, default: 1 }
        createdAt: { type: string, format: date-time }
        updatedAt: { type: string, format: date-time }
    ProjectOpportunityCreate:
      type: object
