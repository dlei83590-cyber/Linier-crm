openapi: 3.0.3
info:
  title: Linier CRM Management System API
  description: Enterprise customer relationship management platform - Sprint 3A Workflow Foundation surface.
  version: 0.3.0-alpha
  contact:
    name: JINZA TRADING SDN. BHD.
servers:
  - url: http://localhost:3000
    description: Local development

tags:
  - name: Health
  - name: Auth
  - name: Audit Logs
  - name: Menu Center
  - name: Dashboard API
  - name: File Center
  - name: Customer Foundation
  - name: Workflow Definitions
  - name: Workflow Instances
  - name: Approver Groups
  - name: Dictionaries
  - name: Settings
  - name: Notification Templates
  - name: Item Master
  # Sprint 3C-4 Price Foundation
  - name: Price Policies
  - name: Price Rules
  - name: Price Lists
  - name: Price List Versions
  - name: Partner Prices
  - name: Promotions
  - name: Tax Profiles
  - name: Tax Rates
  - name: Exchange Rates
  - name: Pricing Engine
  # Sprint 3C-5 Project Foundation
  - name: Project Opportunities
  - name: Projects
  - name: Project Sub-resources
  # Sprint 4B Sales Order Foundation
  - name: Sales Orders
  - name: Sales Order Lines
  - name: Sales Order Revisions
  - name: Sales Order Snapshots
  - name: Sales Order Actions

paths:
  # ==========================================================================
  # Health / Auth
  # ==========================================================================
  /api/health:
    get:
      tags: [Health]
      summary: Liveness probe
      operationId: healthCheck
      responses:
        "200":
          description: Service is healthy
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/HealthResponse"

  /api/auth/login:
    post:
      tags: [Auth]
      summary: Sign in with email and password
      operationId: login
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/LoginRequest"
      responses:
        "200":
          description: Returns a session token
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/LoginResponse"
        "400":
          $ref: "#/components/responses/BadRequest"
        "401":
          $ref: "#/components/responses/Unauthorized"

  /api/auth/me:
    get:
      tags: [Auth]
      summary: Get the current authenticated user
      operationId: me
      security:
        - bearerAuth: []
      responses:
        "200":
          description: Current user profile and roles
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/MeResponse"
        "401":
          $ref: "#/components/responses/Unauthorized"

  # ==========================================================================
  # Workflow Definitions（第一批）
  # 权限码：workflow-definition:view/create/edit/delete/approve/close
  # 状态机：DRAFT → ACTIVE(已发布) → ARCHIVED(已归档)
  # 规则：更新必须携带 version（乐观锁）；删除为软删除；ACTIVE/ARCHIVED 后禁止修改 code/module/steps
  # ==========================================================================
  /api/audit-logs:
    get:
      tags: [Audit Logs]
      summary: List audit logs (paginated, filterable, Sprint 3B Audit 升级)
      operationId: listAuditLogs
      security:
        - bearerAuth: []
      parameters:
        - name: page
          in: query
          schema: { type: integer, default: 1 }
        - name: pageSize
          in: query
          schema: { type: integer, default: 20, maximum: 100 }
        - name: actorId
          in: query
          schema: { type: string }
        - name: entityType
          in: query
          schema: { type: string }
          description: ObjectType
        - name: entityId
          in: query
          schema: { type: string }
          description: ObjectId
        - name: action
          in: query
          schema: { type: string }
        - name: result
          in: query
          schema: { $ref: "#/components/schemas/AuditResult" }
        - name: requestId
          in: query
          schema: { type: string }
        - name: traceId
          in: query
          schema: { type: string }
        - name: from
          in: query
          schema: { type: string, format: date-time }
        - name: to
          in: query
          schema: { type: string, format: date-time }
      responses:
        "200":
          description: Paginated audit logs
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/AuditLogListResponse"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "403":
          $ref: "#/components/responses/Forbidden"

  /api/audit-logs/{id}:
    get:
      tags: [Audit Logs]
      summary: Get audit log detail (with before/after data)
      operationId: getAuditLog
      security:
        - bearerAuth: []
      parameters:
        - name: id
          in: path
          required: true
          schema: { type: string }
      responses:
        "200":
          description: Audit log detail
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/AuditLogResponse"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "403":
          $ref: "#/components/responses/Forbidden"
        "404":
          $ref: "#/components/responses/NotFound"

  /api/menus:
    get:
      tags: [Menu Center]
      summary: List menus (paginated) or menu tree (front-end direct read)
      operationId: listMenus
      security:
        - bearerAuth: []
      parameters:
        - name: page
          in: query
          schema: { type: integer, default: 1 }
        - name: pageSize
          in: query
          schema: { type: integer, default: 20, maximum: 100 }
        - name: groupCode
          in: query
          schema: { type: string }
        - name: tree
          in: query
          schema: { type: boolean, default: false }
          description: true 时返回树形结构
      responses:
        "200":
          description: List or tree（软删除/禁用已过滤）
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/MenuListResponse"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "403":
          $ref: "#/components/responses/Forbidden"
    post:
      tags: [Menu Center]
      summary: Create menu（含 RouteMeta：icon/sort/hidden/cache/externalLink/permission）
      operationId: createMenu
      security:
        - bearerAuth: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/MenuCreate"
      responses:
        "201":
          description: Created
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/MenuResponse"
        "400":
          $ref: "#/components/responses/BadRequest"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "403":
          $ref: "#/components/responses/Forbidden"
        "409":
          $ref: "#/components/responses/Conflict"

  /api/menus/{id}:
    get:
      tags: [Menu Center]
      summary: Get menu detail
      operationId: getMenu
      security:
        - bearerAuth: []
      parameters:
        - name: id
          in: path
          required: true
          schema: { type: string }
      responses:
        "200":
          description: Detail
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/MenuResponse"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "403":
          $ref: "#/components/responses/Forbidden"
        "404":
          $ref: "#/components/responses/NotFound"
    patch:
      tags: [Menu Center]
      summary: Update menu（乐观锁 version）
      operationId: updateMenu
      security:
        - bearerAuth: []
      parameters:
        - name: id
          in: path
          required: true
          schema: { type: string }
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/MenuUpdate"
      responses:
        "200":
          description: Updated（version+1）
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/MenuResponse"
        "400":
          $ref: "#/components/responses/BadRequest"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "403":
          $ref: "#/components/responses/Forbidden"
        "404":
          $ref: "#/components/responses/NotFound"
        "409":
          $ref: "#/components/responses/Conflict"
    delete:
      tags: [Menu Center]
      summary: Soft delete menu (cascade to subtree)
      operationId: deleteMenu
      security:
        - bearerAuth: []
      parameters:
        - name: id
          in: path
          required: true
          schema: { type: string }
      responses:
        "200":
          description: Soft deleted（含子树）
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/DeleteResponse"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "403":
          $ref: "#/components/responses/Forbidden"
        "404":
          $ref: "#/components/responses/NotFound"

  /api/menu-groups:
    get:
      tags: [Menu Center]
      summary: List menu groups (paginated, with menu counts)
      operationId: listMenuGroups
      security:
        - bearerAuth: []
      parameters:
        - name: page
          in: query
          schema: { type: integer, default: 1 }
        - name: pageSize
          in: query
          schema: { type: integer, default: 20, maximum: 100 }
        - name: code
          in: query
          schema: { type: string }
        - name: name
          in: query
          schema: { type: string }
      responses:
        "200":
          description: Paginated list
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/MenuGroupListResponse"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "403":
          $ref: "#/components/responses/Forbidden"
    post:
      tags: [Menu Center]
      summary: Create menu group
      operationId: createMenuGroup
      security:
        - bearerAuth: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/MenuGroupCreate"
      responses:
        "201":
          description: Created
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/MenuGroupResponse"
        "400":
          $ref: "#/components/responses/BadRequest"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "403":
          $ref: "#/components/responses/Forbidden"
        "409":
          $ref: "#/components/responses/Conflict"

  /api/menu-groups/{id}:
    get:
      tags: [Menu Center]
      summary: Get menu group detail (with menus)
      operationId: getMenuGroup
      security:
        - bearerAuth: []
      parameters:
        - name: id
          in: path
          required: true
          schema: { type: string }
      responses:
        "200":
          description: Detail
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/MenuGroupResponse"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "403":
          $ref: "#/components/responses/Forbidden"
        "404":
          $ref: "#/components/responses/NotFound"
    patch:
      tags: [Menu Center]
      summary: Update menu group（乐观锁 version）
      operationId: updateMenuGroup
      security:
        - bearerAuth: []
      parameters:
        - name: id
          in: path
          required: true
          schema: { type: string }
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/MenuGroupUpdate"
      responses:
        "200":
          description: Updated
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/MenuGroupResponse"
        "400":
          $ref: "#/components/responses/BadRequest"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "403":
          $ref: "#/components/responses/Forbidden"
        "404":
          $ref: "#/components/responses/NotFound"
        "409":
          $ref: "#/components/responses/Conflict"
    delete:
      tags: [Menu Center]
      summary: Soft delete menu group (cascade to menus)
      operationId: deleteMenuGroup
      security:
        - bearerAuth: []
      parameters:
        - name: id
          in: path
          required: true
          schema: { type: string }
      responses:
        "200":
          description: Soft deleted（组下菜单级联隐藏）
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/DeleteResponse"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "403":
          $ref: "#/components/responses/Forbidden"
        "404":
          $ref: "#/components/responses/NotFound"

  /api/workflows/definitions:
    get:
      tags: [Workflow Definitions]
      summary: List workflow definitions (paginated, searchable)
      operationId: listWorkflowDefinitions
      security:
        - bearerAuth: []
      parameters:
        - name: page
          in: query
          schema: { type: integer, default: 1 }
        - name: pageSize
          in: query
          schema: { type: integer, default: 20, maximum: 100 }
        - name: code
          in: query
          schema: { type: string }
          description: Fuzzy match on code
        - name: name
          in: query
          schema: { type: string }
          description: Fuzzy match on name
        - name: module
          in: query
          schema: { type: string }
        - name: status
          in: query
          schema: { $ref: "#/components/schemas/WorkflowStatus" }
      responses:
        "200":
          description: Paginated list（软删除已过滤）
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/WorkflowDefinitionListResponse"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "403":
          $ref: "#/components/responses/Forbidden"
    post:
      tags: [Workflow Definitions]
      summary: Create workflow definition (with steps & conditions, transactional)
      operationId: createWorkflowDefinition
      security:
        - bearerAuth: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/WorkflowDefinitionCreate"
      responses:
        "201":
          description: Created（初始 status=DRAFT, version=1）
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/WorkflowDefinitionResponse"
        "400":
          $ref: "#/components/responses/BadRequest"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "403":
          $ref: "#/components/responses/Forbidden"
        "409":
          $ref: "#/components/responses/Conflict"

  /api/workflows/definitions/{id}:
    get:
      tags: [Workflow Definitions]
      summary: Get workflow definition detail (with steps & conditions)
      operationId: getWorkflowDefinition
      security:
        - bearerAuth: []
      parameters:
        - name: id
          in: path
          required: true
          schema: { type: string }
      responses:
        "200":
          description: Detail
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/WorkflowDefinitionResponse"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "403":
          $ref: "#/components/responses/Forbidden"
        "404":
          $ref: "#/components/responses/NotFound"
    patch:
      tags: [Workflow Definitions]
      summary: Update workflow definition（乐观锁 version；发布后禁止修改关键结构）
      operationId: updateWorkflowDefinition
      security:
        - bearerAuth: []
      parameters:
        - name: id
          in: path
          required: true
          schema: { type: string }
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/WorkflowDefinitionUpdate"
      responses:
        "200":
          description: Updated（version 自动 +1）
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/WorkflowDefinitionResponse"
        "400":
          $ref: "#/components/responses/BadRequest"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "403":
          $ref: "#/components/responses/Forbidden"
        "404":
          $ref: "#/components/responses/NotFound"
        "409":
          $ref: "#/components/responses/Conflict"
    delete:
      tags: [Workflow Definitions]
      summary: Soft delete workflow definition
      operationId: deleteWorkflowDefinition
      security:
        - bearerAuth: []
      parameters:
        - name: id
          in: path
          required: true
          schema: { type: string }
      responses:
        "200":
          description: Soft deleted（deletedAt 写入，不物理删除）
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/DeleteResponse"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "403":
          $ref: "#/components/responses/Forbidden"
        "404":
          $ref: "#/components/responses/NotFound"

  /api/workflows/definitions/{id}/publish:
    post:
      tags: [Workflow Definitions]
      summary: Publish workflow definition（DRAFT → ACTIVE）
      operationId: publishWorkflowDefinition
      security:
        - bearerAuth: []
      parameters:
        - name: id
          in: path
          required: true
          schema: { type: string }
      responses:
        "200":
          description: Published（要求至少一个步骤；version +1）
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/WorkflowStatusChangeResponse"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "403":
          $ref: "#/components/responses/Forbidden"
        "404":
          $ref: "#/components/responses/NotFound"
        "409":
          $ref: "#/components/responses/Conflict"

  /api/workflows/definitions/{id}/archive:
    post:
      tags: [Workflow Definitions]
      summary: Archive workflow definition（ACTIVE → ARCHIVED）
      operationId: archiveWorkflowDefinition
      security:
        - bearerAuth: []
      parameters:
        - name: id
          in: path
          required: true
          schema: { type: string }
      responses:
        "200":
          description: Archived（历史实例不受影响；version +1）
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/WorkflowStatusChangeResponse"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "403":
          $ref: "#/components/responses/Forbidden"
        "404":
          $ref: "#/components/responses/NotFound"
        "409":
          $ref: "#/components/responses/Conflict"

  # ==========================================================================
  # Workflow Instances（第二批）
  # 权限码：workflow-instance:view/create/approve
  # 统一动作：SUBMIT/APPROVE/REJECT/RETURN/TRANSFER/DELEGATE/WITHDRAW/TERMINATE/COMMENT
  # ==========================================================================
  /api/workflows/instances:
    get:
      tags: [Workflow Instances]
      summary: List workflow instances (paginated, filterable)
      operationId: listWorkflowInstances
      security:
        - bearerAuth: []
      parameters:
        - name: page
          in: query
          schema: { type: integer, default: 1 }
        - name: pageSize
          in: query
          schema: { type: integer, default: 20, maximum: 100 }
        - name: businessType
          in: query
          schema: { type: string }
        - name: businessId
          in: query
          schema: { type: string }
        - name: status
          in: query
          schema: { $ref: "#/components/schemas/WorkflowInstanceStatus" }
        - name: definitionId
          in: query
          schema: { type: string }
        - name: startedBy
          in: query
          schema: { type: string }
      responses:
        "200":
          description: Paginated list（软删除已过滤）
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/WorkflowInstanceListResponse"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "403":
          $ref: "#/components/responses/Forbidden"
    post:
      tags: [Workflow Instances]
      summary: Create workflow instance from an ACTIVE definition
      operationId: createWorkflowInstance
      security:
        - bearerAuth: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/WorkflowInstanceCreate"
      responses:
        "201":
          description: Created（status=RUNNING，自动生成 SUBMIT 动作与历史，并创建第一步审批人）
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/WorkflowInstanceResponse"
        "400":
          $ref: "#/components/responses/BadRequest"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "403":
          $ref: "#/components/responses/Forbidden"
        "404":
          $ref: "#/components/responses/NotFound"
        "409":
          $ref: "#/components/responses/Conflict"

  /api/workflows/instances/{id}:
    get:
      tags: [Workflow Instances]
      summary: Get workflow instance detail (definition/approvers/actions/history)
      operationId: getWorkflowInstance
      security:
        - bearerAuth: []
      parameters:
        - name: id
          in: path
          required: true
          schema: { type: string }
      responses:
        "200":
          description: Detail
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/WorkflowInstanceResponse"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "403":
          $ref: "#/components/responses/Forbidden"
        "404":
          $ref: "#/components/responses/NotFound"

  /api/workflows/instances/{id}/actions:
    post:
      tags: [Workflow Instances]
      summary: Execute a unified workflow action（状态机事务）
      operationId: executeWorkflowAction
      security:
        - bearerAuth: []
      parameters:
        - name: id
          in: path
          required: true
          schema: { type: string }
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/WorkflowActionRequest"
      description: |
        统一动作范围（WorkflowActionType）：
        SUBMIT / APPROVE / REJECT / RETURN / TRANSFER / DELEGATE / WITHDRAW / TERMINATE / COMMENT
        - APPROVE/REJECT/TRANSFER/DELEGATE 仅当前步骤待办人可执行
        - WITHDRAW 仅发起人可执行
        - TRANSFER/DELEGATE 必须携带 targetUserId
        - 终态实例（COMPLETED/REJECTED/TERMINATED/WITHDRAWN）仅允许 COMMENT
        - 每次动作写入 WorkflowAction + WorkflowHistory（含 IP/设备/浏览器/耗时）
      responses:
        "200":
          description: Action executed
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/WorkflowActionResult"
        "400":
          $ref: "#/components/responses/BadRequest"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "403":
          $ref: "#/components/responses/Forbidden"
        "404":
          $ref: "#/components/responses/NotFound"
        "409":
          $ref: "#/components/responses/Conflict"

  /api/workflows/instances/{id}/history:
    get:
      tags: [Workflow Instances]
      summary: List instance history (paginated)
      operationId: listWorkflowInstanceHistory
      security:
        - bearerAuth: []
      parameters:
        - name: id
          in: path
          required: true
          schema: { type: string }
        - name: page
          in: query
          schema: { type: integer, default: 1 }
        - name: pageSize
          in: query
          schema: { type: integer, default: 20, maximum: 100 }
      responses:
        "200":
          description: Paginated history
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/WorkflowHistoryListResponse"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "403":
          $ref: "#/components/responses/Forbidden"
        "404":
          $ref: "#/components/responses/NotFound"

  # ==========================================================================
  # Approver Groups（第三批）
  # 权限码：approver-group:view/create/edit/delete
  # code 唯一；成员 memberUserIds 全量替换；删除为软删除；更新需 version
  # ==========================================================================
  /api/approver-groups:
    get:
      tags: [Approver Groups]
      summary: List approver groups (paginated)
      operationId: listApproverGroups
      security:
        - bearerAuth: []
      parameters:
        - name: page
          in: query
          schema: { type: integer, default: 1 }
        - name: pageSize
          in: query
          schema: { type: integer, default: 20, maximum: 100 }
        - name: code
          in: query
          schema: { type: string }
        - name: name
          in: query
          schema: { type: string }
