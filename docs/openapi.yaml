        salesOrderId: { type: string }
        revisionNo: { type: integer, description: 系统自动递增（唯一版本载体，ADR-0017） }
        revisionStatus: { $ref: "#/components/schemas/SalesOrderRevisionStatus" }
        changeReason: { type: string }
        snapshotData: { type: object, description: 系统生成的当前状态快照（金额 Decimal 字符串） }
        createdById: { type: [string, "null"] }
        updatedById: { type: [string, "null"] }
        deletedAt: { type: [string, "null"], format: date-time }
        isActive: { type: boolean }

    SalesOrderSnapshot:
