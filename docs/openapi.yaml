      summary: List receipt snapshots (read-only, desc; snapshotType CREATED/ALLOCATED/VOIDED/REVERSED)
      description: 快照历史（generatedAt desc；只读——仅固化节点生成：CREATED / ALLOCATED / VOIDED / REVERSED）。
      operationId: listReceiptSnapshots
