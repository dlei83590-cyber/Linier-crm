    # ==========================================================================
    # Sprint 4C Delivery Foundation（Enums + Models + Requests/Responses）
    # ==========================================================================
    DeliveryStatus:
      type: string
      enum: [DRAFT, READY, DISPATCHED, DELIVERED, COMPLETED, CANCELLED]

    DeliverySnapshotType:
      type: string
      description: 快照类型（仅固化节点生成，只读）；COMPLETED 本阶段仅枚举不提供 /complete
      enum: [CREATED, READY, DISPATCHED, DELIVERED, CANCELLED]

    DeliveryRevisionStatus:
      type: string
      enum: [DRAFT, SUBMITTED, APPROVED, SUPERSEDED]

    DeliveryPodStatus:
      type: string
      description: POD（Proof of Delivery）签收状态；原始文件走 File Center（businessType=delivery，attachmentType=POD）
      enum: [PENDING, RECEIVED, WAIVED]

    Delivery:
      type: object
      required: [id, code, salesOrderId, customerId, status, version]
      properties:
        id: { type: string }
        code: { type: string, description: 单据编号（DocumentSequence docType=DELIVERY_ORDER，前缀 DO，位数 6） }
        salesOrderId: { type: string, description: "来源销售订单（NOT NULL；Direct Delivery 禁止，唯一入口 POST /api/sales-orders/{id}/deliveries）" }
        customerId: { type: string, description: 收货客户（继承 SalesOrder.customerId） }
        status: { $ref: "#/components/schemas/DeliveryStatus" }
        deliveryDate: { type: [string, "null"], format: date-time, description: 交付日期（计划/实际） }
        expectedArrivalDate: { type: [string, "null"], format: date-time }
        carrier: { type: [string, "null"], description: 承运方（物流公司/车次/单号） }
        trackingNo: { type: [string, "null"] }
        podStatus: { $ref: "#/components/schemas/DeliveryPodStatus" }
        podReceivedAt: { type: [string, "null"], format: date-time, description: 签收时间（RECEIVED 时回填） }
        podConfirmedById: { type: [string, "null"], description: 签收确认人（RECEIVED 时回填） }
        remark: { type: [string, "null"] }
        version: { type: integer, description: 乐观锁版本 }
        createdById: { type: [string, "null"] }
        updatedById: { type: [string, "null"] }
        deletedAt: { type: [string, "null"], format: date-time }
        isActive: { type: boolean }

    DeliveryLine:
      type: object
      required: [id, deliveryId, description, quantity, orderedQty, deliveredQty, version]
      properties:
        id: { type: string }
        deliveryId: { type: string }
        sourceSalesOrderLineId: { type: [string, "null"], description: 溯源 → SalesOrderLine（SalesOrderLine 软删后 SetNull） }
        lineNo: { type: integer, description: 行号（10/20/30/40 步进） }
        itemId: { type: [string, "null"] }
        description: { type: string, description: 描述（快照） }
        quantity: { type: number, description: 本次实际交付量（正数；防超交由事务层动态校验） }
        uomId: { type: [string, "null"] }
        orderedQty: { type: number, description: 订单行订购量快照（只读投影，禁止手工填写） }
        deliveredQty: { type: number, description: 已实际交付量快照（仅 DELIVERED/COMPLETED 累计；只读投影） }
        version: { type: integer }
        createdById: { type: [string, "null"] }
        updatedById: { type: [string, "null"] }
        deletedAt: { type: [string, "null"], format: date-time }
        isActive: { type: boolean }

    DeliveryRevision:
      type: object
      required: [id, deliveryId, revisionNo, changeReason]
      properties:
        id: { type: string }
        deliveryId: { type: string }
        revisionNo: { type: integer, description: 系统自动递增（唯一版本载体） }
        revisionStatus: { $ref: "#/components/schemas/DeliveryRevisionStatus" }
        changeReason: { type: string }
        snapshotData: { type: object, description: 系统生成的当前状态快照（金额 Decimal 字符串，禁止 toNumber） }
        createdById: { type: [string, "null"] }
        updatedById: { type: [string, "null"] }
        deletedAt: { type: [string, "null"], format: date-time }
        isActive: { type: boolean }

    DeliverySnapshot:
      type: object
      required: [id, deliveryId, snapshotType, revisionNo]
      properties:
        id: { type: string }
        deliveryId: { type: string }
        snapshotType: { $ref: "#/components/schemas/DeliverySnapshotType" }
        revisionNo: { type: integer, description: 快照对应的修订号 }
        snapshotData: { type: object, description: 完整快照（Header + Lines + sourceSalesOrderLineId 集合；Decimal 字符串，禁止 toNumber） }
        generatedById: { type: [string, "null"] }
        generatedAt: { type: [string, "null"], format: date-time }
        createdById: { type: [string, "null"] }
        updatedById: { type: [string, "null"] }
        deletedAt: { type: [string, "null"], format: date-time }
        isActive: { type: boolean }

    DeliveryCreate:
      type: object
      properties:
        deliveryDate: { type: [string, "null"], format: date-time, description: 计划交付日期（默认 now） }
        expectedArrivalDate: { type: [string, "null"], format: date-time }
        carrier: { type: [string, "null"], maxLength: 100 }
        trackingNo: { type: [string, "null"], maxLength: 100 }
        remark: { type: [string, "null"], maxLength: 1000 }
        lines:
          type: array
          description: 显式指定交付行（从 SO Line 选择，不默认复制全部剩余行；适合分批发货）
          items:
            type: object
            required: [sourceSalesOrderLineId, quantity]
            properties:
              sourceSalesOrderLineId: { type: string }
              quantity: { type: number, exclusiveMinimum: 0 }
        changeReason: { type: string, maxLength: 500 }

    DeliveryUpdate:
      type: object
      required: [version]
      properties:
        deliveryDate: { type: [string, "null"], format: date-time }
        expectedArrivalDate: { type: [string, "null"], format: date-time }
        carrier: { type: [string, "null"], maxLength: 100 }
        trackingNo: { type: [string, "null"], maxLength: 100 }
        remark: { type: [string, "null"], maxLength: 1000 }
        changeReason: { type: string, maxLength: 500 }
        version: { type: integer, description: 乐观锁版本（冲突返回 409 VERSION_CONFLICT） }
        # 不可改 salesOrderId/customerId/status（来源与状态由系统管理）

    DeliveryLineUpdate:
      type: object
      required: [version]
      properties:
        quantity: { type: number, exclusiveMinimum: 0, description: 数量变更 → 动态校验 availableQty 防超交（409 DELIVERY_QUANTITY_EXCEEDED） }
        description: { type: string, maxLength: 500 }
        uomId: { type: [string, "null"] }
        lineNo: { type: integer }
        changeReason: { type: string, maxLength: 500 }
        version: { type: integer }
        # sourceSalesOrderLineId 溯源永不清除；deliveredQty/orderedQty 只读投影不可写

    DeliveryActionRequest:
      type: object
      properties:
        changeReason: { type: string, maxLength: 500 }

    DeliveryDispatchRequest:
      type: object
      properties:
        carrier: { type: [string, "null"], maxLength: 100 }
        trackingNo: { type: [string, "null"], maxLength: 100 }
        expectedArrivalDate: { type: [string, "null"], format: date-time }
        changeReason: { type: string, maxLength: 500 }

    DeliveryConfirmRequest:
      type: object
      properties:
        podStatus: { type: string, enum: [RECEIVED, WAIVED], description: POD 门禁：RECEIVED 回填签收投影 / WAIVED 豁免；PENDING 拒绝（409） }
        podReceivedAt: { type: [string, "null"], format: date-time }
        changeReason: { type: string, maxLength: 500 }

    DeliveryResponse:
      type: object
      required: [success, data]
      properties:
        success: { type: boolean, example: true }
        data: { $ref: "#/components/schemas/Delivery" }

    DeliveryListResponse:
      type: object
      required: [success, data]
      properties:
        success: { type: boolean, example: true }
        data:
          type: array
          items: { $ref: "#/components/schemas/Delivery" }

    DeliveryLineResponse:
      type: object
      required: [success, data]
      properties:
        success: { type: boolean, example: true }
        data: { $ref: "#/components/schemas/DeliveryLine" }

    DeliveryLineListResponse:
      type: object
      required: [success, data]
      properties:
        success: { type: boolean, example: true }
        data:
          type: array
          items: { $ref: "#/components/schemas/DeliveryLine" }

    DeliveryActionResponse:
      type: object
      required: [success, data]
      properties:
        success: { type: boolean, example: true }
        data:
          type: object
          properties:
            id: { type: string }
            status: { $ref: "#/components/schemas/DeliveryStatus" }
            podStatus: { $ref: "#/components/schemas/DeliveryPodStatus" }
            salesOrder:
              type: object
              description: confirm-delivery 聚合回写后的 SO 状态投影
              properties:
                id: { type: string }
                status: { $ref: "#/components/schemas/SalesOrderStatus" }
                deliveredAt: { type: [string, "null"], format: date-time }

    DeliveryErrorCodes:
      type: string
      description: |
        Delivery 领域错误码（与实现 errors.ts 一致）：
        - DELIVERY_NOT_FOUND（404）交付单不存在
        - DELIVERY_LINE_NOT_FOUND（404）交付行不存在
        - DELIVERY_INVALID_STATE（409）状态不允许（ready/dispatch/confirm/cancel 状态机校验；含 POD 未确认与重复确认场景）
        - DELIVERY_QUANTITY_EXCEEDED（409）超交（请求数量 > availableQty）
        - DELIVERY_SOURCE_LINE_INVALID（400）交付行来源销售订单行无效或已删除
        - SALES_ORDER_NOT_DELIVERABLE（409）来源 SO 状态不允许创建交付（仅 CONFIRMED/PARTIALLY_DELIVERED）
        - VERSION_CONFLICT（409）乐观锁版本冲突
        语义映射（文档层面补充，实现统一以 DELIVERY_INVALID_STATE 表达）：
        - DELIVERY_POD_REQUIRED → POD 门禁失败（podStatus ∉ {RECEIVED, WAIVED}），实现返回 409 DELIVERY_INVALID_STATE
        - DELIVERY_ALREADY_CONFIRMED → 重复 confirm（非 DISPATCHED），实现返回 409 DELIVERY_INVALID_STATE
        - DELIVERY_STATUS_INVALID → 状态机不允许的流转，实现返回 409 DELIVERY_INVALID_STATE

    # ==========================================================================
    # Sprint 4D Invoice Foundation（Enums + Models + Requests/Responses）
    # ==========================================================================
    InvoiceStatus:
      type: string
      enum: [DRAFT, ISSUED, PARTIALLY_PAID, PAID, CANCELLED]
      description: DRAFT 草稿（可编辑头）/ ISSUED 已开票（取号后不可直接取消，走 Credit Note）/ PARTIALLY_PAID+PAID 4E 回写投影 / CANCELLED 已取消（仅 DRAFT 可取消）

    InvoiceSnapshotType:
      type: string
      description: 快照类型（仅固化节点生成，只读）；无 APPROVED（审批终态只回写投影）
      enum: [CREATED, ISSUED, CANCELLED]

    InvoiceRevisionStatus:
      type: string
      enum: [DRAFT, SUBMITTED, APPROVED, SUPERSEDED]

    InvoiceLineStatus:
      type: string
      enum: [ACTIVE, CANCELLED]

    Invoice:
      type: object
      required: [id, deliveryId, salesOrderId, customerId, status, invoiceDate, currency, version]
      properties:
        id: { type: string }
        code: { type: [string, "null"], description: 单据编号（CTO Review 必改①：DRAFT 不占号 code=NULL，仅 ISSUE 时 DocumentSequence 取号 INV-2026-000123） }
        deliveryId: { type: string, description: "来源交付单（NOT NULL；唯一入口 POST /api/deliveries/{id}/invoice；Direct Invoice 禁止）" }
        salesOrderId: { type: string, description: 冗余投影（经 Delivery 溯源 SalesOrder；便于 AR/对账） }
        customerId: { type: string, description: 开票客户（继承 Delivery.customerId） }
        status: { $ref: "#/components/schemas/InvoiceStatus" }
        invoiceDate: { type: string, format: date-time, description: 开票日期 }
        dueDate: { type: [string, "null"], format: date-time, description: 到期日（4E AR 使用；PATCH 可编辑，变更触发重审） }
        currency: { type: string, description: 币种（继承 SalesOrder；Consolidated 合并校验需一致） }
        taxProfileId: { type: [string, "null"], description: 税率档案（继承 SalesOrder；Consolidated 合并校验需一致） }
        paymentTerm: { type: [string, "null"], description: 付款条款（4E AR 使用；PATCH 可编辑，变更触发重审；Consolidated 合并校验需一致） }
        subtotal: { type: number, description: 未税合计（财务事实，直接复制自 DeliveryLine 快照；禁止重新计算） }
        taxAmount: { type: number, description: 税额 }
        invoiceTotal: { type: number, description: 含税合计 }
        paidAmount: { type: number, description: 已收款（Sprint 4E 回写；本阶段固定 0） }
        balanceAmount: { type: number, description: 应收余额 = invoiceTotal - paidAmount }
        remark: { type: [string, "null"] }
        workflowInstanceId: { type: [string, "null"], description: 审批实例（Workflow 为唯一事实源；不建 InvoiceApproval 表） }
        approvalStatus: { type: string, description: 审批投影（DRAFT/PENDING/APPROVED/REJECTED） }
        approvedAt: { type: [string, "null"], format: date-time }
        approvedById: { type: [string, "null"] }
        version: { type: integer, description: 乐观锁版本 }
        createdById: { type: [string, "null"] }
        updatedById: { type: [string, "null"] }
        deletedAt: { type: [string, "null"], format: date-time }
        isActive: { type: boolean }

    InvoiceLine:
      type: object
      required: [id, invoiceId, description, quantity, unitPrice, lineAmount, version]
      properties:
        id: { type: string }
        invoiceId: { type: string }
        sourceDeliveryLineId: { type: [string, "null"], description: 溯源 → DeliveryLine（DeliveryLine 软删后 SetNull） }
        lineNo: { type: integer, description: 行号（10/20/30/40 步进） }
        itemId: { type: [string, "null"] }
        description: { type: string, description: 描述（快照，复制自 DeliveryLine.description） }
        quantity: { type: number, description: 开票数量（<= DeliveryLine.quantity 已交付量，防超开票） }
        uomId: { type: [string, "null"] }
        priceSnapshotId: { type: [string, "null"], description: 直接复制 SalesOrderLine.priceSnapshotId（四段溯源链取价） }
        unitPrice: { type: number, description: 单价快照（复制，不重算） }
        discountRate: { type: number, description: 折扣率快照（复制） }
        lineAmount: { type: number, description: 行未税金额（复制计算值） }
        taxAmount: { type: number, description: 行税额（复制） }
        totalAmount: { type: number, description: 行含税金额（复制） }
        version: { type: integer }
        createdById: { type: [string, "null"] }
        updatedById: { type: [string, "null"] }
        deletedAt: { type: [string, "null"], format: date-time }
        isActive: { type: boolean }

    InvoiceRevision:
      type: object
      required: [id, invoiceId, revisionNo, changeReason]
      properties:
        id: { type: string }
        invoiceId: { type: string }
        revisionNo: { type: integer, description: 系统自动递增（唯一版本载体） }
        revisionStatus: { $ref: "#/components/schemas/InvoiceRevisionStatus" }
        changeReason: { type: string }
        snapshotData: { type: object, description: 系统生成的当前状态快照（金额 Decimal 字符串，禁止 toNumber） }
        createdById: { type: [string, "null"] }
        updatedById: { type: [string, "null"] }
        deletedAt: { type: [string, "null"], format: date-time }
        isActive: { type: boolean }

    InvoiceSnapshot:
      type: object
      required: [id, invoiceId, snapshotType, revisionNo]
      properties:
        id: { type: string }
        invoiceId: { type: string }
        snapshotType: { $ref: "#/components/schemas/InvoiceSnapshotType" }
        revisionNo: { type: integer, description: 快照对应的修订号 }
        snapshotData: { type: object, description: 完整快照（Header + Lines + sourceDeliveryLineId 集合；Decimal 字符串，禁止 toNumber）；ISSUED 快照含 issuedAt/issuedById（schema 无 issuedAt/issuedById 列，记 snapshotData） }
        taxProfileId: { type: [string, "null"], description: CTO Review 必改②：税率档案快照 }
        taxRate: { type: [number, "null"], description: 税率快照 }
        sstNo: { type: [string, "null"], description: SST 注册号快照（销售与服务税登记号） }
        currencyRate: { type: [number, "null"], description: 汇率快照 }
        exchangeRate: { type: [number, "null"], description: 汇率快照（与 currencyRate 同值冗余） }
        generatedById: { type: [string, "null"] }
        generatedAt: { type: [string, "null"], format: date-time }
        createdById: { type: [string, "null"] }
        updatedById: { type: [string, "null"] }
        deletedAt: { type: [string, "null"], format: date-time }
        isActive: { type: boolean }

    InvoiceCreate:
      type: object
      required: [lines]
      properties:
        deliveryIds: { type: array, items: { type: string }, description: Consolidated Invoice 附加 Delivery 来源（与 primaryDeliveryId 的 Customer/Currency/TaxProfile/PaymentTerm 必须一致，否则 409 INVOICE_SOURCE_NOT_COMPATIBLE） }
        lines:
          type: array
          minItems: 1
          description: Partial Billing：开票行（deliveryLineId + quantity；quantity > 0 且 <= remainingInvoiceQty，否则 409 INVOICE_QUANTITY_EXCEEDED）
          items:
            type: object
            required: [deliveryLineId, quantity]
            properties:
              deliveryLineId: { type: string }
              quantity: { type: number, exclusiveMinimum: 0 }
        invoiceDate: { type: string, format: date-time, description: 开票日期（默认 now） }
        dueDate: { type: [string, "null"], format: date-time }
        remark: { type: [string, "null"], maxLength: 1000 }
        changeReason: { type: string, maxLength: 500 }

    InvoiceUpdate:
      type: object
      required: [version]
      description: 仅 DRAFT 可编辑；只允许非财务字段 remark/dueDate/paymentTerm（schema 无 reference 列）；金额/数量/code/status 禁止 PATCH
      properties:
        remark: { type: [string, "null"], maxLength: 1000 }
        dueDate: { type: [string, "null"], format: date-time }
        paymentTerm: { type: [string, "null"], maxLength: 50 }
        changeReason: { type: string, maxLength: 500 }
        version: { type: integer, minimum: 1 }

    InvoiceActionRequest:
      type: object
      properties:
        changeReason: { type: string, maxLength: 500 }

    InvoiceResponse:
      type: object
      required: [success, data]
      properties:
        success: { type: boolean, example: true }
        data: { $ref: "#/components/schemas/Invoice" }

    InvoiceListResponse:
      type: object
      required: [success, data]
      properties:
        success: { type: boolean, example: true }
        data:
          type: array
          items: { $ref: "#/components/schemas/Invoice" }

    InvoiceLineResponse:
      type: object
      required: [success, data]
      properties:
        success: { type: boolean, example: true }
        data: { $ref: "#/components/schemas/InvoiceLine" }

    InvoiceLineListResponse:
      type: object
      required: [success, data]
      properties:
        success: { type: boolean, example: true }
        data:
          type: array
          items: { $ref: "#/components/schemas/InvoiceLine" }

    InvoiceRevisionListResponse:
      type: object
      required: [success, data]
      properties:
        success: { type: boolean, example: true }
        data:
          type: array
          items: { $ref: "#/components/schemas/InvoiceRevision" }

    InvoiceSnapshotListResponse:
      type: object
      required: [success, data]
      properties:
        success: { type: boolean, example: true }
        data:
          type: array
          items: { $ref: "#/components/schemas/InvoiceSnapshot" }

    InvoiceActionResponse:
      type: object
      required: [success, data]
      properties:
        success: { type: boolean, example: true }
        data:
          type: object
          properties:
            invoice:
              type: object
              properties:
                id: { type: string }
                status: { $ref: "#/components/schemas/InvoiceStatus" }
            code: { type: [string, "null"], description: issue 成功时返回取号后的编号（INV-2026-000123） }
            issuedAt: { type: [string, "null"], format: date-time, description: issue 成功时返回（记 ISSUED 快照 snapshotData） }

    InvoiceErrorCodes:
      type: string
      description: |
        Invoice 领域错误码（与实现 errors.ts 一致）：
        - INVOICE_NOT_FOUND（404）发票不存在
        - INVOICE_INVALID_STATE（409）状态不允许（仅 DELIVERED 可开票 / 仅 DRAFT 可编辑/取消 / 审批门禁未通过等）
        - INVOICE_LINE_NOT_FOUND（404）开票行（DeliveryLine）不存在
        - INVOICE_QUANTITY_EXCEEDED（409）超开票（请求数量 > remainingInvoiceQty）
        - INVOICE_SOURCE_NOT_COMPATIBLE（409）Consolidated Invoice 来源财务属性不一致（Customer/Currency/TaxProfile/PaymentTerm）
        - INVOICE_WORKFLOW_FAILED（409）审批流程定义不存在或未发布（INVOICE_APPROVAL），发票变更已回滚
        - DELIVERY_SOURCE_LINE_INVALID（400）交付行来源销售订单行无效或已删除
        - VERSION_CONFLICT（409）乐观锁版本冲突

    # ==========================================================================
    # Sprint 4E-1 Accounts Receivable Foundation（Enums + Models + Responses）
    # ==========================================================================
    AccountsReceivableStatus:
      type: string
      enum: [OPEN, PARTIALLY_PAID, PAID, OVERDUE, CLOSED]
      description: 余额生命周期；OVERDUE 惰性判定（CTO 拍板②：effectiveStatus Projection，非数据库真实状态——status ∈ {OPEN,PARTIALLY_PAID} 且 dueDate < now）

    AccountsReceivableSnapshotType:
      type: string
      enum: [CREATED, PARTIALLY_PAID, PAID, ADJUSTED, WRITTEN_OFF, CLOSED]
      description: 快照类型（仅固化节点生成，只读）

    AccountsReceivableSnapshotSource:
      type: string
      enum: [ISSUE, PAYMENT, WRITE_OFF, ADJUSTMENT, MANUAL]
      description: CTO Review 必改②：快照来源枚举——Receipt/CN/DN/WriteOff 全部可复用

    AccountsReceivable:
      type: object
      required: [id, invoiceId, customerId, currency, originalAmount, balanceAmount, status, version]
      properties:
        id: { type: string }
        invoiceId: { type: string, description: "1:1 绑定 Invoice（单据事实源）；有 AR 的发票禁止删除（必改③）" }
        customerId: { type: string, description: 客户（继承 Invoice.customerId；对账用） }
        currency: { type: string, description: 币种（继承 Invoice.currency） }
        originalAmount: { type: number, description: 原始金额（= Invoice.invoiceTotal，AR 创建时复制，不重算） }
        adjustedAmount: { type: number, description: 调整金额（4E-3 CN/DN 聚合，可正可负） }
        paidAmount: { type: number, description: 已收款（4E-2 Receipt 回写） }
        writeOffAmount: { type: number, description: 坏账核销金额（4E-2 WriteOff 回写） }
        balanceAmount: { type: number, description: 余额唯一口径 = originalAmount + adjustedAmount - paidAmount - writeOffAmount（服务端唯一计算，前端禁止 PATCH） }
        status: { $ref: "#/components/schemas/AccountsReceivableStatus" }
        effectiveStatus: { $ref: "#/components/schemas/AccountsReceivableStatus", description: 惰性投影（OVERDUE 判定；CTO 拍板②） }
        isOverdue: { type: boolean, description: "惰性投影：status∈{OPEN,PARTIALLY_PAID} 且 dueDate<now" }
        effectiveAgingBucket: { type: [string, "null"], description: "惰性投影：0-30/31-60/61-90/90+（CTO 必改①：不存库，读取时动态计算，只依赖 today/dueDate/balance）" }
        dueDate: { type: [string, "null"], format: date-time, description: 到期日（继承 Invoice.dueDate；逾期判定基准） }
        lastPaymentAt: { type: [string, "null"], format: date-time, description: 最近收款时间（4E-2 回写） }
        version: { type: integer, description: 乐观锁版本 }
        createdById: { type: [string, "null"] }
        updatedById: { type: [string, "null"] }
        deletedAt: { type: [string, "null"], format: date-time }
        isActive: { type: boolean }

    AccountsReceivableRevision:
      type: object
      required: [id, accountsReceivableId, revisionNo, changeReason]
      properties:
        id: { type: string }
        accountsReceivableId: { type: string }
        revisionNo: { type: integer, description: 系统自动递增（唯一版本载体） }
        changeReason: { type: string }
        snapshotData: { type: object, description: 当前余额状态快照（金额 Decimal 字符串，禁止 toNumber） }
        createdById: { type: [string, "null"] }
        updatedById: { type: [string, "null"] }
        deletedAt: { type: [string, "null"], format: date-time }
        isActive: { type: boolean }

    AccountsReceivableSnapshot:
      type: object
      required: [id, accountsReceivableId, snapshotType, snapshotSource, revisionNo]
      properties:
        id: { type: string }
        accountsReceivableId: { type: string }
        snapshotType: { $ref: "#/components/schemas/AccountsReceivableSnapshotType" }
        snapshotSource: { $ref: "#/components/schemas/AccountsReceivableSnapshotSource", description: CTO 必改②：来源枚举 }
        revisionNo: { type: integer }
        snapshotData: { type: object, description: 完整快照（Header + 四金额输入 + balanceAmount + customerId/currency/dueDate；Decimal 字符串） }
        generatedById: { type: [string, "null"] }
        generatedAt: { type: [string, "null"], format: date-time }
        createdById: { type: [string, "null"] }
        updatedById: { type: [string, "null"] }
        deletedAt: { type: [string, "null"], format: date-time }
        isActive: { type: boolean }

    AccountsReceivableResponse:
      type: object
      required: [success, data]
      properties:
        success: { type: boolean, example: true }
        data: { $ref: "#/components/schemas/AccountsReceivable" }

    AccountsReceivableListResponse:
      type: object
      required: [success, data]
      properties:
        success: { type: boolean, example: true }
        data:
          type: array
          items: { $ref: "#/components/schemas/AccountsReceivable" }

    AccountsReceivableRevisionListResponse:
      type: object
      required: [success, data]
      properties:
        success: { type: boolean, example: true }
        data:
          type: array
          items: { $ref: "#/components/schemas/AccountsReceivableRevision" }

    AccountsReceivableSnapshotListResponse:
      type: object
      required: [success, data]
      properties:
        success: { type: boolean, example: true }
        data:
          type: array
          items: { $ref: "#/components/schemas/AccountsReceivableSnapshot" }

    AccountsReceivableAgingResponse:
      type: object
      required: [success, data]
      properties:
        success: { type: boolean, example: true }
        data:
          type: object
          properties:
            asOf: { type: string, format: date-time }
            buckets:
              type: object
              description: 账龄区间（0-30/31-60/61-90/90+ + settled 已清）聚合
              properties:
                "0-30": { $ref: "#/components/schemas/AgingBucketSummary" }
                "31-60": { $ref: "#/components/schemas/AgingBucketSummary" }
                "61-90": { $ref: "#/components/schemas/AgingBucketSummary" }
                "90+": { $ref: "#/components/schemas/AgingBucketSummary" }
                settled: { $ref: "#/components/schemas/AgingBucketSummary" }
            totalRecords: { type: integer }
            totalBalance: { type: number }

    AgingBucketSummary:
      type: object
      properties:
        count: { type: integer, description: 记录数 }
        balance: { type: number, description: 余额合计 }

    AccountsReceivableErrorCodes:
      type: string
      description: |
        Accounts Receivable 领域错误码（与实现 errors.ts 一致）：
        - ACCOUNTS_RECEIVABLE_NOT_FOUND（404）应收记录不存在
        - VERSION_CONFLICT（409）乐观锁版本冲突（预留，4E-1 无 PATCH）
        注意：AR 由 Invoice ISSUED 自动创建（拍板①），无 POST/PATCH 创建与金额修改端点；
        金额只能由 4E-2 Receipt / WriteOff、4E-3 CN/DN 动作或下游事实表驱动（CTO 锁定）。

    # ==========================================================================
    # Sprint 4E-2 Receipt & Payment Allocation Foundation（Enums + Models + Requests + Responses）
    # 边界锁死（CTO Design Review 97/100 + 实施锁定，Final Review 检查点）：
    # ① Receipt 创建 ≠ Allocation；② Allocation 同 Customer / 同 Currency（409，禁跨币种）；
    # ③ Reversal ≠ Credit Note（Allocation Reversal 解除核销留痕，不删除原记录；CN 属 4E-3）；
    # ④ WriteOff Approval ≠ Apply（Apply 是唯一修改 AR.writeOffAmount/balanceAmount 的入口）；
    # ⑤ WriteOff 只减 Invoice.balanceAmount 投影，绝不增加 Invoice.paidAmount（WriteOff ≠ Payment）。
    # ==========================================================================
    ReceiptStatus:
      type: string
      enum: [UNALLOCATED, PARTIALLY_ALLOCATED, FULLY_ALLOCATED, VOIDED]
      description: 收款状态（受控投影——拍板②：只能由 allocation/reversal/void 事务更新，禁止 PATCH；前三个可由金额动态推导：unallocatedAmount>0 / =0）

    PaymentMethod:
      type: string
      enum: [BANK_TRANSFER, CHEQUE, CASH, CARD, OTHER]
      description: 收款方式

    ReceiptSnapshotType:
      type: string
      enum: [CREATED, ALLOCATED, VOIDED, REVERSED]
      description: 收款快照类型（仅固化节点生成，只读）

    Receipt:
      type: object
      required: [id, code, customerId, currency, amount, allocatedAmount, unallocatedAmount, receiptDate, paymentMethod, status, version]
      properties:
        id: { type: string }
        code: { type: string, description: 收款单编号（RCT-2026-xxxx，DocumentSequence 创建即取号——拍板④） }
        customerId: { type: string, description: 收款客户（核销目标 AR.customerId 必须一致——硬规则） }
        currency: { type: string, description: 币种（核销目标 AR.currency 必须一致——硬规则，第一版禁止跨币种核销） }
        amount: { type: number, description: 实收金额（收款事实） }
        allocatedAmount: { type: number, description: 受控投影 = Σ ReceiptAllocation.allocatedAmount（禁止 PATCH） }
        unallocatedAmount: { type: number, description: 受控投影 = amount - allocatedAmount（拍板⑤：预收/暂未指定发票场景） }
        receiptDate: { type: string, format: date-time }
        paymentMethod: { $ref: "#/components/schemas/PaymentMethod" }
        referenceNo: { type: [string, "null"], description: 银行流水号/备注 }
        status: { $ref: "#/components/schemas/ReceiptStatus" }
        voidedAt: { type: [string, "null"], format: date-time }
        voidedById: { type: [string, "null"] }
        version: { type: integer }
        createdById: { type: [string, "null"] }
        updatedById: { type: [string, "null"] }
        deletedAt: { type: [string, "null"], format: date-time }
        isActive: { type: boolean }

    ReceiptAllocation:
      type: object
      required: [id, receiptId, accountsReceivableId, allocatedAmount, allocatedAt]
      properties:
        id: { type: string }
        receiptId: { type: string }
        accountsReceivableId: { type: string }
        allocatedAmount: { type: number, description: 本次核销金额 }
        allocatedAt: { type: string, format: date-time }
        allocatedBy: { type: [string, "null"] }
        reversedAt: { type: [string, "null"], format: date-time, description: Allocation Reversal 留痕（非空即已冲销；不删除原记录） }
        reversedBy: { type: [string, "null"] }
        reverseReason: { type: [string, "null"] }
        version: { type: integer }
        createdById: { type: [string, "null"] }
        updatedById: { type: [string, "null"] }
        deletedAt: { type: [string, "null"], format: date-time }
        isActive: { type: boolean }

    ReceiptRevision:
      type: object
      required: [id, receiptId, revisionNo, changeReason]
      properties:
        id: { type: string }
        receiptId: { type: string }
        revisionNo: { type: integer, description: 系统自动递增（唯一版本载体） }
        changeReason: { type: string }
        snapshotData: { type: object, description: 头信息快照（金额 Decimal 字符串，禁止 toNumber） }
        createdById: { type: [string, "null"] }
        updatedById: { type: [string, "null"] }
        deletedAt: { type: [string, "null"], format: date-time }
        isActive: { type: boolean }

    ReceiptSnapshot:
      type: object
      required: [id, receiptId, snapshotType, revisionNo]
      properties:
        id: { type: string }
        receiptId: { type: string }
        snapshotType: { $ref: "#/components/schemas/ReceiptSnapshotType" }
        revisionNo: { type: integer }
        snapshotData: { type: object, description: 完整快照（Header + amount/allocatedAmount/unallocatedAmount/status；Decimal 字符串） }
        generatedById: { type: [string, "null"] }
        generatedAt: { type: [string, "null"], format: date-time }
        createdById: { type: [string, "null"] }
        updatedById: { type: [string, "null"] }
        deletedAt: { type: [string, "null"], format: date-time }
        isActive: { type: boolean }

    ReceiptCreate:
      type: object
      required: [customerId, amount, paymentMethod]
      description: 创建收款单（拍板①：只记录实际收到的钱，不核销；unallocatedAmount = amount）
      properties:
        customerId: { type: string, minLength: 1 }
        currency: { type: string, minLength: 3, maxLength: 3, default: "CNY" }
        amount: { type: number, exclusiveMinimum: 0 }
        receiptDate: { type: string, format: date-time }
        paymentMethod: { $ref: "#/components/schemas/PaymentMethod" }
        referenceNo: { type: [string, "null"], maxLength: 100 }
        changeReason: { type: string, maxLength: 500 }

    ReceiptAllocateRequest:
      type: object
      required: [allocations]
      description: 核销请求（一次请求原子化；M:N——一个 Receipt → 多 AR；同一 (receipt, AR) 只核销一次）
      properties:
        allocations:
          type: array
          minItems: 1
          items:
            type: object
            required: [accountsReceivableId, amount]
            properties:
              accountsReceivableId: { type: string, minLength: 1 }
              amount: { type: number, exclusiveMinimum: 0 }
        changeReason: { type: string, maxLength: 500 }

    ReceiptAllocationReverseRequest:
      type: object
      required: [reverseReason]
      description: Allocation Reversal（解除核销关系并留痕——reversedAt/reversedBy/reverseReason 写入原记录，不删除）
      properties:
        reverseReason: { type: string, minLength: 1, maxLength: 500 }

    ReceiptVoidRequest:
      type: object
      description: 作废收款单（仅 UNALLOCATED 可 VOID；已核销必须先 Reversal——409 RECEIPT_VOID_FORBIDDEN；不实现 CN 语义）
      properties:
        changeReason: { type: string, maxLength: 500 }

    ReceiptResponse:
      type: object
      required: [success, data]
      properties:
        success: { type: boolean, example: true }
        data: { $ref: "#/components/schemas/Receipt" }

    ReceiptListResponse:
      type: object
      required: [success, data]
      properties:
        success: { type: boolean, example: true }
        data:
          type: array
          items: { $ref: "#/components/schemas/Receipt" }

    ReceiptDetailResponse:
      type: object
      required: [success, data]
      properties:
        success: { type: boolean, example: true }
        data:
          type: object
          description: Receipt + Customer 摘要 + allocations（含 AR 摘要）+ 最近 Revision/Snapshot
          properties:
            id: { type: string }
            code: { type: string }
            customerId: { type: string }
            currency: { type: string }
            amount: { type: number }
            allocatedAmount: { type: number }
            unallocatedAmount: { type: number }
            receiptDate: { type: string, format: date-time }
            paymentMethod: { $ref: "#/components/schemas/PaymentMethod" }
            referenceNo: { type: [string, "null"] }
            status: { $ref: "#/components/schemas/ReceiptStatus" }
            customer:
              type: object
              properties:
                id: { type: string }
                code: { type: string }
                name: { type: string }
            allocations:
              type: array
              items:
                type: object
                properties:
                  id: { type: string }
                  accountsReceivableId: { type: string }
                  allocatedAmount: { type: number }
                  allocatedAt: { type: string, format: date-time }
                  reversedAt: { type: [string, "null"], format: date-time }
                  accountsReceivable:
                    type: object
                    properties:
                      id: { type: string }
                      invoiceId: { type: string }
                      balanceAmount: { type: number }
                      status: { $ref: "#/components/schemas/AccountsReceivableStatus" }
            revisions:
              type: array
              items: { $ref: "#/components/schemas/ReceiptRevision" }
            snapshots:
              type: array
              items: { $ref: "#/components/schemas/ReceiptSnapshot" }

    ReceiptRevisionListResponse:
      type: object
      required: [success, data]
      properties:
        success: { type: boolean, example: true }
        data:
          type: array
          items: { $ref: "#/components/schemas/ReceiptRevision" }

    ReceiptSnapshotListResponse:
      type: object
      required: [success, data]
      properties:
        success: { type: boolean, example: true }
        data:
          type: array
          items: { $ref: "#/components/schemas/ReceiptSnapshot" }

    ReceiptAllocateResponse:
      type: object
      required: [success, data]
      properties:
        success: { type: boolean, example: true }
        data:
          type: object
          properties:
            receiptId: { type: string }
            customerId: { type: string }
            currency: { type: string }
            amount: { type: number }
            totalAllocated: { type: number, description: 本次核销总额 }
            newUnallocated: { type: number, description: 核销后剩余未分配金额 }
            receiptStatus: { $ref: "#/components/schemas/ReceiptStatus" }
            arIds: { type: array, items: { type: string }, description: 目标 AR id 列表（id ASC） }

    ReceiptAllocationReverseResponse:
      type: object
      required: [success, data]
      properties:
        success: { type: boolean, example: true }
        data:
          type: object
          properties:
            allocationId: { type: string }
            reversedAmount: { type: number }
            receiptId: { type: string }
            customerId: { type: string }
            currency: { type: string }
            amount: { type: number }
            arId: { type: string }
            newArStatus: { $ref: "#/components/schemas/AccountsReceivableStatus" }
            newReceiptStatus: { $ref: "#/components/schemas/ReceiptStatus" }

    WriteOffStatus:
      type: string
      enum: [DRAFT, SUBMITTED, APPROVED, REJECTED, APPLIED]
      description: 写销状态（审批边界：WriteOff 按 ApprovalPolicy 条件审批；审批完成前禁止改 AR.writeOffAmount；APPLIED 才回写）

    WriteOff:
      type: object
      required: [id, code, amount, reason, writeOffDate, status, approvalStatus, version]
      properties:
        id: { type: string }
        code: { type: string, description: 写销单编号（WO-2026-xxxx，DocumentSequence 创建即取号——拍板④） }
        amount: { type: number, description: 写销总额（= Σ WriteOffAllocation.amount，服务端计算，禁止直传头金额） }
        reason: { type: string, description: 原因：坏账/折让/其他 }
        writeOffDate: { type: string, format: date-time }
        status: { $ref: "#/components/schemas/WriteOffStatus" }
        approvalPolicyId: { type: [string, "null"], description: 条件审批（可空） }
        workflowInstanceId: { type: [string, "null"], description: 审批实例（Workflow 唯一审批事实源；不建 WriteOffApproval 表） }
        approvalStatus: { type: string, description: 审批投影（DRAFT/PENDING/APPROVED/REJECTED——CTO：APPROVED ≠ APPLIED） }
        approvedAt: { type: [string, "null"], format: date-time }
        approvedById: { type: [string, "null"] }
        appliedAt: { type: [string, "null"], format: date-time, description: APPLIED 时才回写 AR（审批完成前禁止提前修改） }
        appliedById: { type: [string, "null"] }
        version: { type: integer }
        createdById: { type: [string, "null"] }
        updatedById: { type: [string, "null"] }
        deletedAt: { type: [string, "null"], format: date-time }
        isActive: { type: boolean }
        allocations:
          type: array
          items: { $ref: "#/components/schemas/WriteOffAllocation" }

    WriteOffAllocation:
      type: object
      required: [id, writeOffId, accountsReceivableId, amount]
      properties:
        id: { type: string }
        writeOffId: { type: string }
        accountsReceivableId: { type: string }
        amount: { type: number }
        version: { type: integer }
        createdById: { type: [string, "null"] }
        updatedById: { type: [string, "null"] }
        deletedAt: { type: [string, "null"], format: date-time }
        isActive: { type: boolean }
        accountsReceivable:
          type: object
          description: 列表/详情一次带出的 AR 摘要
          properties:
            id: { type: string }
            invoiceId: { type: string }
            balanceAmount: { type: number }
            customerId: { type: string }
            currency: { type: string }

    WriteOffCreate:
      type: object
      required: [allocations, reason]
      description: 创建 WriteOff（DRAFT + WriteOffAllocation；同 Customer / 同 Currency——409 WRITE_OFF_SOURCE_NOT_COMPATIBLE；暂不修改 AR）
      properties:
        allocations:
          type: array
          minItems: 1
          items:
            type: object
            required: [accountsReceivableId, amount]
            properties:
              accountsReceivableId: { type: string, minLength: 1 }
              amount: { type: number, exclusiveMinimum: 0 }
        reason: { type: string, minLength: 1, maxLength: 500 }
        writeOffDate: { type: string, format: date-time }
        approvalPolicyId: { type: [string, "null"] }
        changeReason: { type: string, maxLength: 500 }

    WriteOffSubmitRequest:
      type: object
      description: 提交审批（DRAFT → SUBMITTED；命中 WRITE_OFF 策略 → Workflow 触发，须 APPROVED 后才能 Apply；无策略 → 可直接 Apply）
      properties:
        changeReason: { type: string, maxLength: 500 }

    WriteOffApplyRequest:
      type: object
      description: Apply（唯一回写 AR.writeOffAmount/balanceAmount 的动作；重复 Apply → 409 WRITE_OFF_ALREADY_APPLIED）
      properties:
        changeReason: { type: string, maxLength: 500 }

    WriteOffResponse:
      type: object
      required: [success, data]
      properties:
        success: { type: boolean, example: true }
        data: { $ref: "#/components/schemas/WriteOff" }

    WriteOffListResponse:
      type: object
      required: [success, data]
      properties:
        success: { type: boolean, example: true }
        data:
          type: array
          items: { $ref: "#/components/schemas/WriteOff" }

    WriteOffSubmitResponse:
      type: object
      required: [success, data]
      properties:
        success: { type: boolean, example: true }
        data:
          type: object
          properties:
            writeOffId: { type: string }
            status: { type: string, description: "SUBMITTED" }
            approvalStatus: { type: string, description: "PENDING（命中策略）/ DRAFT（未命中）" }
            workflowTriggered: { type: boolean }
            workflowInstanceId: { type: [string, "null"] }
            workflowSkipped: { type: [string, "null"], description: "跳过原因：no-policy / no-rule-matched / instance-running / not-found" }

    WriteOffApplyResponse:
      type: object
      required: [success, data]
      properties:
        success: { type: boolean, example: true }
        data:
          type: object
          properties:
            writeOffId: { type: string }
            status: { type: string, description: "APPLIED" }
            appliedAt: { type: string, format: date-time }
            arIds: { type: array, items: { type: string } }
            totalApplied: { type: number }

    ReceiptErrorCodes:
      type: string
      description: |
        Receipt / Allocation 领域错误码（与实现 errors.ts 一致）：
        - RECEIPT_NOT_FOUND（404）收款单不存在
        - RECEIPT_CUSTOMER_NOT_FOUND（404）收款客户不存在
        - RECEIPT_CUSTOMER_MISMATCH（409）收款单与应收客户不一致——不允许跨客户核销
        - RECEIPT_CURRENCY_MISMATCH（409）收款单与应收币种不一致——第一版禁止跨币种核销
        - RECEIPT_UNALLOCATED_EXCEEDED（409）核销金额超过收款单未分配余额
        - RECEIPT_ALLOCATION_EXCEEDED（409）核销金额超过应收余额——禁止超核销
        - RECEIPT_VOID_FORBIDDEN（409）仅未核销可作废；已核销须先 Allocation Reversal
        - RECEIPT_ALLOCATION_NOT_FOUND（404）核销记录不存在
        - RECEIPT_ALLOCATION_REVERSED（409）该核销已冲销，不可重复冲销

    WriteOffErrorCodes:
      type: string
      description: |
        WriteOff 领域错误码（与实现 errors.ts 一致）：
        - WRITE_OFF_NOT_FOUND（404）WriteOff 不存在
        - WRITE_OFF_INVALID_STATE（409）仅 DRAFT 可提交 / 状态不允许 Apply
        - WRITE_OFF_ALREADY_APPLIED（409）重复 Apply（幂等稳定 409）
        - WRITE_OFF_AMOUNT_EXCEEDED（400/409）写销金额必须大于 0 / 超过应收余额
        - WRITE_OFF_APPROVAL_REQUIRED（409）命中审批策略但未 APPROVED，禁止 Apply
        - WRITE_OFF_SOURCE_NOT_COMPATIBLE（409）目标 AR 必须同 Customer / 同 Currency
        - WRITE_OFF_WORKFLOW_FAILED（409）审批流程定义不存在或未发布（WRITE_OFF_APPROVAL）

    CreditDebitNoteType:
      type: string
      enum: [CREDIT, DEBIT]
      description: 调整单类型（CTO 98/100：全系统唯一符号口径——CREDIT 负向调整 AR（adjustmentAmount<0）、DEBIT 正向调整 AR（adjustmentAmount>0））

    CreditDebitNoteStatus:
      type: string
      enum: [DRAFT, SUBMITTED, APPLIED, CANCELLED]
      description: 调整单生命周期（审批状态走 approvalStatus 投影复用 ApprovalStatus——不膨胀；REJECTED 不占 status）

    CreditDebitNote:
      type: object
      required: [id, code, noteType, sourceInvoiceId, customerId, currency, reason, adjustmentTotal, status, approvalStatus, version]
      properties:
        id: { type: string }
        code: { type: string, description: 调整单编号（CN-/DN-2026-xxxx，DocumentSequence 创建即取号） }
        noteType: { $ref: "#/components/schemas/CreditDebitNoteType" }
        sourceInvoiceId: { type: string, description: 源发票（单票制必填唯一；跨票 Consolidated 延后） }
        customerId: { type: string, description: 客户（继承 sourceInvoice.customerId） }
        currency: { type: string, description: 币种（继承 sourceInvoice.currency） }
        reason: { type: string, description: 调整原因（折让/退货/价差/更正/其他） }
        adjustmentTotal: { type: number, description: 调整总额（= Σ lines.totalAmount，服务端计算，禁止直传头金额） }
        status: { $ref: "#/components/schemas/CreditDebitNoteStatus" }
        approvalPolicyId: { type: [string, "null"], description: 条件审批（module=CREDIT_DEBIT_NOTE；可空） }
        workflowInstanceId: { type: [string, "null"], description: 审批实例（Workflow 唯一审批事实源；不建 Approval 表） }
        approvalStatus: { type: string, description: 审批投影（DRAFT/PENDING/APPROVED/REJECTED——CTO：APPROVED ≠ APPLIED） }
        approvedAt: { type: [string, "null"], format: date-time }
        approvedById: { type: [string, "null"] }
        appliedAt: { type: [string, "null"], format: date-time, description: APPLIED 时才回写 AR（审批完成前禁止提前修改） }
        appliedById: { type: [string, "null"] }
        version: { type: integer }
        createdById: { type: [string, "null"] }
        updatedById: { type: [string, "null"] }
        deletedAt: { type: [string, "null"], format: date-time }
        isActive: { type: boolean }
        sourceInvoice:
          type: object
          description: 列表/详情一次带出的源发票摘要
          properties:
            id: { type: string }
            code: { type: [string, "null"] }
            invoiceTotal: { type: number }
            balanceAmount: { type: number }
        lines:
          type: array
          items: { $ref: "#/components/schemas/CreditDebitNoteLine" }

    CreditDebitNoteLine:
      type: object
      required: [id, creditDebitNoteId, sourceInvoiceLineId, lineNo, description, quantity, unitPrice, discountRate, lineAmount, taxAmount, totalAmount, version]
      properties:
        id: { type: string }
        creditDebitNoteId: { type: string }
        sourceInvoiceLineId: { type: string, description: 溯源发票行（必填可追溯——CTO 锁死） }
        lineNo: { type: integer, description: 行号（10/20/30/40 步进） }
        itemId: { type: [string, "null"], description: 物料（继承 InvoiceLine.itemId，可空） }
        description: { type: string, description: 描述（快照复制） }
        quantity: { type: number, description: 调整数量（>0；部分行数量调整——CTO 拍板④，累计防超调） }
        uomId: { type: [string, "null"] }
        unitPrice: { type: number, description: 单价快照（复制，不重算） }
        discountRate: { type: number, description: 折扣率快照（复制） }
        lineAmount: { type: number, description: 行未税金额（复制计算值） }
        taxAmount: { type: number, description: 行税额（复制） }
        totalAmount: { type: number, description: 行含税金额（复制） }
        version: { type: integer }
        createdById: { type: [string, "null"] }
        updatedById: { type: [string, "null"] }
        deletedAt: { type: [string, "null"], format: date-time }
        isActive: { type: boolean }

    InvoiceAdjustment:
      type: object
      description: |
        发票调整事实中间层（**只读 schema，不开放直接 create/edit API**——事实只能由 Apply 事务生成）。
        **4E-3 最核心事实层**：真正影响 AR.adjustedAmount 的唯一入口（客户端禁直接创建/修改）。
        双溯源：sourceNoteId/sourceNoteLineId（单据侧）+ invoiceId/invoiceLineId（发票侧）+ accountsReceivableId（AR 侧）。
      required: [id, sourceNoteId, sourceNoteLineId, invoiceId, accountsReceivableId, customerId, currency, adjustmentType, quantity, adjustmentAmount, version]
      properties:
        id: { type: string }
        sourceNoteId: { type: string, description: 来源调整单 }
        sourceNoteLineId: { type: string, description: 来源调整单明细行 }
        invoiceId: { type: string }
        invoiceLineId: { type: [string, "null"], description: 可空：整票调整（invoiceLineId 为空） }
        accountsReceivableId: { type: string, description: 目标 AR（invoiceId 1:1 推导） }
        customerId: { type: string, description: 冗余（Apply 事务校验与 AR 一致） }
        currency: { type: string }
        adjustmentType: { $ref: "#/components/schemas/CreditDebitNoteType" }
        quantity: { type: number, description: 调整数量（累计防超调用） }
        adjustmentAmount: { type: number, description: "**有符号调整金额：CN<0 / DN>0（CTO 98/100，全系统唯一符号口径）**" }
        appliedAt: { type: [string, "null"], format: date-time, description: Apply 回写时间（null = 未生效） }
        appliedById: { type: [string, "null"] }
        reversedAt: { type: [string, "null"], format: date-time, description: reversal 预留（4E-3 首版不实现） }
        reversedById: { type: [string, "null"] }
        version: { type: integer }
        createdById: { type: [string, "null"] }
        updatedById: { type: [string, "null"] }
        deletedAt: { type: [string, "null"], format: date-time }
        isActive: { type: boolean }

    CreditDebitNoteCreateRequest:
      type: object
      required: [noteType, sourceInvoiceId, reason, lines]
      description: |
        创建调整单（DRAFT + lines）。单票制：sourceInvoiceId 必填唯一；只接受已 ISSUED 的 Invoice
        （409 CN_DN_SOURCE_INVOICE_INVALID）；Customer/Currency 从原 Invoice 继承（禁止客户端传）；
        行只传 sourceInvoiceLineId + quantity（>0）；金额/税率/价格只复制原 InvoiceLine 快照（不调 Pricing Engine）。
        **不创建 InvoiceAdjustment、不改 AR、不改 Invoice.balanceAmount**（事实由 Apply 事务生成）。
      properties:
        noteType: { $ref: "#/components/schemas/CreditDebitNoteType" }
        sourceInvoiceId: { type: string, minLength: 1 }
        reason: { type: string, minLength: 1, maxLength: 500 }
        lines:
          type: array
          minItems: 1
          items:
            type: object
            required: [sourceInvoiceLineId, quantity]
            properties:
              sourceInvoiceLineId: { type: string, minLength: 1 }
              quantity: { type: number, exclusiveMinimum: 0 }
        changeReason: { type: string, maxLength: 500 }

    CreditDebitNoteSubmitRequest:
      type: object
      description: 提交审批（DRAFT → SUBMITTED；命中 CREDIT_DEBIT_NOTE 策略 → Workflow 触发，须 APPROVED 后才能 Apply；无策略 → 可直接 Apply）
      properties:
        changeReason: { type: string, maxLength: 500 }

    CreditDebitNoteApplyRequest:
      type: object
      description: |
        Apply（唯一回写 AR.adjustedAmount/balanceAmount 的动作；重复 Apply → 409 CN_DN_ALREADY_APPLIED）。
        **累计防超调（锁内重算）**：
        - CREDIT：remainingAdjustableQty = originalInvoiceLine.quantity - cumulativeAppliedCreditQty，
          requestedQty ≤ remainingAdjustableQty（否则 409 CN_DN_QUANTITY_EXCEEDED）
        - DEBIT：cumulativeAppliedDebitAmount + current ≤ original line ceiling（ceiling = 原行金额；否则 409 CN_DN_AMOUNT_EXCEEDED）
        - 金额按同类型聚合（CREDIT 累计 ∥ DEBIT 累计），CN/DN 不互相污染 ceiling
      properties:
        changeReason: { type: string, maxLength: 500 }

    CreditDebitNoteResponse:
      type: object
      required: [success, data]
      properties:
        success: { type: boolean, example: true }
        data:
          type: object
          properties:
            creditDebitNote: { $ref: "#/components/schemas/CreditDebitNote" }

    CreditDebitNoteListResponse:
      type: object
      required: [success, data]
      properties:
        success: { type: boolean, example: true }
        data:
          type: array
          items: { $ref: "#/components/schemas/CreditDebitNote" }

    CreditDebitNoteSubmitResponse:
      type: object
      required: [success, data]
      properties:
        success: { type: boolean, example: true }
        data:
          type: object
          properties:
            creditDebitNoteId: { type: string }
            status: { type: string, description: "SUBMITTED" }
            approvalStatus: { type: string, description: "PENDING（命中策略）/ DRAFT（未命中）" }
            workflowTriggered: { type: boolean }
            workflowInstanceId: { type: [string, "null"] }
            workflowSkipped: { type: [string, "null"], description: "跳过原因：no-policy / no-rule-matched / instance-running / not-found" }

    CreditDebitNoteApplyResponse:
      type: object
      required: [success, data]
      properties:
        success: { type: boolean, example: true }
        data:
          type: object
          properties:
            creditDebitNoteId: { type: string }
            status: { type: string, description: "APPLIED" }
            appliedAt: { type: string, format: date-time }
            arIds: { type: array, items: { type: string } }
            signedAdjustmentTotal: { type: number, description: "Σ signed adjustmentAmount（CN 负 / DN 正）" }
            newBalance: { type: number, description: "AR.balanceAmount 经 computeBalance 计算后的新余额（可负 = Customer Credit）" }
            newStatus: { type: string }
            factCount: { type: integer }

    CreditDebitNoteErrorCodes:
      type: string
      description: |
        CreditDebitNote 领域错误码（与实现 errors.ts 一致）：
        - CN_DN_NOT_FOUND（404）调整单不存在
        - CN_DN_SOURCE_INVOICE_INVALID（409）源 Invoice 无效（必须已 ISSUED）
        - CN_DN_SOURCE_LINE_INVALID（409）明细行不属于该 Invoice
        - CN_DN_SOURCE_NOT_COMPATIBLE（409）源 Invoice/AR 校验失败（customer/currency 不一致）
        - CN_DN_INVALID_STATE（409）仅 DRAFT 可提交 / 仅 SUBMITTED 可 Apply
        - CN_DN_ALREADY_APPLIED（409）重复 Apply（幂等稳定 409）
        - CN_DN_APPROVAL_REQUIRED（409）命中审批策略但未 APPROVED，禁止 Apply（APPROVED ≠ APPLIED）
        - CN_DN_QUANTITY_EXCEEDED（409）调整数量超出剩余可调整数量（累计防超调）
        - CN_DN_AMOUNT_EXCEEDED（409）调整金额超出原行金额上限（行级 ceiling）
        - CN_DN_WORKFLOW_FAILED（409）命中策略但工作流定义缺失/未激活（提交已回滚）

    # --------------------------------------------------------------------------
    # Sprint 5A — Purchase Requisition & Purchase Order（PR=需求事实源无金额 / PO=承诺事实源）
    # 红线：APPROVED ≠ CONFIRMED；只有 CONFIRMED PO 才是 5B Goods Receipt 合法来源
    # --------------------------------------------------------------------------
    PurchaseRequisitionStatus:
      type: string
      enum: [DRAFT, SUBMITTED, APPROVED, CONVERTED, CANCELLED]
      description: PR 生命周期（PR=需求事实源；CONVERTED 表示已转 PO）

    PurchaseOrderStatus:
      type: string
      enum: [DRAFT, SUBMITTED, APPROVED, CONFIRMED, PARTIALLY_RECEIVED, RECEIVED, CANCELLED]
      description: |
        PO 生命周期：DRAFT → SUBMITTED → APPROVED → CONFIRMED → PARTIALLY_RECEIVED → RECEIVED；DRAFT → CANCELLED。
        **APPROVED ≠ CONFIRMED**：审批通过 = 公司内部同意采购；Confirm = 正式形成对供应商的采购承诺。
        只有 CONFIRMED PO 才能成为 5B Goods Receipt 来源。

    PurchaseOrderSourceType:
      type: string
      enum: [REQUISITION, DIRECT]
      description: |
        PO 来源链：REQUISITION = 经 PR Convert（行级溯源 sourcePurchaseRequisitionLineId）；DIRECT = 直接采购
        （显式可审计、不能绕过 PO Approval；禁止传 source 行）。

    PurchaseOrderPriceSource:
      type: string
      enum: [SUPPLIER_PRICE_SNAPSHOT, MANUAL]
      description: |
        价格双通道：SUPPLIER_PRICE_SNAPSHOT（PartnerPrice 服务端解析，priority asc）；MANUAL（授权手工价，
        必须记录 priceReason + priceSetById + priceSetAt 审计三件套）。

    PurchaseOrderSnapshotType:
      type: string
      enum: [CREATED, SUBMITTED, APPROVED, CONFIRMED, RECEIVED, CANCELLED]
      description: |
        PO 快照类型。唯一约束 [purchaseOrderId, snapshotType, revisionNo]（Migration 0022）：
        多轮审批时同一 snapshotType 可并存多份（revisionNo 区分），解决多轮重审快照冲突。

    PurchaseRequisitionLine:
      type: object
      required: [id, purchaseRequisitionId, itemId, quantity]
      properties:
        id: { type: string }
        purchaseRequisitionId: { type: string }
        lineNo: { type: integer }
        itemId: { type: string }
        description: { type: string }
        quantity: { type: number, description: 需求数量（Decimal，>0；PR 无金额事实） }
        uomId: { type: [string, "null"] }
        needDate: { type: [string, "null"], format: date-time }
        remark: { type: [string, "null"] }
        createdById: { type: [string, "null"] }
        updatedById: { type: [string, "null"] }
        deletedAt: { type: [string, "null"], format: date-time }
        isActive: { type: boolean }

    PurchaseRequisition:
      type: object
      required: [id, code, status, version]
      properties:
        id: { type: string }
        code: { type: string, description: 单据编号（DocumentSequence，前缀 PR，位数 6） }
        requesterId: { type: [string, "null"] }
        departmentId: { type: [string, "null"] }
        status: { $ref: "#/components/schemas/PurchaseRequisitionStatus" }
        needDate: { type: [string, "null"], format: date-time }
        remark: { type: [string, "null"] }
        workflowInstanceId: { type: [string, "null"], description: 审批实例投影（Workflow 为唯一审批事实源，ADR-0017） }
        approvalStatus: { type: [string, "null"] }
        approvedAt: { type: [string, "null"], format: date-time }
        approvedById: { type: [string, "null"] }
        version: { type: integer, description: 乐观锁版本 }
        createdById: { type: [string, "null"] }
        updatedById: { type: [string, "null"] }
        deletedAt: { type: [string, "null"], format: date-time }
        isActive: { type: boolean }

    PurchaseRequisitionLineCreate:
      type: object
      required: [itemId, quantity]
      properties:
        itemId: { type: string, minLength: 1 }
        description: { type: string, maxLength: 500 }
        quantity: { type: number, exclusiveMinimum: 0, description: 需求数量 > 0（服务端 Decimal 精确校验） }
        uomId: { type: string }
        lineNo: { type: integer }
        needDate: { type: [string, "null"], format: date-time }
        remark: { type: [string, "null"], maxLength: 500 }

    PurchaseRequisitionCreate:
      type: object
      required: [lines]
      properties:
        requesterId: { type: [string, "null"] }
        departmentId: { type: [string, "null"] }
        needDate: { type: [string, "null"], format: date-time }
        remark: { type: [string, "null"], maxLength: 1000 }
        lines:
          type: array
          minItems: 1
          items: { $ref: "#/components/schemas/PurchaseRequisitionLineCreate" }

    PurchaseRequisitionUpdate:
      type: object
      required: [version]
      properties:
        needDate: { type: [string, "null"], format: date-time }
        remark: { type: [string, "null"], maxLength: 1000 }
        lines:
          type: array
          items: { $ref: "#/components/schemas/PurchaseRequisitionLineCreate" }
        changeReason: { type: string, maxLength: 500 }
        version: { type: integer, description: 乐观锁版本（冲突返回 409 VERSION_CONFLICT） }

    PurchaseRequisitionResponse:
      type: object
      required: [success, data]
      properties:
        success: { type: boolean, example: true }
        data: { $ref: "#/components/schemas/PurchaseRequisition" }

    PurchaseRequisitionListResponse:
      type: object
      required: [success, data]
      properties:
        success: { type: boolean, example: true }
        data:
          type: array
          items: { $ref: "#/components/schemas/PurchaseRequisition" }

    PurchaseRequisitionSubmitResponse:
      type: object
      required: [success, data]
      properties:
        success: { type: boolean, example: true }
        data:
          type: object
          required: [id, status, workflowInstanceId]
          properties:
            id: { type: string }
            status: { type: string, enum: [SUBMITTED] }
            workflowInstanceId: { type: [string, "null"] }

    PurchaseOrderConvert:
      type: object
      required: [supplierId]
      description: PR → PO Convert 请求（REQUISITION 来源；行价格覆盖可选）
      properties:
        supplierId: { type: string, minLength: 1 }
        purchaserId: { type: [string, "null"], description: 采购员（CTO Phase 4B：PO Header 落地） }
        departmentId: { type: [string, "null"], description: 采购部门 }
        currency: { type: string, maxLength: 10 }
        paymentTerm: { type: [string, "null"], maxLength: 100 }
        expectedDeliveryDate: { type: [string, "null"], format: date-time }
        remark: { type: [string, "null"], maxLength: 1000 }
        lines:
          type: array
          items:
            type: object
            properties:
              priceSource: { $ref: "#/components/schemas/PurchaseOrderPriceSource" }
              unitPrice: { type: number, description: MANUAL 通道必填 }
              priceReason: { type: string, maxLength: 500, description: MANUAL 通道必填（审计） }
              taxRate: { type: number, description: 税率快照覆盖（默认服务端解析） }

    PurchaseRequisitionConvertResponse:
      type: object
      required: [success, data]
      properties:
        success: { type: boolean, example: true }
        data:
          type: object
          required: [id, code, status, requisitionId]
          properties:
            id: { type: string, description: 新 PO id }
            code: { type: string, description: 新 PO 编号 }
            status: { type: string, enum: [DRAFT] }
            requisitionId: { type: string, description: 来源 PR id }

    PurchaseOrderLine:
      type: object
      required: [id, purchaseOrderId, itemId, quantity, priceSource, unitPrice]
      properties:
        id: { type: string }
        purchaseOrderId: { type: string }
        sourcePurchaseRequisitionLineId: { type: [string, "null"], description: PR Line 行级溯源（REQUISITION；永不清除） }
        lineNo: { type: integer }
        itemId: { type: string }
        description: { type: string }
        quantity: { type: number }
        uomId: { type: [string, "null"] }
        priceSource: { $ref: "#/components/schemas/PurchaseOrderPriceSource" }
        unitPrice: { type: number }
        taxRate: { type: number }
        lineAmount: { type: number, description: unitPrice×quantity（服务端 Decimal） }
        taxAmount: { type: number, description: lineAmount×taxRate/100 }
        totalAmount: { type: number, description: lineAmount+taxAmount }
        priceReason: { type: [string, "null"], description: MANUAL 审计（priceReason/priceSetById/priceSetAt） }
        priceSetById: { type: [string, "null"] }
        priceSetAt: { type: [string, "null"], format: date-time }
        receivedQty: { type: number, description: 已收数量（5A 初始 0，禁客户端改；5B 唯一回写方） }
        remainingReceiveQty: { type: number, description: 剩余可收数量（5A 初始=quantity，禁客户端改） }
        createdById: { type: [string, "null"] }
        updatedById: { type: [string, "null"] }
        deletedAt: { type: [string, "null"], format: date-time }
        isActive: { type: boolean }

    PurchaseOrder:
      type: object
      required: [id, code, sourceType, supplierId, status, currency, totalAmount, version]
      properties:
        id: { type: string }
        code: { type: string, description: 单据编号（DocumentSequence，前缀 PO，位数 6） }
        sourceType: { $ref: "#/components/schemas/PurchaseOrderSourceType" }
        supplierId: { type: string }
        requisitionId: { type: [string, "null"], description: REQUISITION 来源时必填；DIRECT 为空 }
        purchaserId: { type: [string, "null"], description: 采购员（CTO Phase 4B；Direct PO 无 PR 可溯） }
        departmentId: { type: [string, "null"], description: 采购部门 }
        status: { $ref: "#/components/schemas/PurchaseOrderStatus" }
        orderDate: { type: [string, "null"], format: date-time }
        expectedDeliveryDate: { type: [string, "null"], format: date-time }
        paymentTerm: { type: [string, "null"] }
        currency: { type: string, example: CNY }
        remark: { type: [string, "null"] }
        subtotal: { type: number, description: 服务端聚合 }
        taxAmount: { type: number, description: 服务端聚合 }
        totalAmount: { type: number, description: 服务端聚合（禁客户端直传头金额） }
        workflowInstanceId: { type: [string, "null"], description: 审批实例投影（Workflow 为唯一审批事实源，ADR-0017） }
        approvalStatus: { type: [string, "null"] }
        approvedAt: { type: [string, "null"], format: date-time }
        approvedById: { type: [string, "null"] }
        confirmedAt: { type: [string, "null"], format: date-time, description: 正式下单时间（Confirm 动作） }
        confirmedById: { type: [string, "null"] }
        version: { type: integer, description: 乐观锁版本 }
        createdById: { type: [string, "null"] }
        updatedById: { type: [string, "null"] }
        deletedAt: { type: [string, "null"], format: date-time }
        isActive: { type: boolean }

    PurchaseOrderLineCreate:
      type: object
      required: [itemId, quantity]
      properties:
        itemId: { type: string, minLength: 1 }
        description: { type: string, maxLength: 500 }
        quantity: { type: number, exclusiveMinimum: 0 }
        uomId: { type: string }
        lineNo: { type: integer }
        sourcePurchaseRequisitionLineId: { type: string, description: REQUISITION 每行必填（服务端三条件校验）；DIRECT 禁止 }
        priceSource: { $ref: "#/components/schemas/PurchaseOrderPriceSource" }
        unitPrice: { type: number, description: MANUAL 通道必填（>0） }
        priceReason: { type: string, maxLength: 500, description: MANUAL 通道必填（审计） }
        taxRate: { type: number, description: 税率快照（SUPPLIER_PRICE_SNAPSHOT 时服务端从税档解析；MANUAL 可传，默认 0） }

    PurchaseOrderCreate:
      type: object
      required: [supplierId, lines]
      description: Direct Purchase 创建（sourceType=DIRECT）
      properties:
        supplierId: { type: string, minLength: 1 }
        purchaserId: { type: [string, "null"], description: 采购员（CTO Phase 4B） }
        departmentId: { type: [string, "null"], description: 采购部门 }
        currency: { type: string, maxLength: 10 }
        paymentTerm: { type: [string, "null"], maxLength: 100 }
        expectedDeliveryDate: { type: [string, "null"], format: date-time }
        remark: { type: [string, "null"], maxLength: 1000 }
        lines:
          type: array
          minItems: 1
          items: { $ref: "#/components/schemas/PurchaseOrderLineCreate" }

    PurchaseOrderUpdate:
      type: object
      required: [version]
      description: 仅 DRAFT；金额服务端重算；receivedQty/remainingReceiveQty 禁止客户端传入
      properties:
        purchaserId: { type: [string, "null"] }
        departmentId: { type: [string, "null"] }
        paymentTerm: { type: [string, "null"], maxLength: 100 }
        expectedDeliveryDate: { type: [string, "null"], format: date-time }
        remark: { type: [string, "null"], maxLength: 1000 }
        lines:
          type: array
          items: { $ref: "#/components/schemas/PurchaseOrderLineCreate" }
        changeReason: { type: string, maxLength: 500 }
        version: { type: integer, description: 乐观锁版本（冲突返回 409 VERSION_CONFLICT） }

    PurchaseOrderResponse:
      type: object
      required: [success, data]
      properties:
        success: { type: boolean, example: true }
        data: { $ref: "#/components/schemas/PurchaseOrder" }

    PurchaseOrderListResponse:
      type: object
      required: [success, data]
      properties:
        success: { type: boolean, example: true }
        data:
          type: array
          items: { $ref: "#/components/schemas/PurchaseOrder" }

    PurchaseOrderSubmitResponse:
      type: object
      required: [success, data]
      properties:
        success: { type: boolean, example: true }
        data:
          type: object
          required: [id, status, approvalStatus]
          properties:
            id: { type: string }
            status: { type: string, description: SUBMITTED（命中策略）或 APPROVED（无策略直接投影） }
            approvalStatus: { type: [string, "null"] }
            workflowInstanceId: { type: [string, "null"] }
            workflowSkipped: { type: [string, "null"], description: "no-policy | no-rule-matched | null" }
            resubmitted: { type: boolean, description: 是否复用终态实例重提 }

    PurchaseOrderConfirmResponse:
      type: object
      required: [success, data]
      properties:
        success: { type: boolean, example: true }
        data:
          type: object
          required: [id, status, confirmedAt]
          properties:
            id: { type: string }
            status: { type: string, enum: [CONFIRMED] }
            confirmedAt: { type: [string, "null"], format: date-time }

    PurchaseOrderCancelResponse:
      type: object
      required: [success, data]
      properties:
        success: { type: boolean, example: true }
        data:
          type: object
          required: [id, status]
          properties:
            id: { type: string }
            status: { type: string, enum: [CANCELLED] }

    PurchaseRequisitionErrorCodes:
      type: string
      description: |
        Purchase Requisition 领域错误码（与实现 errors.ts 一致）：
        - PURCHASE_REQUISITION_NOT_FOUND（404）申请不存在
        - PURCHASE_REQUISITION_INVALID_STATE（409）仅 DRAFT 可提交/更新
        - PURCHASE_REQUISITION_NO_LINES（409）至少需要一行明细
        - PURCHASE_REQUISITION_QUANTITY_INVALID（400/409）需求数量必须大于 0
        - PURCHASE_REQUISITION_ITEM_NOT_FOUND（400）无效 Item 引用
        - PURCHASE_REQUISITION_UOM_NOT_FOUND（400）无效 UOM 引用
        - PURCHASE_REQUISITION_APPROVAL_POLICY_NOT_FOUND（409）未匹配审批策略
        - PURCHASE_REQUISITION_WORKFLOW_FAILED（409）工作流定义缺失/未激活

    PurchaseOrderErrorCodes:
      type: string
      description: |
        Purchase Order 领域错误码（与实现 errors.ts 一致）：
        - PURCHASE_ORDER_NOT_FOUND（404）订单不存在
        - PURCHASE_ORDER_INVALID_STATE（409）状态不允许（含 Confirm 重复调用稳定 409；仅 APPROVED 可确认）
        - PURCHASE_ORDER_NO_LINES（409）至少需要一行明细
        - PURCHASE_ORDER_QUANTITY_INVALID（400/409）采购数量必须大于 0
        - PURCHASE_ORDER_SUPPLIER_NOT_FOUND（409）供应商无效
        - PURCHASE_ORDER_ITEM_NOT_FOUND（400）无效 Item 引用
        - PURCHASE_ORDER_UOM_NOT_FOUND（400）无效 UOM 引用
        - PURCHASE_ORDER_PRICE_NOT_FOUND（409）SUPPLIER_PRICE_SNAPSHOT 未命中
        - PURCHASE_ORDER_PRICE_REASON_REQUIRED（400）MANUAL 缺 priceReason
        - PURCHASE_ORDER_REQUISITION_NOT_APPROVED（409）PR 未审批不可 Convert
        - PURCHASE_ORDER_REQUISITION_ALREADY_CONVERTED（409）PR 已转换
        - PURCHASE_ORDER_SOURCE_LINE_REQUIRED（400）REQUISITION 每行必填 sourcePurchaseRequisitionLineId
        - PURCHASE_ORDER_SOURCE_LINE_INVALID（409）溯源行三条件校验失败（属 header.requisitionId / 未删除 / itemId 一致）
        - PURCHASE_ORDER_SOURCE_LINE_FORBIDDEN（400）DIRECT 禁止传 source 行
        - PURCHASE_ORDER_APPROVAL_POLICY_NOT_FOUND（409）未匹配审批策略
        - PURCHASE_ORDER_NOT_APPROVED（409）Confirm 前置：仅 APPROVED 可 Confirm
        - PURCHASE_ORDER_ALREADY_CONFIRMED（409）重复 Confirm（幂等稳定 409）
        - PURCHASE_ORDER_APPROVAL_REQUIRED（409）命中审批策略但未 APPROVED，禁止 Confirm（APPROVED ≠ CONFIRMED）
        - PURCHASE_ORDER_CANCEL_FORBIDDEN（409）CONFIRMED+ 禁止 Cancel（已形成外部采购承诺）
        - PURCHASE_ORDER_WORKFLOW_FAILED（409）命中策略但工作流定义缺失/未激活

    # --------------------------------------------------------------------------
    # Sprint 5B — PurchaseReceipt / Inspection / WarehouseReceipt / PurchaseReturn
    # 红线：5B 永不直接写 Stock / InventoryMovement（6A 唯一事实源）
    # --------------------------------------------------------------------------
    PurchaseReceiptStatus:
      type: string
      enum: [DRAFT, RECEIVED, CANCELLED]
      description: |
        收货事实生命周期：DRAFT（创建即取号 PRC-）→ RECEIVED（Receive 落定，事实不可经 cancel 撤销）→ CANCELLED（仅 DRAFT 可取消）。

    PurchaseReceiptLineCreate:
      type: object
      required: [purchaseOrderLineId, quantity]
      properties:
        purchaseOrderLineId: { type: string, description: 溯源 PO Line（行级溯源；服务端校验属于同一 PO） }
        quantity: { type: number, format: decimal, description: 物理到货毛数量（> 0；可 <、=、> PO 订购量） }
        visibleDamageQty: { type: number, format: decimal, default: 0, description: 收货现场可见损坏 }
        rejectedOnReceiptQty: { type: number, format: decimal, default: 0, description: 现场即拒收（0 <= x <= quantity；**不计入 receivedQty**） }
        deliveryAddress: { type: [string, "null"], maxLength: 500, description: 直送地址（DIRECT_PROJECT） }
        receiver: { type: [string, "null"], maxLength: 200 }
        proof: { type: [string, "null"], maxLength: 500, description: 签收证明/附件引用 }
        remark: { type: [string, "null"], maxLength: 500 }

    PurchaseReceiptCreate:
      type: object
      required: [purchaseOrderId, lines]
      description: 创建收货单（DRAFT；warehouseId 仅 WAREHOUSE 场景必填；DIRECT_PROJECT 不要求）
      properties:
        purchaseOrderId: { type: string, minLength: 1 }
        warehouseId: { type: string, description: 公司仓库到货地点（仅 WAREHOUSE 收货场景） }
        remark: { type: [string, "null"], maxLength: 500 }
        lines:
          type: array
          minItems: 1
          items: { $ref: "#/components/schemas/PurchaseReceiptLineCreate" }

    PurchaseReceiptUpdate:
      type: object
      required: [version]
      description: 仅 DRAFT；行整体替换；receivedQty/remainingReceiveQty 禁客户端提交（5B 唯一回写方）
      properties:
        version: { type: integer, minimum: 1 }
        warehouseId: { type: [string, "null"] }
        remark: { type: [string, "null"], maxLength: 500 }
        lines:
          type: array
          minItems: 1
          items: { $ref: "#/components/schemas/PurchaseReceiptLineCreate" }

    PurchaseReceiptReceive:
      type: object
      required: [version]
      description: 收货 Gate（DRAFT → RECEIVED；version 乐观锁 + 幂等 ALREADY_RECEIVED）
      properties:
        version: { type: integer, minimum: 1 }

    PurchaseReceipt:
      type: object
      properties:
        id: { type: string }
        code: { type: string, description: PRC- 前缀取号 }
        purchaseOrderId: { type: string }
        warehouseId: { type: [string, "null"] }
        status: { $ref: "#/components/schemas/PurchaseReceiptStatus" }
        receivedAt: { type: [string, "null"], format: date-time }
        receivedById: { type: [string, "null"] }
        version: { type: integer }
        lines:
          type: array
          items: { type: object }

    PurchaseReceiptResponse:
      type: object
      required: [success, data]
      properties:
        success: { type: boolean, example: true }
        data: { $ref: "#/components/schemas/PurchaseReceipt" }

    PurchaseReceiptListResponse:
      type: object
      required: [success, data]
      properties:
        success: { type: boolean, example: true }
        data:
          type: object
          properties:
            total: { type: integer }
            page: { type: integer }
            pageSize: { type: integer }
            items:
              type: array
              items: { $ref: "#/components/schemas/PurchaseReceipt" }

    PurchaseReceiptReceiveResponse:
      type: object
      required: [success, data]
      properties:
        success: { type: boolean, example: true }
        data:
          type: object
          required: [id, code, status, receivedAt, poStatus]
          properties:
            id: { type: string }
            code: { type: string }
            status: { type: string, description: RECEIVED }
            receivedAt: { type: string, format: date-time }
            poStatus: { type: string, description: PO 聚合状态（RECEIVED | PARTIALLY_RECEIVED） }

    PurchaseReceiptCancelResponse:
      type: object
      required: [success, data]
      properties:
        success: { type: boolean, example: true }
        data:
          type: object
          properties:
            id: { type: string }
            code: { type: string }
            status: { type: string, description: CANCELLED }

    VersionOnlyRequest:
      type: object
      required: [version]
      properties:
        version: { type: integer, minimum: 1, description: 乐观锁版本号（CAS 原子条件） }

    InspectionMode:
      type: string
      enum: [SKIP, SPOT, FULL]
      description: SKIP=免检（complete 服务端强制 QUALIFIED）；SPOT/FULL=必提交数量

    InspectionResult:
      type: string
      enum: [PENDING, QUALIFIED, PARTIAL, REJECTED]
      description: result 服务端推导，客户端不得传；PENDING 未定稿无入库资格

    InspectionCreate:
      type: object
      required: [purchaseReceiptLineId, inspectionMode]
      description: 创建质检记录（result=PENDING；来源必须已 RECEIVED 收货行；一次检验即最终结果）
      properties:
        purchaseReceiptLineId: { type: string, minLength: 1 }
        inspectionMode: { $ref: "#/components/schemas/InspectionMode" }
        remark: { type: [string, "null"], maxLength: 500 }

    InspectionUpdate:
      type: object
      required: [version]
      description: 仅 PENDING；只允许改 inspectionMode/remark（数量在 complete 时定稿）
      properties:
        version: { type: integer, minimum: 1 }
        inspectionMode: { $ref: "#/components/schemas/InspectionMode" }
        remark: { type: [string, "null"], maxLength: 500 }

    InspectionComplete:
      type: object
      required: [version]
      description: 完成 Gate（SPOT/FULL 必提交数量；SKIP 服务端强制，数量忽略）
      properties:
        version: { type: integer, minimum: 1 }
        qualifiedQty: { type: number, format: decimal, description: 合格数量（≥0；SKIP 忽略） }
        rejectedQty: { type: number, format: decimal, description: 拒收数量（≥0；→ PurchaseReturn INSPECTION 来源） }

    Inspection:
      type: object
      properties:
        id: { type: string }
        purchaseReceiptLineId: { type: string, description: 唯一（一个收货行只有一个最终 Inspection） }
        inspectionMode: { $ref: "#/components/schemas/InspectionMode" }
        result: { $ref: "#/components/schemas/InspectionResult" }
        qualifiedQty: { type: number, format: decimal }
        rejectedQty: { type: number, format: decimal }
        inspectedById: { type: [string, "null"] }
        inspectedAt: { type: [string, "null"], format: date-time }
        version: { type: integer }

    InspectionResponse:
      type: object
      required: [success, data]
      properties:
        success: { type: boolean, example: true }
        data: { $ref: "#/components/schemas/Inspection" }

    InspectionListResponse:
      type: object
      required: [success, data]
      properties:
        success: { type: boolean, example: true }
        data:
          type: object
          properties:
            total: { type: integer }
            page: { type: integer }
            pageSize: { type: integer }
            items:
              type: array
              items: { $ref: "#/components/schemas/Inspection" }

    InspectionCompleteResponse:
      type: object
      required: [success, data]
      properties:
        success: { type: boolean, example: true }
        data:
          type: object
          required: [id, result, qualifiedQty, rejectedQty]
          properties:
            id: { type: string }
            result: { $ref: "#/components/schemas/InspectionResult" }
            qualifiedQty: { type: number, format: decimal }
            rejectedQty: { type: number, format: decimal }

    WarehouseReceiptStatus:
      type: string
      enum: [DRAFT, POSTED, CANCELLED]
      description: D10：Created ≠ Posted——只有 POSTED 才触发 6A InventoryMovement(IN)

    WarehouseReceiptLineCreate:
      type: object
      required: [purchaseReceiptLineId, inspectionId, quantity]
      description: 入库行（消费已完成且 qualifiedQty>0 的 Inspection；组合 FK 同属；P6 批次/序列号/效期采集）
      properties:
        purchaseReceiptLineId: { type: string, description: 溯源收货行 }
        inspectionId: { type: string, description: 质量结论（已完成且 qualifiedQty > 0） }
        quantity: { type: number, format: decimal, description: 入库数量（> 0；≤ 可入库余额 qualifiedQty - 已占用） }
        batchNo: { type: [string, "null"], maxLength: 100 }
        serialNos: { type: [array, "null"], items: { type: string, maxLength: 100 } }
        mfgDate: { type: [string, "null"], maxLength: 50, description: 生产日期（ISO 日期字符串） }
        expDate: { type: [string, "null"], maxLength: 50, description: 有效期至（ISO 日期字符串） }
        remark: { type: [string, "null"], maxLength: 500 }

    WarehouseReceiptCreate:
      type: object
      required: [purchaseReceiptId, warehouseId, lines]
      description: 创建入库单（DRAFT；来源收货单必须已 RECEIVED；DIRECT_PROJECT 禁入库 P4）
      properties:
        purchaseReceiptId: { type: string, minLength: 1 }
        warehouseId: { type: string, minLength: 1 }
        locationId: { type: string, description: 库位（若提供必须属于同一 warehouse） }
        remark: { type: [string, "null"], maxLength: 500 }
        lines:
          type: array
          minItems: 1
          items: { $ref: "#/components/schemas/WarehouseReceiptLineCreate" }

    WarehouseReceiptUpdate:
      type: object
      required: [version]
      description: 仅 DRAFT；行整体替换；warehouseId 必填不可清空、locationId 可空（组合 FK 同属）
      properties:
        version: { type: integer, minimum: 1 }
        warehouseId: { type: string }
        locationId: { type: [string, "null"] }
        remark: { type: [string, "null"], maxLength: 500 }
        lines:
          type: array
          minItems: 1
          items: { $ref: "#/components/schemas/WarehouseReceiptLineCreate" }

    WarehouseReceiptPost:
      type: object
      required: [version]
      description: 过账 Gate（DRAFT → POSTED；version 乐观锁 + 幂等 ALREADY_POSTED；只有 POSTED 触发 6A IN）
      properties:
        version: { type: integer, minimum: 1 }

    WarehouseReceipt:
      type: object
      properties:
        id: { type: string }
        code: { type: string }
        purchaseReceiptId: { type: string }
        warehouseId: { type: string }
        locationId: { type: [string, "null"] }
        status: { $ref: "#/components/schemas/WarehouseReceiptStatus" }
        postedAt: { type: [string, "null"], format: date-time }
        postedById: { type: [string, "null"] }
        version: { type: integer }
        lines:
          type: array
          items: { type: object }

    WarehouseReceiptResponse:
      type: object
      required: [success, data]
      properties:
        success: { type: boolean, example: true }
        data: { $ref: "#/components/schemas/WarehouseReceipt" }

    WarehouseReceiptListResponse:
      type: object
      required: [success, data]
      properties:
        success: { type: boolean, example: true }
        data:
          type: object
          properties:
            total: { type: integer }
            page: { type: integer }
            pageSize: { type: integer }
            items:
              type: array
              items: { $ref: "#/components/schemas/WarehouseReceipt" }

    WarehouseReceiptPostResponse:
      type: object
      required: [success, data]
      properties:
        success: { type: boolean, example: true }
        data:
          type: object
          required: [id, code, status, postedAt]
          properties:
            id: { type: string }
            code: { type: string }
            status: { type: string, description: POSTED }
            postedAt: { type: string, format: date-time }

    PurchaseReturnStatus:
      type: string
      enum: [DRAFT, RETURNED, CANCELLED]
      description: 退货事实生命周期：DRAFT → RETURNED（Return Gate 落定）→ CANCELLED（仅 DRAFT）

    PurchaseReturnType:
      type: string
      enum: [REJECTED_ON_RECEIPT, RETURN_AFTER_STOCK_IN, QUALITY_ISSUE]

    PurchaseReturnDisposition:
      type: string
      enum: [REPLACE_REQUIRED, CREDIT_ONLY]
      description: |
        line-level 处置（必填）：REPLACE_REQUIRED = 供应商仍欠货 → Return Gate 同一事务内真正 reopen PO 履约
        （INSPECTION/WAREHOUSE 来源 receivedQty-=qty + remainingReceiveQty 重开；RECEIPT_LINE 不重复 reopen）；
        CREDIT_ONLY = 采购数量最终减少/财务冲减（不自动重开待交）。

    PurchaseReturnLineCreate:
      type: object
      required: [sourceRefType, quantity, disposition, returnReason]
      description: 退货行（三来源 exactly-one FK；API 强制 sourceRefType 与 FK 匹配）
      properties:
        sourceRefType:
          type: string
          enum: [RECEIPT_LINE, WAREHOUSE_RECEIPT_LINE, INSPECTION]
        sourcePurchaseReceiptLineId: { type: string, description: RECEIPT_LINE 必填（可退上限 = rejectedOnReceiptQty） }
        sourceWarehouseReceiptLineId: { type: string, description: WAREHOUSE_RECEIPT_LINE 必填（可退上限 = POSTED 入库行 quantity） }
        sourceInspectionId: { type: string, description: INSPECTION 必填（可退上限 = rejectedQty；result ≠ PENDING） }
        quantity: { type: number, format: decimal, description: 退货数量（> 0；≤ 来源可退余额，Return Gate 锁内重算累计 RETURNED） }
        disposition: { $ref: "#/components/schemas/PurchaseReturnDisposition" }
        returnReason: { type: string, minLength: 1, maxLength: 500 }
        batchNo: { type: [string, "null"], maxLength: 100, description: 已入库退货批次追溯 }
        serialNos: { type: [array, "null"], items: { type: string, maxLength: 100 } }
        remark: { type: [string, "null"], maxLength: 500 }

    PurchaseReturnCreate:
      type: object
      required: [purchaseOrderId, returnType, lines]
      description: 创建退货单（DRAFT；来源必须属于该 PO；创建即取号 PRT-）
      properties:
        purchaseOrderId: { type: string, minLength: 1 }
        returnType: { $ref: "#/components/schemas/PurchaseReturnType" }
        remark: { type: [string, "null"], maxLength: 500 }
        lines:
          type: array
          minItems: 1
          items: { $ref: "#/components/schemas/PurchaseReturnLineCreate" }

    PurchaseReturnUpdate:
      type: object
      required: [version]
      description: 仅 DRAFT；行整体替换并重新校验
      properties:
        version: { type: integer, minimum: 1 }
        returnType: { $ref: "#/components/schemas/PurchaseReturnType" }
        remark: { type: [string, "null"], maxLength: 500 }
        lines:
          type: array
          minItems: 1
          items: { $ref: "#/components/schemas/PurchaseReturnLineCreate" }

    PurchaseReturnReturn:
      type: object
      required: [version]
      description: 退货 Gate（DRAFT → RETURNED；version 乐观锁 + 幂等 ALREADY_RETURNED；锁内重算累计 RETURNED 防并发超退）
      properties:
        version: { type: integer, minimum: 1 }

    PurchaseReturn:
      type: object
      properties:
        id: { type: string }
        code: { type: string, description: PRT- 前缀取号 }
        purchaseOrderId: { type: string }
        supplierId: { type: string }
        returnType: { $ref: "#/components/schemas/PurchaseReturnType" }
        status: { $ref: "#/components/schemas/PurchaseReturnStatus" }
        returnedAt: { type: [string, "null"], format: date-time }
        returnedById: { type: [string, "null"] }
        version: { type: integer }
        lines:
          type: array
          items: { type: object }

    PurchaseReturnResponse:
      type: object
      required: [success, data]
      properties:
        success: { type: boolean, example: true }
        data: { $ref: "#/components/schemas/PurchaseReturn" }

    PurchaseReturnListResponse:
      type: object
      required: [success, data]
      properties:
        success: { type: boolean, example: true }
        data:
          type: object
          properties:
            total: { type: integer }
            page: { type: integer }
            pageSize: { type: integer }
            items:
              type: array
              items: { $ref: "#/components/schemas/PurchaseReturn" }

    PurchaseReturnReturnResponse:
      type: object
      required: [success, data]
      properties:
        success: { type: boolean, example: true }
        data:
          type: object
          required: [id, code, status, returnedAt]
          properties:
            id: { type: string }
            code: { type: string }
            status: { type: string, description: RETURNED }
            returnedAt: { type: string, format: date-time }

    # --------------------------------------------------------------------------
    # Sprint 6A — Inventory Ledger Consumer contracts
    # 红线：payload/响应**不含投影余额**（P10 Final：暂不发布 StockProjectionChanged）；Movement 历史不可变
    # --------------------------------------------------------------------------
    InventoryConsumerRunRequest:
      type: object
      description: 可选 limit（单轮 claim 上限；默认 20，上限 200）
      properties:
        limit:
          type: integer
          minimum: 1
          maximum: 200
          description: 单轮 claim 上限（可选，默认 20）

    InventoryConsumerRunResponse:
      type: object
      required: [success, data]
      properties:
        success: { type: boolean, example: true }
        data:
          type: object
          required: [claimed, processed, retried, deadLettered, leaseLost, results]
          properties:
            claimed: { type: integer, description: 本轮 claim 的 Outbox 数 }
            processed: { type: integer, description: 成功入账（PROCESSED + ALREADY_PROCESSED）数 }
            retried: { type: integer, description: 回 PENDING 退避重试数 }
            deadLettered: { type: integer, description: 永久失败（DEAD_LETTER）数 }
            leaseLost: { type: integer, description: lease 已被回收（LEASE_LOST，旧 worker 放弃）数 }
            results:
              type: array
              items: { $ref: "#/components/schemas/InventoryConsumerOutboxResult" }

    InventoryConsumerOutboxResult:
      type: object
      required: [outboxId, outcome]
      properties:
        outboxId: { type: string, description: OutboxMessage.id }
        outcome:
          type: string
          enum: [PROCESSED, ALREADY_PROCESSED, RETRY, DEAD_LETTER, LEASE_LOST]
          description: |
            PROCESSED（新入账）/ ALREADY_PROCESSED（五元幂等重放）/ RETRY（瞬时或业务失败退避）/
            DEAD_LETTER（永久失败：payload 非法、source 不存在或状态不符、超阈值）/ LEASE_LOST（lease 已被回收）。
        movementId: { type: string, description: 入账的 InventoryMovement.id（PROCESSED/ALREADY_PROCESSED 时） }
        movementNo: { type: string, description: 入账流水号 MV-xxxxxx（PROCESSED/ALREADY_PROCESSED 时） }
        error: { type: string, description: 失败原因（RETRY/DEAD_LETTER 时） }

    # ==========================================================================
    # Sprint 6B-2 — Inventory Transfer contracts（调拨 Vertical Slice，CTO #8233 授权）
    # 红线：载荷/响应**不含投影余额**（6A 唯一事实源）；Transfer API 绝不直接 INSERT InventoryMovement
    # ==========================================================================
    InventoryTransferLineCreate:
      type: object
      required: [itemId, quantity]
      description: 调拨行（quantity > 0；serial-managed 每 serial 一对 Movement，数量守恒）
      properties:
        itemId: { type: string, minLength: 1 }
        uomId: { type: string, description: 业务 UOM（可选；继承来源） }
        quantity: { type: number, exclusiveMinimum: 0, description: 调拨数量（serial-managed 时须 = serialNos.length 且整数） }
        batchNo: { type: string, description: P5 Final：batch 精确继承（SOURCE_OUT batch=B → DESTINATION_IN batch=B，首版禁止换批） }
        serialNos: { type: array, items: { type: string }, description: serial-managed：每 serial 一对 Movement（serial 精确继承不重生成） }
        mfgDate: { type: string, description: 生产日期（ISO 日期字符串） }
        expDate: { type: string, description: 有效期至（ISO 日期字符串） }
        remark: { type: string, maxLength: 500 }

    InventoryTransferCreate:
      type: object
      required: [sourceWarehouseId, destinationWarehouseId, lines]
      description: 创建调拨单（DRAFT；创建即取号 TRF；自调拨防护；transferType 服务端推导）
      properties:
        sourceWarehouseId: { type: string, minLength: 1 }
        sourceLocationId: { type: string, description: 源库位（若提供必须属于源仓库） }
        destinationWarehouseId: { type: string, minLength: 1 }
        destinationLocationId: { type: string, description: 目标库位（若提供必须属于目标仓库） }
        remark: { type: string, maxLength: 500 }
        lines:
          type: array
          minItems: 1
          items: { $ref: "#/components/schemas/InventoryTransferLineCreate" }

    InventoryTransferUpdate:
      type: object
      required: [version]
      description: 更新调拨单（仅 DRAFT；CAS version 乐观锁；行整体替换可选）
      properties:
        version: { type: integer, minimum: 1 }
        sourceWarehouseId: { type: string }
        sourceLocationId: { type: [string, "null"] }
        destinationWarehouseId: { type: string }
        destinationLocationId: { type: [string, "null"] }
        remark: { type: [string, "null"], maxLength: 500 }
        lines:
          type: array
          minItems: 1
          items: { $ref: "#/components/schemas/InventoryTransferLineCreate" }

    InventoryTransferVersionRequest:
      type: object
      required: [version]
      description: CAS 版本请求体（submit/cancel/execute 共用）
      properties:
        version: { type: integer, minimum: 1 }

    InventoryTransfer:
      type: object
      properties:
        id: { type: string }
        transferNo: { type: string, description: 调拨单号（TRF-xxxxxx） }
        status: { $ref: "#/components/schemas/InventoryTransferStatus" }
        transferType: { type: string, enum: [INTER_WAREHOUSE, INTRA_WAREHOUSE] }
        sourceWarehouseId: { type: string }
        sourceLocationId: { type: [string, "null"] }
        destinationWarehouseId: { type: string }
        destinationLocationId: { type: [string, "null"] }
        movementGroupId: { type: [string, "null"], description: EXECUTE 时生成/复用并冻结（双边共享；重试复用已有值） }
        approvedById: { type: [string, "null"] }
        executedById: { type: [string, "null"] }
        executedAt: { type: [string, "null"], format: date-time }
        version: { type: integer }
        lines:
          type: array
          items: { type: object }

    InventoryTransferStatus:
      type: string
      enum: [DRAFT, SUBMITTED, APPROVED, EXECUTED, CANCELLED]

    InventoryTransferResponse:
      type: object
      required: [success, data]
      properties:
        success: { type: boolean, example: true }
        data: { $ref: "#/components/schemas/InventoryTransfer" }

    InventoryTransferListResponse:
      type: object
      required: [success, data]
      properties:
        success: { type: boolean, example: true }
        data:
          type: object
          properties:
            total: { type: integer }
            page: { type: integer }
            pageSize: { type: integer }
            items:
              type: array
              items: { $ref: "#/components/schemas/InventoryTransfer" }

    InventoryTransferSubmitResponse:
      type: object
      required: [success, data]
      properties:
        success: { type: boolean, example: true }
        data:
          type: object
          required: [transfer, workflow]
          properties:
            transfer: { $ref: "#/components/schemas/InventoryTransfer" }
            workflow:
              type: object
              description: maybeTriggerInventoryTransferApproval 结果（triggered/instanceId/resubmitted/skipped）
              properties:
                triggered: { type: boolean }
                instanceId: { type: [string, "null"] }
                resubmitted: { type: boolean }
                skipped: { type: [string, "null"] }

    InventoryTransferExecuteResponse:
      type: object
      required: [success, data]
      properties:
        success: { type: boolean, example: true }
        data:
          type: object
          required: [transfer, movementGroupId, atomResults]
          properties:
            transfer: { $ref: "#/components/schemas/InventoryTransfer" }
            movementGroupId: { type: string, description: EXECUTE 时生成/复用并冻结的双边共享 group id（重试复用已有值） }
            atomResults:
              type: array
              description: executeLedgerAtoms 结果（每 atom inserted/movementNo）
              items:
                type: object
                properties:
                  inserted: { type: boolean, description: true=新入账 / false=五元幂等重放 }
                  movementNo: { type: string, description: 入账流水号 MV-xxxxxx }

    # ==========================================================================
    # Sprint 6B-3 — Stock Count / Inventory Adjustment components（CTO #8471 授权）
    # ==========================================================================
    StockCountCreate:
      type: object
      description: 创建盘点单（DRAFT；创建即取号 CNT；freezeStrategy=DYNAMIC）
      properties:
        remark: { type: string, maxLength: 500 }

    StockCountUpdate:
      type: object
      required: [version]
      description: 更新盘点单 header（仅 DRAFT；CAS version 乐观锁）
      properties:
        version: { type: integer, minimum: 1 }
        remark: { type: [string, "null"], maxLength: 500 }

    StockCountVersionRequest:
      type: object
      required: [version]
      description: 通用 version 乐观锁请求（complete/cancel）
      properties:
        version: { type: integer, minimum: 1 }

    StockCountLines:
      type: object
      required: [lines]
      description: 录入盘点行（per-line atomic snapshot；五维唯一；首次录入自动转 COUNTING）
      properties:
        lines:
          type: array
          minItems: 1
          items:
            type: object
            required: [warehouseId, itemId, countedQty]
            properties:
              id: { type: string, description: 提供则更新该行（重新 snapshot），否则新增 }
              warehouseId: { type: string, minLength: 1 }
              locationId: { type: [string, "null"] }
              itemId: { type: string, minLength: 1 }
              batchNo: { type: [string, "null"], maxLength: 100 }
              serialNo: { type: [string, "null"], maxLength: 100, description: 单值（serial-managed 逐 serial 盘点） }
              countedQty: { type: number, minimum: 0, description: 实盘数（>= 0） }
              remark: { type: string, maxLength: 500 }

    StockCount:
      type: object
      description: 盘点单（实盘事实——本身不产生 Movement；差异经 Adjustment 落账）
      properties:
        id: { type: string }
        countNo: { type: string, description: 盘点单号（CNT-xxxxxx） }
        status: { type: string, enum: [DRAFT, COUNTING, COMPLETED, ADJUSTED, CANCELLED] }
        freezeStrategy: { type: string, enum: [DYNAMIC] }
        countedById: { type: [string, "null"] }
        completedAt: { type: [string, "null"], format: date-time }
        remark: { type: [string, "null"] }
        version: { type: integer }
        createdAt: { type: string, format: date-time }
        updatedAt: { type: string, format: date-time }

    StockCountLine:
      type: object
      description: 盘点行（per-line atomic snapshot：bookQtyAtCount/countedAt/ledgerWatermark/varianceQty）
      properties:
        id: { type: string }
        countHeaderId: { type: string }
        warehouseId: { type: string }
        locationId: { type: [string, "null"] }
        itemId: { type: string }
        batchNo: { type: [string, "null"] }
        serialNo: { type: [string, "null"] }
        countedQty: { type: string, description: 实盘数（Decimal 字符串） }
        bookQtyAtCount: { type: string, description: 录入时同事务读取五维 StockProjection.onHandQty（Decimal 字符串） }
        countedAt: { type: string, format: date-time }
        ledgerWatermark: { type: [string, "null"], description: 仅审计/重放证据（movementNo 不作并发时序主键） }
        varianceQty: { type: [string, "null"], description: countedQty - bookQtyAtCount（Decimal 字符串） }

    StockCountResponse:
      type: object
      required: [success, data]
      properties:
        success: { type: boolean, example: true }
        data:
          type: object
          properties:
            count:
              type: object
              properties:
                id: { type: string }
                countNo: { type: string }
                status: { type: string }
                freezeStrategy: { type: string }
                lines: { type: array, items: { $ref: "#/components/schemas/StockCountLine" } }

    StockCountListResponse:
      type: object
      required: [success, data]
      properties:
        success: { type: boolean, example: true }
        data:
          type: object
          properties:
            total: { type: integer }
            page: { type: integer }
            pageSize: { type: integer }
            items: { type: array, items: { $ref: "#/components/schemas/StockCount" } }

    StockCountCompleteResponse:
      type: object
      required: [success, data]
      properties:
        success: { type: boolean, example: true }
        data:
          type: object
          properties:
            count: { $ref: "#/components/schemas/StockCount" }
            adjustment:
              type: [object, "null"]
              description: 非零差异自动生成的 COUNT_VARIANCE Adjustment（DRAFT，仍需审批）
              properties:
                id: { type: string }
                adjustmentNo: { type: string }

    InventoryAdjustmentLineCreate:
      type: object
      required: [warehouseId, itemId, direction, quantity]
      description: 调整行（direction 行级 IN/OUT；quantity 恒正；serial-managed 逐 serial 原子化）
      properties:
        warehouseId: { type: string, minLength: 1 }
        locationId: { type: [string, "null"] }
        itemId: { type: string, minLength: 1 }
        batchNo: { type: [string, "null"], maxLength: 100 }
        serialNo: { type: [string, "null"], maxLength: 100 }
        direction: { type: string, enum: [IN, OUT] }
        quantity: { type: number, exclusiveMinimum: 0, description: 恒正数（方向在行承载正负） }
        uomId: { type: string }
        sourceStockCountLineId: { type: [string, "null"], description: 盘点行追溯（@unique 防双重入账；Manual 可空） }
        remark: { type: string, maxLength: 500 }

    InventoryAdjustmentCreate:
      type: object
      required: [reasonCode, lines]
      description: 创建调整单（DRAFT；创建即取号 ADJ；Manual 或引用 Count 差异；Minor Hardening ② 来源一致性）
      properties:
        reasonCode: { type: string, maxLength: 50, description: 系统保留码（COUNT_VARIANCE/DAMAGE/LOSS/GIFT/SYSTEM_CORRECTION/MANUAL）+ 可扩展字典 }
        sourceStockCountId: { type: [string, "null"], description: 来源盘点单（可空——Manual 无盘点来源） }
        remark: { type: string, maxLength: 500 }
        lines:
          type: array
          minItems: 1
          items: { $ref: "#/components/schemas/InventoryAdjustmentLineCreate" }

    InventoryAdjustmentUpdate:
      type: object
      required: [version]
      description: 更新调整单（仅 DRAFT；CAS version；行整体替换可选）
      properties:
        version: { type: integer, minimum: 1 }
        reasonCode: { type: string, maxLength: 50 }
        remark: { type: [string, "null"], maxLength: 500 }
        lines:
          type: array
          minItems: 1
          items: { $ref: "#/components/schemas/InventoryAdjustmentLineCreate" }

    InventoryAdjustmentVersionRequest:
      type: object
      required: [version]
      description: 通用 version 乐观锁请求（submit/apply/cancel）
      properties:
        version: { type: integer, minimum: 1 }

    InventoryAdjustment:
      type: object
      description: 库存调整单（受控库存账事实——只能经 Shared LedgerCommand 追加 ADJUSTMENT Movement）
      properties:
        id: { type: string }
        adjustmentNo: { type: string, description: 调整单号（ADJ-xxxxxx） }
        status: { type: string, enum: [DRAFT, SUBMITTED, APPROVED, APPLIED, CANCELLED] }
        reasonCode: { type: string }
        sourceStockCountId: { type: [string, "null"] }
        approvedById: { type: [string, "null"] }
        appliedById: { type: [string, "null"] }
        appliedAt: { type: [string, "null"], format: date-time }
        createdById: { type: string, description: NOT NULL——maker-checker 闭环 }
        version: { type: integer }
        createdAt: { type: string, format: date-time }
        updatedAt: { type: string, format: date-time }

    InventoryAdjustmentLine:
      type: object
      description: 调整行（每行 → 一笔 ADJUSTMENT Movement；direction 行级；sourceStockCountLineId @unique）
      properties:
        id: { type: string }
        adjustmentHeaderId: { type: string }
        warehouseId: { type: string }
        locationId: { type: [string, "null"] }
        itemId: { type: string }
        batchNo: { type: [string, "null"] }
        serialNo: { type: [string, "null"] }
        direction: { type: string, enum: [IN, OUT] }
        quantity: { type: string, description: 恒正数（Decimal 字符串） }
        uomId: { type: [string, "null"] }
        sourceStockCountLineId: { type: [string, "null"], description: @unique 防双重入账 }

    InventoryAdjustmentResponse:
      type: object
      required: [success, data]
      properties:
        success: { type: boolean, example: true }
        data:
          type: object
          properties:
            adjustment:
              type: object
              properties:
                id: { type: string }
                adjustmentNo: { type: string }
                status: { type: string }
                reasonCode: { type: string }
                lines: { type: array, items: { $ref: "#/components/schemas/InventoryAdjustmentLine" } }

    InventoryAdjustmentListResponse:
      type: object
      required: [success, data]
      properties:
        success: { type: boolean, example: true }
        data:
          type: object
          properties:
            total: { type: integer }
            page: { type: integer }
            pageSize: { type: integer }
            items: { type: array, items: { $ref: "#/components/schemas/InventoryAdjustment" } }

    InventoryAdjustmentSubmitResponse:
      type: object
      required: [success, data]
      properties:
        success: { type: boolean, example: true }
        data:
          type: object
          properties:
            adjustment: { $ref: "#/components/schemas/InventoryAdjustment" }
            workflow:
              type: object
              description: maybeTriggerInventoryAdjustmentApproval 结果（triggered/instanceId/resubmitted/skipped）
              properties:
                triggered: { type: boolean }
                instanceId: { type: [string, "null"] }
                resubmitted: { type: boolean }
                skipped: { type: [string, "null"] }

    InventoryAdjustmentApplyResponse:
      type: object
      required: [success, data]
      properties:
        success: { type: boolean, example: true }
        data:
          type: object
          required: [adjustment, atomResults]
          properties:
            adjustment: { $ref: "#/components/schemas/InventoryAdjustment" }
            atomResults:
              type: array
              description: executeLedgerAtoms 结果（每 atom inserted/movementNo）
              items:
                type: object
                properties:
                  inserted: { type: boolean, description: true=新入账 / false=五元幂等重放 }
                  movementNo: { type: string, description: 入账流水号 MV-xxxxxx }

    # ==========================================================================
    # Sprint 6B-4 — Inventory Conversion / Repack components（CTO #8658 授权）
    # ==========================================================================
    InventoryConversionLineCreate:
      type: object
      required: [lineRole, quantity, uomId, uomToBaseRate, warehouseId]
      description: 转换行（CONSUME/PRODUCE 各一条；**baseQuantity 由服务端 canonical 计算，客户端不提交**）
      properties:
        lineRole: { type: string, enum: [CONSUME, PRODUCE] }
        quantity: { type: number, exclusiveMinimum: 0, description: 业务 UOM 数量（> 0） }
        uomId: { type: string, description: 业务 UOM }
        uomToBaseRate: { type: number, exclusiveMinimum: 0, description: 行级换算率 snapshot（业务 UOM → base UOM，> 0） }
        warehouseId: { type: string, minLength: 1 }
        locationId: { type: [string, "null"] }
        batchNo: { type: [string, "null"], maxLength: 100, description: P5 Final：batch 精确继承（CONSUME → PRODUCE 同值） }
        remark: { type: string, maxLength: 500 }

    InventoryConversionCreate:
      type: object
      required: [itemId, baseUomId, lines]
      description: 创建转换单（DRAFT；创建即取号 CVT；baseUomId 必须 == Item.stockUomId；恰好 1 CONSUME + 1 PRODUCE）
      properties:
        itemId: { type: string, minLength: 1, description: 同一 itemId（首版 Repack/UOM Conversion，禁止多物料） }
        baseUomId: { type: string, minLength: 1, description: Inventory Base UOM（service Gate 验证 == Item.stockUomId） }
        remark: { type: string, maxLength: 500 }
        lines:
          type: array
          minItems: 2
          maxItems: 2
          items: { $ref: "#/components/schemas/InventoryConversionLineCreate" }

    InventoryConversionUpdate:
      type: object
      required: [version]
      description: 更新转换单（仅 DRAFT；CAS version；行整体替换可选；itemId/baseUomId 不可编辑）
      properties:
        version: { type: integer, minimum: 1 }
        remark: { type: [string, "null"], maxLength: 500 }
        lines:
          type: array
          minItems: 2
          maxItems: 2
          items: { $ref: "#/components/schemas/InventoryConversionLineCreate" }

    InventoryConversionVersionRequest:
      type: object
      required: [version]
      description: 通用 version 乐观锁请求（submit/execute/cancel）
      properties:
        version: { type: integer, minimum: 1 }

    InventoryConversion:
      type: object
      description: 库存转换单（同 item Repack / UOM Conversion——CONSUME + PRODUCE 同一 movementGroupId 原子落账）
      properties:
        id: { type: string }
        conversionNo: { type: string, description: 转换单号（CVT-xxxxxx） }
        status: { type: string, enum: [DRAFT, SUBMITTED, EXECUTED, CANCELLED] }
        itemId: { type: string }
        baseUomId: { type: string }
        movementGroupId: { type: [string, "null"], description: EXECUTE 时生成/复用并冻结（CONSUME+PRODUCE 共享） }
        executedById: { type: [string, "null"] }
        executedAt: { type: [string, "null"], format: date-time }
        version: { type: integer }
        createdAt: { type: string, format: date-time }
        updatedAt: { type: string, format: date-time }

    InventoryConversionLine:
      type: object
      description: 转换行（lineRole=CONSUME/PRODUCE；uomToBaseRate 行级 snapshot；baseQuantity canonical 服务端计算）
      properties:
        id: { type: string }
        conversionHeaderId: { type: string }
        lineRole: { type: string, enum: [CONSUME, PRODUCE] }
        quantity: { type: string, description: 业务 UOM 数量（Decimal 字符串） }
        uomId: { type: [string, "null"] }
        uomToBaseRate: { type: string, description: 行级换算率（Decimal 字符串，> 0） }
        baseQuantity: { type: string, description: canonical 数量 = quantity × uomToBaseRate（Decimal 字符串，服务端计算） }
        warehouseId: { type: string }
        locationId: { type: [string, "null"] }
        batchNo: { type: [string, "null"] }

    InventoryConversionResponse:
      type: object
      required: [success, data]
      properties:
        success: { type: boolean, example: true }
        data:
          type: object
          properties:
            conversion:
              type: object
              properties:
                id: { type: string }
                conversionNo: { type: string }
                status: { type: string }
                itemId: { type: string }
                baseUomId: { type: string }
                lines: { type: array, items: { $ref: "#/components/schemas/InventoryConversionLine" } }

    InventoryConversionListResponse:
      type: object
      required: [success, data]
      properties:
        success: { type: boolean, example: true }
        data:
          type: object
          properties:
            total: { type: integer }
            page: { type: integer }
            pageSize: { type: integer }
            items: { type: array, items: { $ref: "#/components/schemas/InventoryConversion" } }

    InventoryConversionExecuteResponse:
      type: object
      required: [success, data]
      properties:
        success: { type: boolean, example: true }
        data:
          type: object
          required: [conversion, atomResults]
          properties:
            conversion: { $ref: "#/components/schemas/InventoryConversion" }
            atomResults:
              type: array
              description: executeLedgerAtoms 结果（每 atom inserted/movementNo）
              items:
                type: object
                properties:
                  inserted: { type: boolean, description: true=新入账 / false=五元幂等重放 }
                  movementNo: { type: string, description: 入账流水号 MV-xxxxxx }

    SupplierInvoiceLineCreate:
      type: object
      required: [purchaseOrderLineId, warehouseReceiptLineId, quantity, unitPrice, taxRate]
      description: 供应商发票行（双溯源必填——PO Line + POSTED WHR Line；**不收金额**——服务端计算）
      properties:
        purchaseOrderLineId: { type: string, description: 溯源 PO Line（不变量① 承诺来源） }
        warehouseReceiptLineId: { type: string, description: 溯源入库行（数量匹配基准；必须来自 POSTED WHR——红线 1） }
        quantity: { type: number, description: 开票数量（> 0；≤ 已入库数量——红线 1） }
        unitPrice: { type: number, description: 单价（> 0；与 PO 快照单价比对） }
        taxRate: { type: number, description: 税率快照（0-100 百分比；DB CHECK 兜底） }
        vatRecoverable: { type: boolean, default: true, description: P9 Final：true → Input VAT；false → nonRecoverableTaxAmount }
        remark: { type: string }

    SupplierInvoiceCreate:
      type: object
      required: [supplierId, supplierInvoiceNo, invoiceDate, receivedDate, lines]
      description: 供应商发票创建（DRAFT；创建即取号 SINV——P1 Final；**不收头金额**——服务端聚合）
      properties:
        supplierId: { type: string }
        supplierInvoiceNo: { type: string, description: 供应商发票号（供应商侧唯一；不变量② 与 supplierId 组合唯一） }
        invoiceDate: { type: string, format: date }
        receivedDate: { type: string, format: date }
        currency: { type: string, default: "CNY" }
        exchangeRate: { type: number, default: 1, description: 创建时快照 FX（P2 Final） }
        paymentDueDate: { type: string, format: date }
        remark: { type: string }
        lines:
          type: array
          minItems: 1
          items: { $ref: "#/components/schemas/SupplierInvoiceLineCreate" }

    SupplierInvoiceUpdate:
      type: object
      required: [version]
      description: 供应商发票更新（仅 DRAFT；CAS version；行整体替换；supplierId/supplierInvoiceNo/currency/exchangeRate 不可编辑）
      properties:
        version: { type: integer, minimum: 1 }
        invoiceDate: { type: string, format: date }
        receivedDate: { type: string, format: date }
        paymentDueDate: { type: [string, "null"], format: date }
        remark: { type: [string, "null"] }
        lines:
          type: array
          minItems: 1
          items: { $ref: "#/components/schemas/SupplierInvoiceLineCreate" }

    SupplierInvoiceVersionRequest:
      type: object
      required: [version]
      description: 通用 version 乐观锁请求（submit）
      properties:
        version: { type: integer, minimum: 1 }

    SupplierInvoice:
      type: object
      description: 供应商发票（RECEIPT_BASED 首版；DRAFT/SUBMITTED——Match/Approval/POST 属 5C-1B/1C）
      properties:
        id: { type: string }
        invoiceNo: { type: string, description: 发票单号（SINV-xxxxxx） }
        supplierInvoiceNo: { type: string }
        supplierId: { type: string }
        invoiceDate: { type: string, format: date }
        receivedDate: { type: string, format: date }
        currency: { type: string }
        exchangeRate: { type: string, description: Decimal 字符串（创建时快照 FX） }
        documentStatus: { type: string, enum: [DRAFT, SUBMITTED, MATCHED, APPROVED, POSTED, CANCELLED] }
        settlementStatus: { type: string, enum: [UNPAID, PARTIALLY_PAID, PAID] }
        netAmount: { type: string, description: 不含税总额（Decimal 字符串，服务端聚合） }
        taxAmount: { type: string, description: 税额合计（Decimal 字符串） }
        grossAmount: { type: string, description: 含税总额 = net + tax（Decimal 字符串） }
        paymentDueDate: { type: [string, "null"], format: date }
        version: { type: integer }
        createdAt: { type: string, format: date-time }
        updatedAt: { type: string, format: date-time }

    SupplierInvoiceLine:
      type: object
      description: 供应商发票行（双溯源；金额服务端计算）
      properties:
        id: { type: string }
        supplierInvoiceId: { type: string }
        purchaseOrderLineId: { type: string }
        warehouseReceiptLineId: { type: string }
        itemId: { type: [string, "null"] }
        lineNo: { type: integer }
        quantity: { type: string, description: 开票数量（Decimal 字符串） }
        unitPrice: { type: string, description: 单价（Decimal 字符串） }
        netAmount: { type: string, description: 行净额 = quantity × unitPrice（Decimal 字符串，服务端） }
        taxRate: { type: string, description: 税率快照（Decimal 字符串） }
        taxAmount: { type: string, description: 行税额 = netAmount × taxRate / 100（Decimal 字符串，服务端） }
        vatRecoverable: { type: boolean }
        nonRecoverableTaxAmount: { type: string, description: vatRecoverable=false → = taxAmount（P9 Final，Decimal 字符串） }

    SupplierInvoiceResponse:
      type: object
      required: [success, data]
      properties:
        success: { type: boolean, example: true }
        data:
          type: object
          properties:
            invoice:
              type: object
              properties:
                id: { type: string }
                invoiceNo: { type: string }
                supplierInvoiceNo: { type: string }
                supplierId: { type: string }
                documentStatus: { type: string }
                settlementStatus: { type: string }
                netAmount: { type: string }
                taxAmount: { type: string }
                grossAmount: { type: string }
                lines:
                  type: array
                  items: { $ref: "#/components/schemas/SupplierInvoiceLine" }

    SupplierInvoiceListResponse:
      type: object
      required: [success, data]
      properties:
        success: { type: boolean, example: true }
        data:
          type: object
          properties:
            total: { type: integer }
            page: { type: integer }
            pageSize: { type: integer }
            items:
              type: array
              items:
                type: object
                properties:
                  id: { type: string }
                  invoiceNo: { type: string }
                  supplierInvoiceNo: { type: string }
                  supplierId: { type: string }
                  documentStatus: { type: string }
                  settlementStatus: { type: string }
                  grossAmount: { type: string }

    SupplierInvoiceMatchResponse:
      type: object
      required: [success, data]
      description: 5C-1B Immutable 3-Way Match 响应（Match/Approval 分层——CTO #9238/#9247）
      properties:
        success: { type: boolean, example: true }
        data:
          type: object
          properties:
            invoice:
              type: object
              properties:
                id: { type: string }
                invoiceNo: { type: string }
                documentStatus: { type: string }
                currentMatchRunId: { type: [string, "null"], description: 当前投影（历史走 immutable MatchRun） }
                lines:
                  type: array
                  items:
                    type: object
                    properties:
                      id: { type: string }
                      currentMatchStatus: { type: string, enum: [MATCHED, VARIANCE, PENDING] }
                      currentMatchRunId: { type: [string, "null"] }
                      matchedQty: { type: string, description: = min(invoiceQty, 可用入库量)（Decimal 字符串，服务端） }
                      varianceQty: { type: string }
                      variancePrice: { type: string }
                      varianceTax: { type: string }
            matchRun:
              type: object
              description: immutable MatchRun（DB trigger 禁止后续 UPDATE/DELETE）
              properties:
                id: { type: string }
                runNo: { type: integer }
                revision: { type: integer, description: 不可变快照标识（Approval 引用） }
                result: { type: string, enum: [MATCHED, VARIANCE] }
                disposition: { type: string, enum: [ACCEPT, REJECT, HOLD, CREATE_CN_DN] }
                runAt: { type: string, format: date-time }
                runById: { type: [string, "null"] }
                lines:
                  type: array
                  description: immutable MatchLines（snapshot 全服务端生成）
                  items:
                    type: object
                    properties:
                      id: { type: string }
                      supplierInvoiceLineId: { type: string }
                      purchaseOrderLineId: { type: string }
                      warehouseReceiptLineId: { type: string }
                      poQty: { type: string }
                      receiptQty: { type: string }
                      invoiceQty: { type: string }
                      poUnitPrice: { type: string }
                      invoiceUnitPrice: { type: string }
                      qtyVariance: { type: string }
                      priceVariance: { type: string }
                      taxVariance: { type: string }
                      result: { type: string, enum: [MATCHED, VARIANCE] }
                      disposition: { type: string, enum: [ACCEPT, REJECT, HOLD, CREATE_CN_DN] }
