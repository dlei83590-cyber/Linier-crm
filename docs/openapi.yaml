        progressPercent: { type: number, nullable: true }
        expectedContractAmount: { type: number, nullable: true }
        expectedProfit: { type: number, nullable: true }
        expectedGrossMarginRate: { type: number, nullable: true }
        paymentStatus: { $ref: "#/components/schemas/PaymentStatus" }
