      tags: [Deliveries]
      summary: List deliveries (paginated; code/salesOrderId/customerId/status/date filters)
      description: |
        本阶段不开放 POST /api/deliveries——Direct Delivery 未获 CTO 批准（锁定项①），
        唯一创建入口为 POST /api/sales-orders/{id}/deliveries。
      operationId: listDeliveries
      security:
        - bearerAuth: []
      parameters:
        - { name: page, in: query, required: false, schema: { type: integer, default: 1 } }
        - { name: pageSize, in: query, required: false, schema: { type: integer, default: 20, maximum: 100 } }
        - { name: code, in: query, required: false, schema: { type: string } }
        - { name: salesOrderId, in: query, required: false, schema: { type: string } }
        - { name: customerId, in: query, required: false, schema: { type: string } }
        - { name: status, in: query, required: false, schema: { $ref: "#/components/schemas/DeliveryStatus" } }
