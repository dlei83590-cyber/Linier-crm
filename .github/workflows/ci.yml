name: CI

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

jobs:
  quality:
    name: Quality Gates
    runs-on: ubuntu-latest
    env:
      DATABASE_URL: postgresql://nilier:nilier@localhost:5432/nilier_crm?schema=public
      PRISMA_SKIP_POSTINSTALL_GENERATE: "true"
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
        with:
          version: 9.14.4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: Install dependencies
        run: |
          if [ -f pnpm-lock.yaml ]; then
            pnpm install --frozen-lockfile
          else
            pnpm install
          fi
      - name: Lint
        run: pnpm lint
      - name: RBAC Catalog Static Gate (ADR-0028)
        run: node scripts/check-rbac-catalog.mjs
      - name: Error Codes Catalog Gate (SSOT=errors.ts)
        run: node scripts/gen-error-codes.mjs --check
      - name: Generate Prisma Client
        run: pnpm db:generate
      - name: Type check
        run: pnpm type-check
      - name: Unit tests
        run: pnpm test

  build:
    name: Build
    runs-on: ubuntu-latest
    needs: quality
    env:
      DATABASE_URL: postgresql://nilier:nilier@localhost:5432/nilier_crm?schema=public
      # Build-time release metadata (P0.5): NEXT_PUBLIC_APP_VERSION 由 next.config.ts 从 root package.json 读取
      NEXT_PUBLIC_GIT_SHA: ${{ github.sha }}
      NEXT_PUBLIC_BUILD_ID: ${{ github.run_id }}
      NEXT_PUBLIC_DEPLOYMENT_ENV: ci
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
        with:
          version: 9.14.4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: Install dependencies
        run: |
          if [ -f pnpm-lock.yaml ]; then
            pnpm install --frozen-lockfile
          else
            pnpm install
          fi
      - name: Generate Prisma Client
        run: pnpm db:generate
      - name: Build
        run: pnpm build

  secret-scan:
    name: Secret Scanning
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: Scan for secrets
        uses: gitleaks/gitleaks-action@v2
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

