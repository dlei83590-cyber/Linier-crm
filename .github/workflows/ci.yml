name: CI

on:
  pull_request:
  push:
    branches: [main]

permissions:
  contents: read

jobs:
  quality:
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:17-alpine
        env:
          POSTGRES_DB: linier_crm_test
          POSTGRES_USER: linier
          POSTGRES_PASSWORD: linier
        ports: ["5432:5432"]
        options: >-
          --health-cmd "pg_isready -U linier -d linier_crm_test"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10
    env:
      DATABASE_URL: postgresql://linier:linier@localhost:5432/linier_crm_test?schema=public
      JWT_SECRET: ci-only-secret-at-least-thirty-two-characters
      JWT_ISSUER: linier-crm
      JWT_AUDIENCE: linier-crm-web
      NODE_ENV: test
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - run: npm install
      - run: npm run prisma:generate
      - run: npm run prisma:migrate
      - run: npm run prisma:seed
      - run: npm run format:check
      - run: npm run lint
      - run: npm run typecheck
      - run: npm test
      - run: npm run swagger
      - run: npm run jwt
      - run: npm run rbac
      - run: npm run build
