services:
  app:
    build:
      context: .
      dockerfile: Dockerfile
      target: runner
      args:
        # 生产 build metadata 由构建环境平台变量注入（Railway/GitHub），
        # next.config.ts 构建时直接读取；此处仅作显式覆盖通道，默认空值。
        NEXT_PUBLIC_GIT_SHA: ${NEXT_PUBLIC_GIT_SHA:-}
        NEXT_PUBLIC_BUILD_ID: ${NEXT_PUBLIC_BUILD_ID:-}
        NEXT_PUBLIC_DEPLOYMENT_ENV: ${NEXT_PUBLIC_DEPLOYMENT_ENV:-production}
    container_name: nilier-crm-app
    ports:
      - "3000:3000"
    environment:
      - NODE_ENV=production
      - DATABASE_URL=${DATABASE_URL}
      - NEXTAUTH_SECRET=${NEXTAUTH_SECRET}
      - NEXTAUTH_URL=${NEXTAUTH_URL}
    depends_on:
      postgres:
        condition: service_healthy
    healthcheck:
      test: ["CMD", "wget", "-qO-", "http://127.0.0.1:3000/api/health/ready"]
      interval: 30s
      timeout: 5s
      retries: 3
      start_period: 15s
    restart: unless-stopped
    networks:
      - nilier-network

  postgres:
    image: postgres:16-alpine
    container_name: nilier-crm-postgres
    environment:
      - POSTGRES_USER=${POSTGRES_USER:-nilier}
      - POSTGRES_PASSWORD=${POSTGRES_PASSWORD:?POSTGRES_PASSWORD is required}
      - POSTGRES_DB=${POSTGRES_DB:-nilier_crm}
    volumes:
      - postgres-data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER:-nilier} -d ${POSTGRES_DB:-nilier_crm}"]
      interval: 5s
      timeout: 5s
      retries: 5
    restart: unless-stopped
    networks:
      - nilier-network
    # Production: do not expose postgres to the host by default.
    # Uncomment only if external tooling requires direct DB access.
    # ports:
    #   - "5432:5432"

volumes:
  postgres-data:

networks:
  nilier-network:
    driver: bridge
